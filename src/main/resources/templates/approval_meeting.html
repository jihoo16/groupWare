<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회의록', '/css/approval_meeting.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-users"></i> 문서 작성 > 회의록</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('meeting')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="approval-sign-cell" data-slot="C1602">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell" data-slot="C1603">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell signature-offline">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                    </tr>

                                </table>
                            </div>

                            <h2 class="doc-title">회 의 록</h2>

                            <table class="form-table">
                                <tr>
                                    <th>과제명</th>
                                    <td colspan="3">
                                        <select id="projectName" class="form-control">
                                            <option value="">선택 안함</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <th>회의명</th>
                                    <td colspan="3"><input type="text" id="meetingTitle" placeholder="회의 제목"></td>
                                </tr>
                                <tr>
                                    <th>작성자</th>
                                    <td><input type="text" id="userName" th:value="${userName}" readonly>
                                    <input type="hidden" id="userIdx" th:value="${userIdx}" readonly></td>
                                    <th>일시</th>
                                    <td><input type="datetime-local" id="meetingDatetime"></td>
                                </tr>
                                <tr>
                                    <th>장소</th>
                                    <td colspan="3"><input type="text" id="location" placeholder="회의 장소"></td>
                                </tr>
                                <tr>
                                    <th>참석자</th>
                                    <td colspan="3"><input type="text" id="participants" placeholder="참석자 이름 (예: 홍길동, 김철수, 박영희)"></td>
                                </tr>
                                <tr>
                                    <th>회의 목적</th>
                                    <td colspan="3"><textarea id="purpose" placeholder="회의 목적 및 배경" rows="3"></textarea></td>
                                </tr>
                                <tr>
                                    <th>회의 내용</th>
                                    <td colspan="3"><textarea id="content" placeholder="논의된 주요 내용" rows="8"></textarea></td>
                                </tr>
                                <tr>
                                    <th>결정 사항</th>
                                    <td colspan="3"><textarea id="decisions" placeholder="회의를 통해 결정된 사항" rows="5"></textarea></td>
                                </tr>
                                <tr>
                                    <th>Action Items</th>
                                    <td colspan="3"><textarea id="actionItems" placeholder="후속 조치 및 담당자" rows="4"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 전자서명 QR 모달 프래그먼트 -->
    <div th:replace="~{fragments/signature-modal :: signature-modal}"></div>

    <script th:src="@{/js/approval_meeting.js}"></script>
</body>
</html>
