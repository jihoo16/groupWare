<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('알림 다시 보내기', '/css/notification-retry.css')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('')}"></div>

    <main class="main-content">
        <div class="retry-content" id="notifRetryRoot">

            <div class="retry-card">
                <h1 class="retry-title">알림 다시 보내기</h1>
                <p class="retry-subtitle">상대방에게 도달하지 못한 알림을 다시 발송합니다.</p>

                <!-- 원본 알림 정보 -->
                <div class="retry-section">
                    <h3 class="section-title icon-info"><i class="fas fa-paper-plane"></i> 원본 알림</h3>
                    <dl class="retry-info-grid">
                        <dt>받을 사람</dt><dd id="retryRecipient">-</dd>
                        <dt>알림 종류</dt><dd id="retryTypeName">-</dd>
                        <dt>원본 문서</dt><dd id="retryDocument">-</dd>
                        <dt>요청 시각</dt><dd id="retryCreatedAt">-</dd>
                    </dl>
                </div>

                <!-- 도달 실패 사유 -->
                <div class="retry-section">
                    <h3 class="section-title icon-error"><i class="fas fa-exclamation-circle"></i> 도달 실패 사유</h3>
                    <div class="retry-failure-reason" id="retryFailureReason">-</div>
                    <div class="retry-attempt-line" id="retryAttemptLine">-</div>
                </div>

                <!-- 안내 -->
                <div class="retry-section">
                    <h3 class="section-title icon-tip"><i class="fas fa-lightbulb"></i> 다시 보내기 전에 확인하세요</h3>
                    <ul class="retry-tip-list">
                        <li>봇 차단이 원인이라면 상대방에게 봇 차단 해제를 부탁하세요.</li>
                        <li>그래도 안 가면 메신저로 직접 연락하시는 게 빠릅니다.</li>
                        <li id="retryUserCount">같은 원본에 대해 5회까지 재시도 가능 (현재 0/5)</li>
                    </ul>
                </div>

                <div class="retry-actions">
                    <button class="btn-close" id="btnClose">
                        <i class="fas fa-times"></i> 닫기
                    </button>
                    <button class="btn-retry" id="btnRetry">
                        <i class="fas fa-redo"></i> 다시 보내기
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script th:src="@{/js/notification-retry.js}" defer></script>
</body>
</html>
