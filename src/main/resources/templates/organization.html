<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ERP 시스템 - 조직도', '/css/organization.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('organization')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-sitemap"></i> 조직도</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="orgSearch" placeholder="이름, 부서 검색...">
                    </div>
                </div>
            </header>

            <div class="org-container">
                <!-- 좌측: 계층식 조직 트리 -->
                <div class="org-tree-section">
                    <div class="tree-header">
                        <h3><i class="fas fa-building"></i> 조직 구조</h3>
                        <button class="btn-expand-all" id="expandAllBtn">
                            <i class="fas fa-plus-square"></i> 전체 펼치기
                        </button>
                    </div>
                    <div class="org-tree" id="orgTree">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <!-- 우측: 선택한 직원 상세 정보 -->
                <div class="employee-detail-section">
                    <div class="detail-placeholder" id="detailPlaceholder">
                        <i class="fas fa-user-circle"></i>
                        <p>직원을 선택하면<br>상세 정보가 표시됩니다</p>
                    </div>
                    <div class="employee-detail" id="employeeDetail" style="display: none;">
                        <div class="detail-header">
                            <div class="detail-avatar">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div class="detail-basic">
                                <h2 class="detail-name" id="detailName"></h2>
                                <p class="detail-position" id="detailPosition"></p>
                                <span class="status-badge" id="detailStatus">재직중</span>
                            </div>
                            <button class="btn-copy-card" id="copyCardBtn">
                                <i class="fas fa-clipboard"></i>
                                <span>명함 복사</span>
                            </button>
                        </div>
                        <div class="detail-body">
                            <div class="detail-section">
                                <h4><i class="fas fa-building"></i> 소속 정보</h4>
                                <div class="detail-info-grid">
                                    <div class="info-item">
                                        <span class="info-label">부서</span>
                                        <span class="info-value" id="detailDepartment"></span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">직급</span>
                                        <span class="info-value" id="detailRank"></span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">입사일</span>
                                        <span class="info-value" id="detailJoinDate"></span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">근속연수</span>
                                        <span class="info-value" id="detailYears"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="detail-section">
                                <h4><i class="fas fa-address-card"></i> 연락처 정보</h4>
                                <div class="detail-info-grid">
                                    <div class="info-item">
                                        <span class="info-label">이메일</span>
                                        <span class="info-value" id="detailEmail"></span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">휴대전화</span>
                                        <span class="info-value" id="detailPhone"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="detail-section">
                                <h4><i class="fas fa-user-friends"></i> 보고 체계</h4>
                                <div class="detail-info-grid">
                                    <div class="info-item">
                                        <span class="info-label">상위 보고자</span>
                                        <span class="info-value" id="detailManager"></span>
                                    </div>
                                    <div class="info-item info-item-full">
                                        <span class="info-label">하위 팀원</span>
                                        <div class="team-members-list" id="detailTeamMembers"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
<!--                        <div class="detail-actions">-->
<!--                            <button class="btn-action btn-primary">-->
<!--                                <i class="fas fa-comments"></i> 메신저-->
<!--                            </button>-->
<!--                            <button class="btn-action btn-secondary">-->
<!--                                <i class="fas fa-envelope"></i> 메일-->
<!--                            </button>-->
<!--                            <button class="btn-action btn-secondary">-->
<!--                                <i class="fas fa-calendar"></i> 일정 공유-->
<!--                            </button>-->
<!--                        </div>-->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/search-utils.js}"></script>
    <script th:src="@{/js/organization.js}"></script>
</body>
</html>
