<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('출장신청', '/css/approval_business_trip.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-plane"></i> 문서 작성 > 출장신청</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('business-trip')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="doc-approval-sign" data-slot="C1602">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="doc-approval-sign" data-slot="C1603">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="doc-approval-sign signature-offline">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                    </tr>

                                </table>
                            </div>

                            <h2 class="doc-title">출 장 신 청 서</h2>

                            <table class="form-table">
                                <tr>
                                    <th>신청자</th>
                                    <td><input type="text" id="applicantName" readonly></td>
                                    <th>부서</th>
                                    <td><input type="text" id="applicantDept" readonly></td>
                                </tr>
                                <tr>
                                    <th>출장 유형</th>
                                    <td colspan="3">
                                        <select>
                                            <option>국내 출장</option>
                                            <option>해외 출장</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr id="companionListRow">
                                    <th>동행 인원 명단</th>
                                    <td colspan="3" id="companionCell">
                                        <div class="companion-empty" id="companionEmpty">
                                            클릭하여 동행 인원 선택
                                        </div>
                                        <div id="companionTableWrapper" style="display: none;">
                                            <table class="companion-table" id="companionTable">
                                                <thead>
                                                    <tr>
                                                        <th width="60">번호</th>
                                                        <th>이름</th>
                                                        <th>부서</th>
                                                        <th>직급</th>
                                                        <th width="60">삭제</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="companionTableBody">
                                                    <!-- 동행 인원 목록이 여기에 표시됩니다 -->
                                                </tbody>
                                            </table>
                                            <button type="button" class="btn-add-companion" id="btnAddCompanion">
                                                <i class="fas fa-plus"></i> 인원 추가
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <th>출장지</th>
                                    <td colspan="3"><input type="text" placeholder="출장 목적지"></td>
                                </tr>
                                <tr>
                                    <th>출장 기간</th>
                                    <td><input type="date" placeholder="시작일"></td>
                                    <th>~</th>
                                    <td><input type="date" placeholder="종료일"></td>
                                </tr>
                                <tr>
                                    <th>출장 목적</th>
                                    <td colspan="3"><textarea placeholder="출장 목적 및 업무 내용" rows="4"></textarea></td>
                                </tr>
                                <tr>
                                    <th>예상 경비</th>
                                    <td colspan="3"><input type="number" placeholder="예상 출장 경비 (원)"></td>
                                </tr>
                                <tr>
                                    <th>비고</th>
                                    <td colspan="3"><textarea placeholder="추가 사항" rows="3"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 동행 인원 선택 모달 -->
    <div class="modal" id="companionModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-users"></i> 동행 인원 선택</h3>
                <button class="close-modal" id="closeCompanionModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="search-box">
                    <input type="text" id="companionSearch" placeholder="이름 또는 부서로 검색...">
                    <i class="fas fa-search"></i>
                </div>
                <div class="employee-list">
                    <table class="employee-table">
                        <thead>
                            <tr>
                                <th width="60">선택</th>
                                <th>이름</th>
                                <th>부서</th>
                                <th>직급</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- 직원 목록이 여기에 동적으로 추가됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelCompanionBtn">취소</button>
                <button class="btn-primary" id="confirmCompanionBtn">확인</button>
            </div>
        </div>
    </div>

    <!-- 전자서명 QR 모달 프래그먼트 -->
    <div th:replace="~{fragments/signature-modal :: signature-modal}"></div>

    <script th:src="@{/js/approval_business_trip.js}"></script>
</body>
</html>
