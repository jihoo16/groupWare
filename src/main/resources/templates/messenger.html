<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ERP 시스템 - 메신저', '/css/messenger.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('messenger')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <div class="messenger-container">
                <!-- 채팅방 목록 -->
                <div class="chat-list-panel">
                    <div class="chat-list-header">
                        <h2 class="chat-list-title">메신저</h2>
                        <button class="btn-new-chat" id="newChatBtn">
                            <i class="fas fa-plus"></i>
                            새 채팅
                        </button>
                    </div>

                    <!-- 검색 -->
                    <div class="chat-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="chatSearchInput" placeholder="대화 검색...">
                    </div>

                    <!-- 채팅방 리스트 -->
                    <div class="chat-list" id="chatList">
                        <!-- 기본 샘플 채팅방 (JavaScript 로드 전 표시) -->
                        <div class="chat-item">
                            <div class="chat-item-avatar online">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="chat-item-content">
                                <div class="chat-item-header">
                                    <span class="chat-item-name">김대표</span>
                                    <span class="chat-item-time">10:30</span>
                                </div>
                                <div class="chat-item-message">내일 회의 일정 확인 부탁드립니다.</div>
                            </div>
                            <div class="chat-item-unread">2</div>
                        </div>
                        <div class="chat-item">
                            <div class="chat-item-avatar online">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="chat-item-content">
                                <div class="chat-item-header">
                                    <span class="chat-item-name">박CMO</span>
                                    <span class="chat-item-time">어제</span>
                                </div>
                                <div class="chat-item-message">프로젝트 진행 상황 공유드립니다.</div>
                            </div>
                        </div>
                        <div class="chat-item">
                            <div class="chat-item-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="chat-item-content">
                                <div class="chat-item-header">
                                    <span class="chat-item-name">이CTO</span>
                                    <span class="chat-item-time">2일 전</span>
                                </div>
                                <div class="chat-item-message">새로운 기능 개발 완료했습니다.</div>
                            </div>
                        </div>
                        <div class="chat-item">
                            <div class="chat-item-avatar online">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="chat-item-content">
                                <div class="chat-item-header">
                                    <span class="chat-item-name">정지원</span>
                                    <span class="chat-item-time">3일 전</span>
                                </div>
                                <div class="chat-item-message">연차 신청 승인 완료되었습니다.</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 채팅 영역 -->
                <div class="chat-panel">
                    <div class="chat-empty" id="chatEmpty">
                        <i class="fas fa-comments"></i>
                        <p>대화를 선택하세요</p>
                    </div>

                    <div class="chat-active" id="chatActive" style="display: none;">
                        <!-- 채팅 헤더 -->
                        <div class="chat-header">
                            <div class="chat-header-info">
                                <div class="chat-avatar">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div class="chat-header-text">
                                    <h3 class="chat-participant-name" id="chatParticipantName"></h3>
                                    <span class="chat-participant-status" id="chatParticipantStatus"></span>
                                </div>
                            </div>
                            <div class="chat-header-actions">
                                <button class="btn-icon" title="통화">
                                    <i class="fas fa-phone"></i>
                                </button>
                                <button class="btn-icon" title="영상통화">
                                    <i class="fas fa-video"></i>
                                </button>
                                <button class="btn-icon" title="정보">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 메시지 영역 -->
                        <div class="chat-messages" id="chatMessages">
                            <!-- JavaScript로 동적 생성 -->
                        </div>

                        <!-- 메시지 입력 -->
                        <div class="chat-input-container">
                            <button class="btn-icon" title="파일 첨부">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button class="btn-icon" title="이미지">
                                <i class="fas fa-image"></i>
                            </button>
                            <input type="text" class="chat-input" id="messageInput" placeholder="메시지를 입력하세요...">
                            <button class="btn-send" id="sendBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 새 채팅 모달 -->
    <div id="newChatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">새 채팅</h2>
                <button class="modal-close" id="closeNewChatModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="user-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="userSearchInput" placeholder="이름으로 검색...">
                </div>
                <div class="user-list" id="userList">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/messenger.js}"></script>
</body>
</html>
