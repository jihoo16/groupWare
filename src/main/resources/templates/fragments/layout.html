<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, additionalCss)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">GROUPWARE 시스템</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/common-modal.css}">
    <link rel="stylesheet" th:href="@{/css/tooltip.css}">
    <link rel="stylesheet" th:href="@{/css/file-preview-modal.css}">
    <link rel="stylesheet" th:href="@{/css/common-clipboard-paste.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 추가 CSS -->
    <th:block th:if="${additionalCss != null}">
        <link rel="stylesheet" th:href="@{${additionalCss}}">
    </th:block>

    <!-- 전자서명 디버그 시각화 (개발 환경 전용, signature.debug.enabled=true일 때만) -->
    <link th:if="${@environment.getProperty('signature.debug.enabled') == 'true'}"
          rel="stylesheet" th:href="@{/css/signature-debug.css}">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

    <!-- 세션 정보를 JavaScript 전역 변수로 주입 -->
    <script th:inline="javascript">
        // 현재 로그인한 사용자 정보 (서버 세션에서 주입)
        window.CURRENT_USER = {
            idx: /*[[${session.userIdx}]]*/ null,
            empId: /*[[${session.empId}]]*/ '',
            empName: /*[[${session.empName}]]*/ '',
            empDept: /*[[${session.user?.empDept}]]*/ '',
            empDeptName: /*[[${session.user?.empDeptName}]]*/ '',
            position: /*[[${session.user?.empPosition}]]*/ '',
            userRoleCode: /*[[${session.userRoleCode}]]*/ 'C1104'
        };

        // 로그인 여부 체크
        if (!window.CURRENT_USER.idx) {
            console.warn('세션 정보가 없습니다. 로그인 페이지로 이동합니다.');
            // 로그인 페이지가 아닌 경우에만 리다이렉트
            if (window.location.pathname !== '/login') {
                window.location.href = '/login';
            }
        }
    </script>

    <!-- 환경 표시 배너 스타일 (PROD 외 환경에서 표시) -->
    <th:block th:if="${@environment.getProperty('app.env') != null and @environment.getProperty('app.env') != 'PROD'}">
        <style>
            .env-banner { position: fixed; top: 0; left: 0; width: 100%; height: 28px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: 1px; z-index: 99999; pointer-events: none; }
            .env-banner.env-dev { background: #2e7d32; }
            .env-banner.env-local { background: #1565c0; }
            body { padding-top: 28px !important; }
        </style>
    </th:block>

    <!-- 공통 JavaScript -->
    <script th:src="@{/js/common-alert.js}" defer></script>
    <script th:src="@{/js/common.js}" defer></script>
    <script th:src="@{/js/tooltip.js}" defer></script>
    <script th:src="@{/js/file-preview-modal.js}" defer></script>
    <script th:src="@{/js/common-clipboard-paste.js}" defer></script>
    <!-- common-modal.js 제거: SweetAlert2 기반 common-alert.js 사용 -->
</head>
</html>
