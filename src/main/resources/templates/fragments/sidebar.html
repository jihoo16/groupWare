<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- 좌측 네비게이션 바 -->
    <nav class="sidebar" th:fragment="sidebar(activeMenu)">
        <a href="/home" class="logo">
            <i class="fas fa-building"></i>
            <span class="logo-text">ERP</span>
        </a>

        <ul class="menu">
            <li class="menu-item" th:classappend="${activeMenu == 'messenger'} ? 'active' : ''" data-tooltip="메신저">
                <a href="/messenger">
                    <i class="fas fa-comments"></i>
                    <span class="menu-text">메신저</span>
                </a>
            </li>
            <li class="menu-item" th:classappend="${activeMenu == 'organization'} ? 'active' : ''" data-tooltip="조직도">
                <a href="/organization">
                    <i class="fas fa-sitemap"></i>
                    <span class="menu-text">조직도</span>
                </a>
            </li>
            <li th:class="${(activeMenu == 'approval' or activeMenu == 'vacation' or activeMenu == 'approval-write') ? 'menu-item menu-parent active' : 'menu-item menu-parent'}" data-tooltip="전자결재">
                <a href="/approval" class="menu-toggle-btn">
                    <i class="fas fa-file-signature"></i>
                    <span class="menu-text">전자결재</span>
                    <i class="fas fa-chevron-down menu-arrow"></i>
                </a>
                <ul class="submenu">
                    <li class="submenu-item" th:classappend="${activeMenu == 'approval'} ? 'active' : ''">
                        <a href="/approval">
                            <span class="submenu-text">결재 문서</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'vacation'} ? 'active' : ''">
                        <a href="/vacation">
                            <span class="submenu-text">연차 관리</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'approval-write'} ? 'active' : ''">
                        <a href="/approval/write">
                            <span class="submenu-text">문서 작성</span>
                        </a>
                    </li>
                </ul>
            </li>
            <li class="menu-item" th:classappend="${activeMenu == 'calendar'} ? 'active' : ''" data-tooltip="일정관리">
                <a href="/calendar">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="menu-text">일정관리</span>
                </a>
            </li>
            <li class="menu-item" th:classappend="${activeMenu == 'board'} ? 'active' : ''" data-tooltip="게시판">
                <a href="/board">
                    <i class="fas fa-clipboard-list"></i>
                    <span class="menu-text">게시판</span>
                </a>
            </li>
            <li class="menu-item" th:classappend="${activeMenu == 'cloud'} ? 'active' : ''" data-tooltip="클라우드">
                <a href="/cloud">
                    <i class="fas fa-cloud"></i>
                    <span class="menu-text">클라우드</span>
                </a>
            </li>
            <li th:class="${(activeMenu == 'project' or activeMenu == 'project-new' or activeMenu == 'project-card') ? 'menu-item menu-parent active' : 'menu-item menu-parent'}" data-tooltip="프로젝트 관리">
                <a href="/project" class="menu-toggle-btn">
                    <i class="fas fa-project-diagram"></i>
                    <span class="menu-text">프로젝트 관리</span>
                    <i class="fas fa-chevron-down menu-arrow"></i>
                </a>
                <ul class="submenu">
                    <li class="submenu-item" th:classappend="${activeMenu == 'project'} ? 'active' : ''">
                        <a href="/project">
                            <span class="submenu-text">프로젝트 목록</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'project-new'} ? 'active' : ''">
                        <a href="/project/new">
                            <span class="submenu-text">신규 프로젝트</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'project-card'} ? 'active' : ''">
                        <a href="/project/card">
                            <span class="submenu-text">연구비카드 관리</span>
                        </a>
                    </li>
                </ul>
            </li>
            <li th:class="${(activeMenu == 'hr' or activeMenu == 'attendance' or activeMenu == 'payroll') ? 'menu-item menu-parent active' : 'menu-item menu-parent'}" data-tooltip="관리">
                <a href="/hr" class="menu-toggle-btn">
                    <i class="fas fa-cogs"></i>
                    <span class="menu-text">관리</span>
                    <i class="fas fa-chevron-down menu-arrow"></i>
                </a>
                <ul class="submenu">
                    <li class="submenu-item" th:classappend="${activeMenu == 'hr'} ? 'active' : ''">
                        <a href="/hr">
                            <span class="submenu-text">인사 관리</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'attendance'} ? 'active' : ''">
                        <a href="/attendance">
                            <span class="submenu-text">근태 관리</span>
                        </a>
                    </li>
                    <li class="submenu-item" th:classappend="${activeMenu == 'payroll'} ? 'active' : ''">
                        <a href="/payroll">
                            <span class="submenu-text">급여 관리</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>

        <a href="/settings" class="user-info" th:classappend="${activeMenu == 'settings'} ? 'active' : ''">
            <div class="user-avatar">
                <i class="fas fa-user-circle"></i>
            </div>

            <div class="user-details">
                <span class="user-name">사용자</span>
                <span class="user-role">관리자</span>
            </div>
        </a>
    </nav>
</body>
</html>
