<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 전자문서 작성용 템플릿 사이드바 -->
<aside th:fragment="approval-sidebar(activePage)" class="template-sidebar">
    <div class="sidebar-section">
        <div class="sidebar-header">
            <h3 class="sidebar-title"><i class="fas fa-file-alt"></i> 문서 양식</h3>
            <button class="btn-toggle-all" id="toggleAllBtn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <nav class="sidebar-menu">
            <!-- 인사 -->
            <div class="menu-category expanded">
                <div class="category-header">
                    <i class="fas fa-chevron-right category-toggle"></i>
                    <i class="fas fa-user-tie"></i>
                    <span>인사</span>
                    <span class="category-badge">1</span>
                </div>
                <div class="category-items">
                    <a href="/approval/vacation" th:classappend="${activePage == 'vacation'} ? 'menu-item active' : 'menu-item'">
                        <i class="fas fa-umbrella-beach"></i>
                        <span>연차신청서</span>
                    </a>
                </div>
            </div>
            <!-- 지출 -->
            <div class="menu-category expanded">
                <div class="category-header">
                    <i class="fas fa-chevron-right category-toggle"></i>
                    <i class="fas fa-coins"></i>
                    <span>지출</span>
                    <span class="category-badge">2</span>
                </div>
                <div class="category-items">
                    <a href="/approval/expense" th:classappend="${activePage == 'expense'} ? 'menu-item active' : 'menu-item'">
                        <i class="fas fa-won-sign"></i>
                        <span>지출승인서</span>
                    </a>
                    <a href="/approval/requisition" th:classappend="${activePage == 'requisition'} ? 'menu-item active' : 'menu-item'">
                        <i class="fas fa-file-invoice"></i>
                        <span>지출품의서</span>
                    </a>
                </div>
            </div>
            <div style="margin-bottom: 540px"></div>
        </nav>
    </div>
</aside>
</body>
</html>
