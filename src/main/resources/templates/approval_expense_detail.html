<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출승인서 상세', '/css/approval_expense_detail.css')}"></head>
<body>
    <div class="container">
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-won-sign"></i> 지출승인서 상세</h1>
                </div>
                <div class="header-right">
                    <button class="btn-print btn-lg" id="printBtn" style="display:none;">
                        <i class="fas fa-print"></i>
                        인쇄하기
                    </button>
                    <button class="btn-primary btn-lg" id="editBtn" style="display:none;">
                        <i class="fas fa-edit"></i>
                        수정
                    </button>
                    <button class="btn-danger btn-lg" id="deleteBtn" style="display:none;">
                        <i class="fas fa-trash"></i>
                        삭제
                    </button>
                    <button class="btn-secondary btn-lg" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="editor-area" style="max-width: 1000px; margin: 0 auto;">

                    <!-- 문서 제목 -->
                    <h2 class="doc-title">지 출 승 인 서</h2>

                    <!-- 기본 정보 -->
                    <h3 class="section-title"><i class="fas fa-info-circle"></i> 기본 정보</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label"><i class="fas fa-building"></i> 부서/팀</span>
                            <span class="info-value" id="detailDept">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label"><i class="fas fa-user"></i> 기안자</span>
                            <span class="info-value" id="detailName">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label"><i class="fas fa-calendar-alt"></i> 기안일자</span>
                            <span class="info-value" id="detailDate">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label"><i class="fas fa-hashtag"></i> 문서번호</span>
                            <span class="info-value" id="detailDocumentNumber">-</span>
                        </div>
                    </div>

                    <!-- 지출 내역 -->
                    <h3 class="section-title" style="margin-top: 28px;"><i class="fas fa-receipt"></i> 지출 내역</h3>
                    <div class="table-wrapper">
                        <table class="detail-table" id="detailTable">
                            <thead>
                                <tr>
                                    <th style="width: 110px;">날짜</th>
                                    <th>적요</th>
                                    <th style="width: 130px;">상호</th>
                                    <th style="width: 100px;">결제수단</th>
                                    <th style="width: 130px;">금액</th>
                                    <th style="width: 120px;">비고</th>
                                </tr>
                            </thead>
                            <tbody id="detailTableBody">
                                <tr><td colspan="6" class="empty-row">로딩 중...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 합계 -->
                    <div class="total-bar">
                        <span class="total-label">총 합계</span>
                        <span class="total-amount" id="detailTotalAmount">₩ 0</span>
                    </div>

                    <!-- 공식 문서 미리보기 토글 -->
                    <div class="document-preview-toggle">
                        <button class="toggle-btn" id="documentFormToggle">
                            <i class="fas fa-file-alt"></i>
                            공식 문서 미리보기
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </button>
                    </div>

                    <!-- 공식 문서 미리보기 영역 -->
                    <div class="document-form-wrapper collapsed">
                        <div class="document-form">

                            <!-- 제목 + 결재란 -->
                            <div style="display: flex; align-items: flex-start; gap: 16px; margin-bottom: 10px;">
                                <div style="flex-shrink: 0; padding-top: 2px;">
                                    <h2 class="expense-doc-title">지출결의서</h2>
                                    <div style="font-size: 12px; color: #555; margin-top: 4px;">
                                        <span id="previewDate">-</span>
                                    </div>
                                </div>
                                <div style="flex-shrink: 0; margin-left: auto;">
                                    <table style="border: 2px solid #000; border-collapse: collapse;">
                                        <tr>
                                            <td rowspan="2" style="width: 14px; border: 1px solid #000; padding: 4px 1px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; writing-mode: vertical-lr; letter-spacing: 3px;">결재</td>
                                            <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">담 당</td>
                                            <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">부서장</td>
                                            <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">대 표</td>
                                        </tr>
                                        <tr>
                                            <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                            <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                            <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>

                            <!-- 품의부서 / 합계 -->
                            <table class="expense-info-table">
                                <tr>
                                    <th style="width: 70px;">품의부서</th>
                                    <td id="previewDept">-</td>
                                    <th style="width: 70px;">작성자</th>
                                    <td id="previewName">-</td>
                                </tr>
                                <tr>
                                    <th>합계</th>
                                    <td colspan="3">
                                        <div class="amount-display">
                                            <span id="previewAmountKorean" class="korean-amount">일금</span>
                                            <span class="amount-number" id="previewAmountNumber">(₩ 0)</span>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- 지출 내역 테이블 -->
                            <div class="expense-detail-section">
                                <table class="expense-detail-table" id="previewExpenseTable">
                                    <thead>
                                        <tr>
                                            <th style="width: 60px;">일 자</th>
                                            <th>적 요</th>
                                            <th style="width: 100px;">상 호</th>
                                            <th style="width: 80px;">결제수단</th>
                                            <th style="width: 110px;">금 액</th>
                                            <th style="width: 80px;">비 고</th>
                                        </tr>
                                    </thead>
                                    <tbody id="previewExpenseBody">
                                        <tr>
                                            <td class="empty-preview-row" colspan="6">지출 내역이 없습니다</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- 합계 -->
                            <table class="expense-summary-table">
                                <tr>
                                    <th style="width: 80px;">합계</th>
                                    <td id="previewTotal" style="font-weight: 700;">₩ 0</td>
                                </tr>
                            </table>

                            <!-- 결제수단별 금액 -->
                            <table class="expense-payment-table">
                                <tr>
                                    <th>현금</th>
                                    <td id="previewCash">₩ 0</td>
                                </tr>
                                <tr>
                                    <th>카드</th>
                                    <td id="previewCard">₩ 0</td>
                                </tr>
                            </table>

                        </div><!-- /document-form -->
                    </div><!-- /document-form-wrapper -->

                </div><!-- /editor-area -->
            </div><!-- /write-container -->
        </main>
    </div>

    <script th:src="@{/js/approval_expense_detail.js}"></script>
</body>
</html>
