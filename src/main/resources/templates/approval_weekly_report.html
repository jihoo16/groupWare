<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('주간업무보고', '/css/approval_weekly_report.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-calendar-week"></i> 문서 작성 > 주간업무보고</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('weekly-report')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 입력 영역 -->
                        <div class="input-area">
                            <div class="input-section">
                                <div class="section-header">
                                    <h2 style="margin-bottom: 15px"><i class="fas fa-calendar-week"></i> 주간 업무 보고서</h2>
                                    <h3><i class="fas fa-edit"></i> 기본 정보</h3>
                                </div>

                                <!-- 작성자 정보 -->
                                <div class="info-card">
                                    <div class="info-item">
                                        <i class="fas fa-user"></i>
                                        <span class="info-label">작성자</span>
                                        <span class="info-value" id="applicantName">-</span>
                                    </div>
                                    <div class="info-divider"></div>
                                    <div class="info-item">
                                        <i class="fas fa-building"></i>
                                        <span class="info-label">부서</span>
                                        <span class="info-value" id="applicantDept">-</span>
                                    </div>
                                    <div class="info-divider"></div>
                                    <div class="info-item">
                                        <i class="fas fa-chart-line"></i>
                                        <span class="info-label">현재 전체 달성률</span>
                                        <span class="info-value" id="currentProgressRateInfo">
                                            <span id="currentProgressRateValue">0.00%</span>
                                            <span class="info-hint">(프로젝트 선택시 표시)</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="form-grid">
                                    <div class="form-group full-width">
                                        <label><i class="fas fa-project-diagram"></i> 프로젝트</label>
                                        <div class="form-text-display clickable-field" id="projectInput" style="cursor: pointer; color: #495057;">클릭하여 프로젝트 선택</div>
                                        <input type="hidden" id="selectedProjectIdx">
                                    </div>

                                    <div class="form-group full-width">
                                        <label for="reportDatePicker"><i class="fas fa-calendar"></i> 보고 기간</label>
                                        <div class="date-range-input">
                                            <input type="date" id="reportDatePicker" class="form-input">
                                            <span class="arrow">→</span>
                                            <input type="text" id="reportPeriodDisplay" class="form-input" placeholder="날짜를 선택하면 해당 주 평일이 자동 선택됩니다">
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="inputProgressRate"><i class="fas fa-plus-circle"></i> 추가 달성률 (%) <span style="color: #64748b; font-weight: 400;">(전체 달성률에 추가)</span></label>
                                        <input type="number" id="inputProgressRate" class="form-input" placeholder="0.00" step="0.01" min="0" max="100">
                                    </div>

                                    <div class="form-group full-width">
                                        <label for="weeklyAchievementRate"><i class="fas fa-chart-line"></i>주간 달성률 (%)</label>
                                        <input type="number" id="weeklyAchievementRate" class="form-input" placeholder="0-100 사이 입력" min="0" max="100" step="1">
                                    </div>
                                </div>
                            </div>

                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-tasks"></i> 업무 내용</h3>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group full-width">
                                        <label for="weeklyTasks"><i class="fas fa-list-ul"></i> 금주 주요 업무</label>
                                        <textarea id="weeklyTasks" class="form-textarea" rows="5" placeholder="이번 주 수행한 주요 업무를 입력하세요"></textarea>
                                    </div>

                                    <div class="form-group full-width">
                                        <label for="achievements"><i class="fas fa-trophy"></i> 주요 성과</label>
                                        <textarea id="achievements" class="form-textarea" rows="4" placeholder="달성한 성과 및 결과물"></textarea>
                                    </div>

                                    <div class="form-group full-width">
                                        <label for="issues"><i class="fas fa-exclamation-triangle"></i> 주요 이슈</label>
                                        <textarea id="issues" class="form-textarea" rows="4" placeholder="발생한 문제 및 이슈사항"></textarea>
                                    </div>

                                    <div class="form-group full-width">
                                        <label for="nextWeekPlan"><i class="fas fa-calendar-check"></i> 차주 계획</label>
                                        <textarea id="nextWeekPlan" class="form-textarea" rows="5" placeholder="다음 주 진행 예정 업무"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-paperclip"></i> 첨부파일</h3>
                                </div>
                                <div class="file-upload-area" id="fileUploadArea">
                                    <input type="file" id="fileInput" multiple hidden>
                                    <label for="fileInput" class="file-upload-label">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                        <span>파일을 선택하거나 드래그하세요</span>
                                        <small>최대 10MB, 최대 5개</small>
                                    </label>
                                </div>
                                <div class="file-list" id="fileList"></div>
                            </div>
                        </div>

                        <!-- 공식 문서 미리보기 영역 -->
                        <div class="document-preview-toggle">
                            <button class="toggle-btn" id="documentFormToggle">
                                <i class="fas fa-file-alt"></i>
                                공식 문서 미리보기
                                <i class="fas fa-chevron-down toggle-icon"></i>
                            </button>
                        </div>

                        <div class="document-form-wrapper collapsed">
                            <div class="document-form">
                                <h2 class="doc-title">주 간 업 무 보 고</h2>

                                <table class="form-table">
                                    <tr>
                                        <th>과제명</th>
                                        <td colspan="3" class="auto-project">-</td>
                                    </tr>
                                    <tr>
                                        <th>달성률</th>
                                        <td colspan="3"><span class="auto-achievement">0</span>%</td>
                                    </tr>
                                    <tr>
                                        <th>보고자</th>
                                        <td class="auto-reporter">-</td>
                                        <th>부서</th>
                                        <td class="auto-dept">-</td>
                                    </tr>
                                    <tr>
                                        <th>보고 기간</th>
                                        <td colspan="3" class="auto-period">-</td>
                                    </tr>
                                    <tr>
                                        <th>금주 주요 업무</th>
                                        <td colspan="3"><div class="auto-tasks" style="white-space: pre-wrap; min-height: 100px;">-</div></td>
                                    </tr>
                                    <tr>
                                        <th>주요 성과</th>
                                        <td colspan="3"><div class="auto-achievements" style="white-space: pre-wrap; min-height: 80px;">-</div></td>
                                    </tr>
                                    <tr>
                                        <th>주요 이슈</th>
                                        <td colspan="3"><div class="auto-issues" style="white-space: pre-wrap; min-height: 80px;">-</div></td>
                                    </tr>
                                    <tr>
                                        <th>차주 계획</th>
                                        <td colspan="3"><div class="auto-next-plan" style="white-space: pre-wrap; min-height: 100px;">-</div></td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="savePdfBtn">
                                <i class="fas fa-file-pdf"></i>
                                PDF 저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 프로젝트 선택 모달 -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>프로젝트 선택</h3>
                <button class="btn-close" onclick="closeProjectModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="projectSearch" placeholder="프로젝트명으로 검색">
                </div>
                <div class="employee-list" id="projectList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeProjectModal()">취소</button>
                <button class="btn-primary" onclick="selectProject()">선택</button>
            </div>
        </div>
    </div>

    <!-- 전자서명 QR 모달 프래그먼트 -->
    <div th:replace="~{fragments/signature-modal :: signature-modal}"></div>

    <script th:src="@{/js/approval_weekly_report.js}"></script>
</body>
</html>
