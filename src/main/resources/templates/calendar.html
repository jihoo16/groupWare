<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('ERP 시스템 - 일정관리', '/css/calendar.css')"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="fragments/sidebar :: sidebar('calendar')"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">일정관리</h1>
                </div>
                <div class="header-right">
                    <button class="btn-primary" id="addScheduleBtn">
                        <i class="fas fa-plus"></i>
                        일정 추가
                    </button>
                </div>
            </header>

            <div class="calendar-content">
                <!-- 달력 네비게이션 -->
                <div class="calendar-nav-header">
                    <button class="btn-today" id="todayBtn">
                        <i class="fas fa-calendar-day"></i>
                        오늘
                    </button>
                    <div class="calendar-nav-controls">
                        <button class="nav-btn" id="prevMonthBtn">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <h2 class="current-month" id="currentMonthTitle" style="cursor: pointer;"></h2>
                        <button class="nav-btn" id="nextMonthBtn">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <!-- 범례 -->
                    <div class="calendar-legend">
                        <div class="legend-item">
                            <span class="legend-dot my-schedule"></span>
                            <span>내 일정</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot leave"></span>
                            <span>연차/휴가</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot business"></span>
                            <span>업무 일정</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot etc"></span>
                            <span>기타</span>
                        </div>
                    </div>
                </div>

                <!-- 큰 달력 -->
                <div class="large-calendar">
                    <div class="calendar-weekdays">
                        <div class="weekday sunday">일요일</div>
                        <div class="weekday">월요일</div>
                        <div class="weekday">화요일</div>
                        <div class="weekday">수요일</div>
                        <div class="weekday">목요일</div>
                        <div class="weekday">금요일</div>
                        <div class="weekday saturday">토요일</div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 일정 추가 모달 -->
    <div id="addScheduleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">일정 추가</h2>
                <button class="modal-close" id="closeAddModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addScheduleForm">
                    <div class="form-group">
                        <label class="form-label">일정 제목 <span class="required">*</span></label>
                        <input type="text" id="scheduleTitle" class="form-input" placeholder="일정 제목을 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">일정 유형 <span class="required">*</span></label>
                        <select id="scheduleType" class="form-input" required>
                            <option value="business" selected>업무 일정</option>
                            <option value="leave">연차/휴가</option>
                            <option value="etc">기타</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">시작 날짜 <span class="required">*</span></label>
                            <input type="date" id="scheduleStartDate" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">종료 날짜 <span class="required">*</span></label>
                            <input type="date" id="scheduleEndDate" class="form-input" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">시작 시간</label>
                            <input type="time" id="scheduleStartTime" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">종료 시간</label>
                            <input type="time" id="scheduleEndTime" class="form-input">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">장소</label>
                        <input type="text" id="scheduleLocation" class="form-input" placeholder="장소를 입력하세요">
                    </div>

                    <div class="form-group">
                        <label class="form-label">참여자</label>
                        <div class="participants-input">
                            <input type="text" id="participantInput" class="form-input" placeholder="참여자 이름을 입력하세요">
                            <button type="button" id="addParticipantBtn" class="btn-add">추가</button>
                        </div>
                        <div id="participantsList" class="participants-list"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">설명</label>
                        <textarea id="scheduleDescription" class="form-textarea" rows="4" placeholder="일정에 대한 설명을 입력하세요"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelAddBtn">취소</button>
                <button class="btn-primary" id="saveScheduleBtn">
                    <i class="fas fa-check"></i>
                    저장
                </button>
            </div>
        </div>
    </div>

    <!-- 일정 상세 모달 -->
    <div id="scheduleDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">일정 상세 정보</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <div class="detail-label">일정 제목</div>
                    <div class="detail-value" id="modalTitle"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">일정 유형</div>
                    <div class="detail-value" id="modalType"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">날짜</div>
                    <div class="detail-value" id="modalDate"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">시간</div>
                    <div class="detail-value" id="modalTime"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">장소</div>
                    <div class="detail-value" id="modalLocation"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">등록자</div>
                    <div class="detail-value" id="modalCreator"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">참여자</div>
                    <div class="detail-value" id="modalParticipants"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">등록일자</div>
                    <div class="detail-value" id="modalCreatedAt"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">설명</div>
                    <div class="detail-value" id="modalDescription"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="closeModalBtn">닫기</button>
            </div>
        </div>
    </div>

    <!-- 연/월 선택 모달 -->
    <div id="yearMonthSelectorModal" class="modal">
        <div class="modal-content year-month-modal">
            <div class="modal-header">
                <h2 class="modal-title">연도 및 월 선택</h2>
                <button class="modal-close" id="closeYearMonthModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="year-month-selector">
                    <div class="selector-section">
                        <h3 class="selector-label">연도</h3>
                        <div class="year-selector" id="yearSelector"></div>
                    </div>
                    <div class="selector-section">
                        <h3 class="selector-label">월</h3>
                        <div class="month-selector" id="monthSelector"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelYearMonthBtn">취소</button>
                <button class="btn-primary" id="confirmYearMonthBtn">
                    <i class="fas fa-check"></i>
                    이동
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/calendar.js}"></script>
</body>
</html>
