<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('연차신청서 상세', '/css/approval_vacation_detail.css')}"></head>
<body>
<!-- 로딩 오버레이 -->
<div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header no-print">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-calendar-check"></i> 연차신청서 상세</h1>
                </div>
                <div class="header-right" id="headerButtons">
                    <button class="btn-secondary" id="printDocBtn" style="display:none;">
                        <i class="fas fa-print"></i>
                        인쇄
                    </button>
                    <!-- 삭제 버튼은 작성자인 경우에만 동적으로 생성됨 -->
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <!-- 삭제된 문서 알림 배너 -->
                <div class="deleted-document-banner" th:if="${isDeleted}">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>이 문서는 <span th:text="${#temporals.format(deletedAt, 'yyyy-MM-dd HH:mm')}"></span>에 삭제된 문서입니다. (관리자 전용 조회)</span>
                </div>

                <div class="editor-area" th:classappend="${isDeleted} ? 'deleted-document' : ''" style="max-width: 1000px; margin: 0 auto;">
                    <!-- 공식 문서 양식 -->
                    <div class="document-form" id="documentFormContent">
                        <!-- 결재라인 -->
                        <div class="approval-line-box">
                            <table class="approval-line-table">
                                <tr>
                                    <th class="approval-header">신청자</th>
                                    <th class="approval-header">부 서 장</th>
                                    <th class="approval-header">대 표</th>
                                </tr>
                                <tr>
                                    <td class="doc-approval-sign" data-role="담당" data-slot="C1602">
                                        <div class="sign-area">
                                            <span class="sign-placeholder"></span>
                                        </div>
                                    </td>
                                    <td class="doc-approval-sign" data-role="부서장" data-slot="C1604">
                                        <div class="sign-area">
                                            <span class="sign-placeholder"></span>
                                        </div>
                                    </td>
                                    <td class="doc-approval-sign signature-offline" data-role="대표이사">
                                        <div class="sign-area">
                                            <span class="sign-placeholder"></span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="approval-name-cell">
                                        <span class="approver-name" data-role="담당">-</span>
                                    </td>
                                    <td class="approval-name-cell">
                                        <span class="approver-name" data-role="부서장">-</span>
                                    </td>
                                    <td class="approval-name-cell">
                                        <span class="approver-name" data-role="대표이사">-</span>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <h2 class="doc-title">휴 가 계</h2>

                        <table class="form-table">
                            <colgroup>
                                <col style="width: 120px;">
                                <col>
                                <col style="width: 120px;">
                                <col>
                            </colgroup>
                            <tr>
                                <th>주 소</th>
                                <td colspan="3"><span id="address" class="readonly-text"></span></td>
                            </tr>
                            <tr>
                                <th>생년월일</th>
                                <td><span id="birthDate" class="readonly-text"></span></td>
                                <th>연 락 처</th>
                                <td><span id="phone" class="readonly-text"></span></td>
                            </tr>
                            <tr>
                                <th>소 속</th>
                                <td><span id="department" class="readonly-text"></span></td>
                                <th>직 급</th>
                                <td><span id="position" class="readonly-text"></span></td>
                            </tr>
                            <tr>
                                <th>성 명</th>
                                <td colspan="3"><span id="applicantName" class="readonly-text"></span></td>
                            </tr>
                            <tr>
                                <th>내 용</th>
                                <td colspan="3"><span class="readonly-text" style="font-weight:600;">휴가 신청</span></td>
                            </tr>
                            <tr>
                                <th>사 유</th>
                                <td colspan="3" style="vertical-align:top; padding:16px;">
                                    <span id="reason" class="readonly-text"></span>
                                </td>
                            </tr>
                            <tr>
                                <th>휴가기간</th>
                                <td colspan="3">
                                    <div id="vacationPeriodDisplay"></div>
                                </td>
                            </tr>
                        </table>

                        <div class="document-footer">
                            <p class="footer-text">위 사유로 상기기간 동안 휴가사용을 신청하오니 허가하여 주시기 바랍니다.</p>
                            <div class="footer-date">
                                <span id="applyDateText"></span>
                            </div>
                            <div class="footer-signature" data-slot="C1602">
                                <span class="signature-label">신청인</span>
                                <span class="signature-name" id="applicantNameFooter">-</span>
                                <span class="signature-seal">(서명 또는 인)</span>
                            </div>
                        </div>
                    </div>

                    <!-- 레거시 첨부파일 (기존 PDF가 있는 경우에만 표시) -->
                    <div id="attachmentsSection" style="display:none; margin-top:16px;">
                        <h3 class="section-title">첨부파일</h3>
                        <div id="attachmentsList" class="attachments-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 전자서명 QR 모달 프래그먼트 -->
    <div th:replace="~{fragments/signature-modal :: signature-modal}"></div>

    <script th:src="@{/js/approval_vacation_detail.js}"></script>
</body>
</html>
