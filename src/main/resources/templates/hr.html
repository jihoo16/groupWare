<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('사용자 관리', '/css/hr.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('hr')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">사용자 관리</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="직원 검색..." id="employeeSearch">
                    </div>
                    <button class="btn-primary" id="addEmployeeBtn">
                        <i class="fas fa-user-plus"></i>
                        직원 등록
                    </button>
                </div>
            </header>

            <div class="hr-area">
                <!-- 통계 카드 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #e3f2fd;">
                            <i class="fas fa-users" style="color: #1976d2;"></i>
                        </div>
                        <div class="stat-content">
                            <h1>전체 직원</h1>
                            <p class="stat-number"><span id="totalCount">0</span><span>명</span></p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #e8f5e9;">
                            <i class="fas fa-user-check" style="color: #388e3c;"></i>
                        </div>
                        <div class="stat-content">
                            <h1>재직 중</h1>
                            <p class="stat-number"><span id="activeCount">0</span><span>명</span></p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #fff3e0;">
                            <i class="fas fa-user-clock" style="color: #f57c00;"></i>
                        </div>
                        <div class="stat-content">
                            <h1>휴직 중</h1>
                            <p class="stat-number"><span id="onLeaveCount">0</span><span>명</span></p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #f3e5f5;">
                            <i class="fas fa-user-graduate" style="color: #7b1fa2;"></i>
                        </div>
                        <div class="stat-content">
                            <h1>신규 입사 (이번달)</h1>
                            <p class="stat-number"><span id="newCount">0</span><span>명</span></p>
                        </div>
                    </div>
                </div>

                <!-- 부서별 필터 (동적 생성) -->
                <div class="department-filters">
                    <!-- JavaScript에서 동적으로 생성됨 -->
                </div>

                <!-- 직원 목록 테이블 -->
                <div class="employee-table-wrapper">
                    <table class="employee-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="empId">
                                    사번 <i class="fas fa-sort"></i>
                                </th>
                                <th class="sortable" data-sort="empName">
                                    이름 <i class="fas fa-sort"></i>
                                </th>
                                <th class="sortable" data-sort="empDept">
                                    부서 <i class="fas fa-sort"></i>
                                </th>
                                <th class="sortable" data-sort="empPosition">
                                    직급 <i class="fas fa-sort"></i>
                                </th>
                                <th>이메일</th>
                                <th>연락처</th>
                                <th>입사일</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Ajax로 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 직원 등록/수정 모달 -->
    <div id="employeeModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="modalTitle">직원 등록</h2>
                <button class="modal-close" id="closeEmployeeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <input type="hidden" id="employeeId">

                    <h3 class="form-section-title">기본 정보</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empName">이름 <span class="required">*</span></label>
                            <input type="text" id="empName" required placeholder="홍길동">
                        </div>
                        <div class="form-group">
                            <label for="empId">사번 <span class="required">*</span></label>
                            <input type="text" id="empId" required placeholder="자동 생성됩니다">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="empBirth">생년월일 <span class="required">*</span></label>
                            <input type="date" id="empBirth" required>
                        </div>
                        <div class="form-group">
                            <label for="empGender">성별 <span class="required">*</span></label>
                            <select id="empGender" required>
                                <option value="남">남</option>
                                <option value="여">여</option>
                            </select>
                        </div>
                    </div>

                    <h3 class="form-section-title">연락처 정보</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empEmail">이메일 <span class="required">*</span></label>
                            <input type="email" id="empEmail" required placeholder="example@pinecni.com">
                        </div>
                        <div class="form-group">
                            <label for="externalEmail">외부 이메일</label>
                            <input type="email" id="externalEmail" placeholder="example@gmail.com">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="empPhone">연락처 <span class="required">*</span></label>
                            <input type="tel" id="empPhone" required placeholder="010-1234-5678">
                        </div>
                        <div class="form-group">
                            <label for="emergencyContact">비상 연락처</label>
                            <input type="tel" id="emergencyContact" placeholder="010-1234-5678">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="empAddress">주소</label>
                        <input type="text" id="empAddress" placeholder="서울시 강남구...">
                    </div>

                    <h3 class="form-section-title">근무 정보</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empDept">부서 <span class="required">*</span></label>
                            <select id="empDept" required>
                                <!-- JavaScript에서 동적으로 로드됨 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="empPosition">직급 <span class="required">*</span></label>
                            <select id="empPosition" required>
                                <!-- JavaScript에서 동적으로 로드됨 -->
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="empJoinDate">입사일 <span class="required">*</span></label>
                            <input type="date" id="empJoinDate" required>
                        </div>
                        <div class="form-group">
                            <label for="empStatus">재직상태 <span class="required">*</span></label>
                            <select id="empStatus" required>
                                <option value="재직">재직</option>
                                <option value="휴직">휴직</option>
                                <option value="퇴사">퇴사</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="empWorkType">근무형태</label>
                            <select id="empWorkType">
                                <option value="정규직">정규직</option>
                                <option value="계약직">계약직</option>
                                <option value="인턴">인턴</option>
                                <option value="프리랜서">프리랜서</option>
                            </select>
                        </div>
                    </div>

                    <h3 class="form-section-title">추가 정보</h3>
                    <div class="form-group">
                        <label for="empNotes">비고</label>
                        <textarea id="empNotes" rows="4" placeholder="추가 정보를 입력하세요..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelEmployee">취소</button>
                <button type="submit" form="employeeForm" class="btn-primary" id="saveEmployee">저장</button>
            </div>
        </div>
    </div>

    <!-- 직원 상세보기 모달 -->
    <div id="employeeViewModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>직원 상세 정보</h2>
                <button class="modal-close" id="closeEmployeeViewModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <h3 class="form-section-title">기본 정보</h3>
                <div class="form-row">
                    <div class="view-group">
                        <label>이름</label>
                        <p id="view-empName">-</p>
                    </div>
                    <div class="view-group">
                        <label>사번</label>
                        <p id="view-empId">-</p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="view-group">
                        <label>생년월일</label>
                        <p id="view-empBirth">-</p>
                    </div>
                    <div class="view-group">
                        <label>성별</label>
                        <p id="view-empGender">-</p>
                    </div>
                </div>

                <h3 class="form-section-title">연락처 정보</h3>
                <div class="form-row">
                    <div class="view-group">
                        <label>이메일</label>
                        <p id="view-empEmail">-</p>
                    </div>
                    <div class="view-group">
                        <label>외부 이메일</label>
                        <p id="view-externalEmail">-</p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="view-group">
                        <label>연락처</label>
                        <p id="view-empPhone">-</p>
                    </div>
                    <div class="view-group">
                        <label>비상 연락처</label>
                        <p id="view-emergencyContact">-</p>
                    </div>
                </div>

                <div class="view-group">
                    <label>주소</label>
                    <p id="view-empAddress">-</p>
                </div>

                <h3 class="form-section-title">근무 정보</h3>
                <div class="form-row">
                    <div class="view-group">
                        <label>부서</label>
                        <p id="view-empDept">-</p>
                    </div>
                    <div class="view-group">
                        <label>직급</label>
                        <p id="view-empPosition">-</p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="view-group">
                        <label>입사일</label>
                        <p id="view-empJoinDate">-</p>
                    </div>
                    <div class="view-group">
                        <label>재직상태</label>
                        <p id="view-empStatus">-</p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="view-group">
                        <label>근무형태</label>
                        <p id="view-empWorkType">-</p>
                    </div>
                </div>

                <h3 class="form-section-title">추가 정보</h3>
                <div class="view-group">
                    <label>비고</label>
                    <p id="view-empNotes" style="white-space: pre-wrap;">-</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="closeEmployeeViewModal2">닫기</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/hr.js}"></script>
</body>
</html>
