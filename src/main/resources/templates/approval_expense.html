<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출승인서', '/css/approval_expense.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-won-sign"></i> 문서 작성 > 지출승인서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 -->
                    <aside class="template-sidebar">
                        <div class="sidebar-section">
                            <div class="sidebar-header">
                                <h3 class="sidebar-title"><i class="fas fa-file-alt"></i> 문서 양식</h3>
                                <button class="btn-toggle-all" id="toggleAllBtn">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </div>
                            <nav class="sidebar-menu">
                                <!-- 인사 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-user-tie"></i>
                                        <span>인사</span>
                                        <span class="category-badge">1</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/vacation" class="menu-item">
                                            <i class="fas fa-umbrella-beach"></i>
                                            <span>연차신청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 지출 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-coins"></i>
                                        <span>지출</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/expense" class="menu-item active">
                                            <i class="fas fa-won-sign"></i>
                                            <span>지출승인서</span>
                                        </a>
                                        <a href="/approval/purchase" class="menu-item">
                                            <i class="fas fa-shopping-cart"></i>
                                            <span>구매요청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 보고 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-chart-line"></i>
                                        <span>보고</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/weekly-report" class="menu-item">
                                            <i class="fas fa-calendar-week"></i>
                                            <span>주간업무보고</span>
                                    </a>
                                    <a href="/approval/project-weekly-report" class="menu-item">
                                        <i class="fas fa-project-diagram"></i>
                                        <span>프로젝트 주간업무보고</span>
                                        </a>
                                        <a href="/approval/monthly-report" class="menu-item">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span>월간업무보고</span>
                                        </a>
                                        <a href="/approval/meeting" class="menu-item">
                                            <i class="fas fa-users"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/general" class="menu-item">
                                            <i class="fas fa-file-alt"></i>
                                            <span>일반기안문서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 출장 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-plane-departure"></i>
                                        <span>출장</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/business-trip" class="menu-item">
                                            <i class="fas fa-plane"></i>
                                            <span>출장신청</span>
                                        </a>
                                        <a href="/approval/trip-report" class="menu-item">
                                            <i class="fas fa-clipboard-list"></i>
                                            <span>출장보고서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 연구비증빙 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-file-invoice-dollar"></i>
                                        <span>연구비증빙</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/receipt-meeting" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/receipt-trip" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>출장</span>
                                        </a>
                                        <a href="/approval/receipt-trip-meeting" class="menu-item">
                                            <i class="fas fa-file-invoice"></i>
                                            <span>출장+회의</span>
                                        </a>
                                        <a href="/approval/receipt-overtime" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>야근식대</span>
                                        </a>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 상단 헤더: 제목 + 결재라인 -->
                            <div class="expense-header">
                                <div class="expense-title-section">
                                    <h2 class="expense-doc-title">支 出 稟 議 書</h2>
                                    <div class="expense-date">
                                        <input type="date" id="documentDate" class="auto-today">
                                    </div>
                                </div>
                                <div class="expense-approval-line">
                                    <table class="expense-approval-table">
                                        <tr>
                                            <th class="approval-position">담 당</th>
                                            <th class="approval-position">상 무</th>
                                            <th class="approval-position">대 표</th>
                                        </tr>
                                        <tr>
                                            <td class="approval-sign"></td>
                                            <td class="approval-sign"></td>
                                            <td class="approval-sign"></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>

                            <!-- 기본 정보 테이블 -->
                            <table class="expense-info-table">
                                <tr>
                                    <th style="width: 80px;">부서/팀</th>
                                    <td style="width: 150px;"><input type="text" id="applicantDept" readonly></td>
                                    <th style="width: 100px;">프로젝트명</th>
                                    <td><input type="text" placeholder="프로젝트명 입력"></td>
                                </tr>
                                <tr>
                                    <th>一金</th>
                                    <td colspan="3">
                                        <div class="amount-display">
                                            <span id="amountKorean" class="korean-amount">일금</span>
                                            <span class="amount-suffix">整</span>
                                            <span class="amount-number" id="amountNumber">(₩ 0)</span>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- 지출 내역 테이블 -->
                            <div class="expense-detail-section">
                                <div class="section-header-with-btn">
                                    <button type="button" class="btn-add-row" id="addRowBtn">
                                        <i class="fas fa-plus"></i> 행 추가
                                    </button>
                                </div>
                                <table class="expense-detail-table" id="expenseTable">
                                    <thead>
                                        <tr>
                                            <th style="width: 70px;">월/일</th>
                                            <th style="width: 35%;">적요</th>
                                            <th style="width: 100px;">상 호</th>
                                            <th style="width: 120px;">금 액</th>
                                            <th style="width: 80px;">비고</th>
                                            <th style="width: 40px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="expenseTableBody">
                                        <tr class="expense-row">
                                            <td><input type="text" class="date-input" placeholder="10/28"></td>
                                            <td><input type="text" class="description-input" placeholder="내역 입력"></td>
                                            <td><input type="text" class="shop-input" placeholder="상호명"></td>
                                            <td><input type="text" class="amount-input" placeholder="금액"></td>
                                            <td><input type="text" class="note-input" placeholder=""></td>
                                            <td>
                                                <button type="button" class="btn-delete-row">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- 하단 정보 -->
                            <table class="expense-summary-table">
                                <tr>
                                    <th style="width: 80px;">합계</th>
                                    <td style="width: 150px;"><input type="text" id="totalAmount" readonly></td>
                                    <th style="width: 80px;">기안일자</th>
                                    <td><input type="date" class="auto-today"></td>
                                </tr>
                                <tr>
                                    <th>금액</th>
                                    <td><input type="text" id="totalAmountCopy" readonly></td>
                                    <th>기안자</th>
                                    <td><input type="text" id="applicantName" readonly></td>
                                </tr>
                                <tr>
                                    <th>품의내용</th>
                                    <td colspan="3"><textarea placeholder="품의 내용을 입력하세요" rows="3"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/approval_expense.js}"></script>
</body>
</html>
