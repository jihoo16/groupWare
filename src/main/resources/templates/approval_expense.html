<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출결의서', '/css/approval_expense.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-won-sign"></i> 문서 작성 > 지출결의서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 -->
                    <aside class="template-sidebar">
                        <div class="sidebar-section">
                            <div class="sidebar-header">
                                <h3 class="sidebar-title"><i class="fas fa-file-alt"></i> 문서 양식</h3>
                                <button class="btn-toggle-all" id="toggleAllBtn">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </div>
                            <nav class="sidebar-menu">
                                <!-- 인사 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-user-tie"></i>
                                        <span>인사</span>
                                        <span class="category-badge">1</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/vacation" class="menu-item">
                                            <i class="fas fa-umbrella-beach"></i>
                                            <span>연차신청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 지출 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-coins"></i>
                                        <span>지출</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/expense" class="menu-item active">
                                            <i class="fas fa-won-sign"></i>
                                            <span>지출결의서</span>
                                        </a>
                                        <a href="/approval/purchase" class="menu-item">
                                            <i class="fas fa-shopping-cart"></i>
                                            <span>구매요청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 보고 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-chart-line"></i>
                                        <span>보고</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/weekly-report" class="menu-item">
                                            <i class="fas fa-calendar-week"></i>
                                            <span>주간업무보고</span>
                                        </a>
                                        <a href="/approval/monthly-report" class="menu-item">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span>월간업무보고</span>
                                        </a>
                                        <a href="/approval/meeting" class="menu-item">
                                            <i class="fas fa-users"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/general" class="menu-item">
                                            <i class="fas fa-file-alt"></i>
                                            <span>일반기안문서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 출장 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-plane-departure"></i>
                                        <span>출장</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/business-trip" class="menu-item">
                                            <i class="fas fa-plane"></i>
                                            <span>출장신청</span>
                                        </a>
                                        <a href="/approval/trip-report" class="menu-item">
                                            <i class="fas fa-clipboard-list"></i>
                                            <span>출장보고서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 연구비증빙 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-file-invoice-dollar"></i>
                                        <span>연구비증빙</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/receipt-meeting" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/receipt-trip" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>출장</span>
                                        </a>
                                        <a href="/approval/receipt-trip-meeting" class="menu-item">
                                            <i class="fas fa-file-invoice"></i>
                                            <span>출장+회의</span>
                                        </a>
                                        <a href="/approval/receipt-overtime" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>야근식대</span>
                                        </a>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 결재선 -->
                        <div class="approval-line-section">
                            <div class="section-header">
                                <h4><i class="fas fa-users"></i> 결재선</h4>
                                <button class="btn-add" id="addApproverBtn">
                                    <i class="fas fa-plus"></i>
                                    결재자 추가
                                </button>
                            </div>
                            <div class="approver-chips" id="approverChips">
                                <div class="empty-message">결재자를 추가해주세요</div>
                            </div>
                        </div>

                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="approval-sign-cell" data-role="담당" data-approver-id="">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell" data-role="부서장" data-approver-id="">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell" data-role="대표이사" data-approver-id="">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name" data-role="담당">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name" data-role="부서장">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name" data-role="대표이사">-</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-date-cell">
                                            <span class="approval-date" data-role="담당">-</span>
                                        </td>
                                        <td class="approval-date-cell">
                                            <span class="approval-date" data-role="부서장">-</span>
                                        </td>
                                        <td class="approval-date-cell">
                                            <span class="approval-date" data-role="대표이사">-</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <h2 class="doc-title">지 출 결 의 서</h2>

                            <table class="form-table">
                                <tr>
                                    <th>기안자</th>
                                    <td><input type="text" value="홍길동" readonly></td>
                                    <th>부서</th>
                                    <td><input type="text" value="개발팀" readonly></td>
                                </tr>
                                <tr>
                                    <th>신청일</th>
                                    <td><input type="date" class="auto-today"></td>
                                    <th>사용일</th>
                                    <td><input type="date"></td>
                                </tr>
                                <tr>
                                    <th>지출 항목</th>
                                    <td colspan="3"><input type="text" placeholder="예: 사무용품 구매"></td>
                                </tr>
                                <tr>
                                    <th>금액</th>
                                    <td><input type="number" placeholder="금액 입력"></td>
                                    <th>지급 방법</th>
                                    <td>
                                        <select>
                                            <option>법인카드</option>
                                            <option>개인 카드</option>
                                            <option>현금</option>
                                            <option>계좌이체</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <th>사용 내역</th>
                                    <td colspan="3"><textarea placeholder="상세 사용 내역을 입력하세요"></textarea></td>
                                </tr>
                                <tr>
                                    <th>비고</th>
                                    <td colspan="3"><textarea placeholder="추가 사항이 있으면 입력하세요"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                결재 요청
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 결재자 선택 모달 -->
    <div class="modal" id="approverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>결재자 선택</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="approverSearch" placeholder="이름 또는 부서 검색...">
                </div>
                <div class="employee-list" id="employeeList">
                    <!-- 동적 생성 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn-primary" onclick="addApprover()">추가</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/approval_expense.js}"></script>
</body>
</html>
