<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출승인서', '/css/approval_expense.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-won-sign"></i> 문서 작성 > 지출승인서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                    <div class="action-buttons" id="actionButtons" style="display:none;">
                        <button class="btn-print btn-lg" id="printBtn">
                            <i class="fas fa-print"></i>
                            인쇄하기
                        </button>
                        <button class="btn-primary btn-lg" id="submitBtn">
                            <i class="fas fa-paper-plane"></i>
                            저장
                        </button>
                    </div>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('expense')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 입력 영역 -->
                        <div class="input-area">
                            <!-- 기본 정보 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-info-circle"></i> 기본 정보</h3>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label><i class="fas fa-building"></i> 부서/팀</label>
                                        <div class="form-text-display" id="applicantDept">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-user"></i> 기안자</label>
                                        <div class="form-text-display" id="applicantName">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label for="documentDate"><i class="fas fa-calendar"></i> 기안일자 <span class="required-mark">*</span></label>
                                        <input type="date" id="documentDate" class="form-input auto-today">
                                    </div>
                                    <div class="form-group">
                                        <label for="projectName"><i class="fas fa-project-diagram"></i> 프로젝트명 <span class="required-mark">*</span></label>
                                        <input type="text" id="projectName" class="form-input" placeholder="프로젝트명 입력">
                                    </div>
                                    <div class="form-group">
                                        <label for="paymentMethod"><i class="fas fa-credit-card"></i> 결제수단 <span class="required-mark">*</span></label>
                                        <select id="paymentMethod" class="form-input">
                                            <option value="">선택하세요</option>
                                            <option value="법인카드">법인카드</option>
                                            <option value="개인카드" selected>개인카드</option>
                                            <option value="현금">현금</option>
                                            <option value="기타">기타</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 지출 내역 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-list"></i> 지출 내역 <span class="required-mark">*</span></h3>
                                    <button type="button" class="btn-add-row" id="addRowBtn">
                                        <i class="fas fa-plus"></i> 항목 추가
                                    </button>
                                </div>
                                <div class="expense-items-container" id="expenseItemsContainer">
                                    <!-- 지출 항목이 여기에 추가됩니다 -->
                                    <div class="expense-item">
                                        <div class="expense-item-header">
                                            <span class="expense-item-number">1</span>
                                            <button type="button" class="btn-remove-item" onclick="removeExpenseItem(this)">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                        <div class="expense-item-body">
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 0 0 180px;">
                                                    <label><i class="fas fa-calendar-day"></i> 날짜</label>
                                                    <input type="text" class="form-input date-input expense-date-picker" placeholder="날짜 선택" readonly>
                                                </div>
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-edit"></i> 적요</label>
                                                    <input type="text" class="form-input description-input" placeholder="지출 내역 입력">
                                                </div>
                                            </div>
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-store"></i> 상호</label>
                                                    <input type="text" class="form-input shop-input" placeholder="상호명 입력">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 200px;">
                                                    <label><i class="fas fa-won-sign"></i> 금액</label>
                                                    <input type="text" class="form-input amount-input" placeholder="금액 입력">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 150px;">
                                                    <label><i class="fas fa-sticky-note"></i> 비고</label>
                                                    <input type="text" class="form-input note-input" placeholder="">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="total-amount-display">
                                    <label>총 합계</label>
                                    <span class="total-amount" id="totalAmountDisplay">₩ 0</span>
                                </div>
                            </div>

                            <!-- 첨부파일 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                                </div>
                                <div class="file-upload-area" id="fileUploadArea">
                                    <input type="file" id="fileInput" multiple hidden>
                                    <label for="fileInput" class="file-upload-label">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                        <span>파일을 선택하거나 드래그하세요</span>
                                        <small>최대 10MB, 최대 5개</small>
                                    </label>
                                </div>
                                <div class="file-list" id="fileList"></div>
                            </div>

                            <!-- 공식 문서 미리보기 토글 -->
                            <div class="document-preview-toggle">
                                <button class="toggle-btn" id="documentFormToggle">
                                    <i class="fas fa-file-alt"></i>
                                    공식 문서 미리보기
                                    <i class="fas fa-chevron-down toggle-icon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 공식 문서 미리보기 영역 -->
                        <div class="document-form-wrapper collapsed">
                            <div class="document-form">

                                <!-- 제목 + 결재란 (flex 레이아웃) -->
                                <div style="display: flex; align-items: flex-start; gap: 16px; margin-bottom: 10px;">
                                    <div style="flex-shrink: 0; padding-top: 2px;">
                                        <h2 class="expense-doc-title">支 出 稟 議 書</h2>
                                        <div style="font-size: 12px; color: #555; margin-top: 4px;">
                                            <span class="auto-date">-</span>
                                        </div>
                                    </div>
                                    <div style="flex: 0 0 80%;">
                                        <table style="width: 100%; border: 2px solid #000; border-collapse: collapse; table-layout: fixed;">
                                            <colgroup>
                                                <col style="width: 26px;">
                                                <col>
                                                <col>
                                                <col>
                                                <col>
                                            </colgroup>
                                            <tr>
                                                <td rowspan="2" style="border: 1px solid #000; padding: 4px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; writing-mode: vertical-lr; letter-spacing: 3px;">결재</td>
                                                <td style="border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">담 당</td>
                                                <td style="border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">부서장</td>
                                                <td style="border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">상 무</td>
                                                <td style="border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">대 표</td>
                                            </tr>
                                            <tr>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>

                                <!-- 품의부서 / 프로젝트명 / 一金 테이블 -->
                                <table class="expense-info-table">
                                    <tr>
                                        <th style="width: 70px;">품의부서</th>
                                        <td style="width: 160px;" class="auto-dept">-</td>
                                        <th style="width: 70px;">프로젝트명</th>
                                        <td class="auto-project">-</td>
                                        <td rowspan="2" style="width: 55px; text-align: center; font-weight: bold; font-size: 13px; vertical-align: middle; background: #f5f5f5;">검 인</td>
                                    </tr>
                                    <tr>
                                        <th>一 金</th>
                                        <td colspan="3">
                                            <div class="amount-display">
                                                <span id="amountKorean" class="korean-amount">일금</span>
                                                <span class="amount-suffix">整</span>
                                                <span class="amount-number" id="amountNumber">(₩ 0)</span>
                                            </div>
                                        </td>
                                    </tr>
                                </table>

                                <!-- 지출 내역 테이블 -->
                                <div class="expense-detail-section">
                                    <table class="expense-detail-table" id="expensePreviewTable">
                                        <thead>
                                            <tr>
                                                <th style="width: 60px;">일 자</th>
                                                <th>적 요</th>
                                                <th style="width: 110px;">상 호</th>
                                                <th style="width: 120px;">금 액</th>
                                                <th style="width: 80px;">비 고</th>
                                            </tr>
                                        </thead>
                                        <tbody id="expensePreviewBody">
                                            <tr>
                                                <td class="empty-row" colspan="5">지출 내역이 없습니다</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 합계 -->
                                <table class="expense-summary-table">
                                    <tr>
                                        <th style="width: 80px;">합 計</th>
                                        <td class="auto-total" style="font-weight: 700;">₩ 0</td>
                                    </tr>
                                </table>

                                <!-- 결제 내역 테이블 -->
                                <table class="expense-payment-table">
                                    <tr>
                                        <th>현 금</th>
                                        <td id="cashAmountDisplay"></td>
                                        <th>기 일</th>
                                        <td></td>
                                        <th>작성자</th>
                                        <td class="auto-applicant" colspan="3">-</td>
                                    </tr>
                                    <tr>
                                        <th>카 드</th>
                                        <td id="cardAmountDisplay"></td>
                                        <th>카드업원</th>
                                        <td id="paymentMethodDisplay"></td>
                                        <th>카드번호</th>
                                        <td colspan="3"></td>
                                    </tr>
                                    <tr>
                                        <th>상 호</th>
                                        <td colspan="3"></td>
                                        <th>사업자번호</th>
                                        <td colspan="3"></td>
                                    </tr>
                                    <tr>
                                        <th>품의번호</th>
                                        <td></td>
                                        <th>거래일자</th>
                                        <td></td>
                                        <th>자동승인일</th>
                                        <td colspan="3"></td>
                                    </tr>
                                    <tr>
                                        <th>비 고</th>
                                        <td colspan="7"></td>
                                    </tr>
                                </table>

                                <!-- 하단: 정산입력 + 회사명 -->
                                <div style="display: flex; justify-content: flex-end; align-items: flex-end; margin-top: 10px; gap: 16px;">
                                    <table style="border: 1px solid #000; border-collapse: collapse;">
                                        <tr>
                                            <td style="width: 80px; border: 1px solid #000; padding: 4px 8px; text-align: center; font-size: 11px; font-weight: bold; background: #f0f0f0;">정 산 입 력</td>
                                        </tr>
                                        <tr>
                                            <td style="height: 40px; border: 1px solid #000; padding: 5px;"></td>
                                        </tr>
                                    </table>
                                    <div style="font-size: 12px; font-weight: bold; padding-bottom: 4px;">
                                        주식회사 파인씨앤아이
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 날짜 선택 모달 -->
    <div class="date-modal" id="dateModal">
        <div class="date-modal-content">
            <div class="date-modal-header">
                <h3><i class="fas fa-calendar-alt"></i> 날짜 선택</h3>
                <button class="date-modal-close" onclick="closeDateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="date-modal-body">
                <div class="date-calendar-header">
                    <button class="date-calendar-nav" id="datePrevMonth">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h4 class="date-calendar-title" id="dateCalendarTitle">2025년 1월</h4>
                    <button class="date-calendar-nav" id="dateNextMonth">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="date-calendar-weekdays">
                    <div class="date-weekday sun">일</div>
                    <div class="date-weekday">월</div>
                    <div class="date-weekday">화</div>
                    <div class="date-weekday">수</div>
                    <div class="date-weekday">목</div>
                    <div class="date-weekday">금</div>
                    <div class="date-weekday sat">토</div>
                </div>
                <div class="date-calendar-days" id="dateCalendarDays">
                    <!-- JavaScript로 생성 -->
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/approval_expense.js}"></script>
</body>
</html>
