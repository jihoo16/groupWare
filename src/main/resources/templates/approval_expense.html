<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출승인서', '/css/approval_expense.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-won-sign"></i> 문서 작성 > 지출승인서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-outline btn-lg" id="printBtn" style="display:none;">
                        <i class="fas fa-print"></i>
                        인쇄하기
                    </button>
                    <button class="btn-primary btn-lg btn-with-tooltip" id="submitBtn">
                        <i class="fas fa-paper-plane"></i>
                        저장
                        <span class="tooltip-text">💡 모든 필수값을 채우면 좌측에 인쇄하기 버튼이 나타납니다</span>
                    </button>
                    <button class="btn-secondary btn-lg" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('expense')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 개인경비 제출 안내 배너 -->
                        <div class="monthly-notice">
                            <div class="monthly-notice-icon">
                                <i class="fas fa-calendar-check"></i>
                            </div>
                            <div class="monthly-notice-divider"></div>
                            <div class="monthly-notice-body">
                                <div class="monthly-notice-title">개인경비 제출 안내</div>
                                <div class="monthly-notice-items">
                                    <span><i class="fas fa-circle-dot"></i> 개인경비는 한달에 한번 처리되는 업무입니다. </span>
                                    <span><i class="fas fa-circle-dot"></i> 반복잡업을 줄이기 위해 <strong>월 1건</strong>의 문서만 생성·인쇄하여 관리부에 제출하세요.</span>
                                    <span><i class="fas fa-circle-dot"></i> 매달 <strong>13일</strong>까지 제출 — <em>휴일인 경우 직전 영업일까지</em></span>
                                </div>
                            </div>
                        </div>

                        <!-- 입력 영역 -->
                        <div class="input-area">
                            <!-- 기본 정보 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-info-circle"></i> 기본 정보</h3>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label><i class="fas fa-building"></i> 부서/팀</label>
                                        <div class="form-text-display" id="applicantDept">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-user"></i> 기안자</label>
                                        <div class="form-text-display" id="applicantName">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-calendar"></i> 기안일자</label>
                                        <div class="form-text-display" id="documentDate"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 지출 내역 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-list"></i> 지출 내역 <span class="required-mark">*</span></h3>
                                    <button type="button" class="btn-add-row" id="addRowBtn">
                                        <i class="fas fa-plus"></i> 항목 추가
                                    </button>
                                </div>
                                <div class="expense-items-container" id="expenseItemsContainer">
                                    <!-- 지출 항목이 여기에 추가됩니다 -->
                                    <div class="expense-item">
                                        <div class="expense-item-header">
                                            <span class="expense-item-number">1</span>
                                            <button type="button" class="btn-remove-item" onclick="removeExpenseItem(this)">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                        <div class="expense-item-body">
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 0 0 180px;">
                                                    <label><i class="fas fa-calendar-day"></i> 날짜</label>
                                                    <input type="text" class="form-input date-input expense-date-picker" placeholder="날짜 선택" readonly>
                                                </div>
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-edit"></i> 적요</label>
                                                    <input type="text" class="form-input description-input" placeholder="지출 내역 입력. [예시] 야근식대 (김파인, 이씨앤, 홍아이)">
                                                </div>
                                            </div>
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-store"></i> 상호</label>
                                                    <input type="text" class="form-input shop-input" placeholder="상호명 입력">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 120px;">
                                                    <label><i class="fas fa-credit-card"></i> 결제수단</label>
                                                    <select class="form-input payment-method-select">
                                                        <option value="개인카드" selected>개인카드</option>
                                                        <option value="현금">현금</option>
                                                    </select>
                                                </div>
                                                <div class="form-group" style="flex: 0 0 180px;">
                                                    <label><i class="fas fa-won-sign"></i> 금액</label>
                                                    <input type="text" class="form-input amount-input" placeholder="금액 입력" inputmode="numeric">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 150px;">
                                                    <label><i class="fas fa-sticky-note"></i> 비고</label>
                                                    <input type="text" class="form-input note-input" placeholder="">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="total-amount-display">
                                    <label>총 합계</label>
                                    <span class="total-amount" id="totalAmountDisplay">₩ 0</span>
                                </div>
                            </div>

                            <!-- 공식 문서 미리보기 토글 -->
                            <div class="document-preview-toggle">
                                <button class="toggle-btn" id="documentFormToggle">
                                    <i class="fas fa-file-alt"></i>
                                    공식 문서 미리보기
                                    <i class="fas fa-chevron-down toggle-icon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 공식 문서 미리보기 영역 -->
                        <div class="document-form-wrapper collapsed">
                            <div class="document-form">

                                <!-- 제목 + 결재란 (flex 레이아웃) -->
                                <div style="display: flex; align-items: flex-start; gap: 16px; margin-bottom: 10px;">
                                    <div style="flex-shrink: 0; padding-top: 2px;">
                                        <h2 class="expense-doc-title">지출결의서</h2>
                                        <div style="font-size: 12px; color: #555; margin-top: 4px;">
                                            <span class="auto-date">-</span>
                                        </div>
                                    </div>
                                    <div style="flex-shrink: 0; margin-left: auto;">
                                        <table style="border: 2px solid #000; border-collapse: collapse;">
                                            <tr>
                                                <td rowspan="2" style="width: 14px; border: 1px solid #000; padding: 4px 1px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; writing-mode: vertical-lr; letter-spacing: 3px;">결재</td>
                                                <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">담 당</td>
                                                <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">부서장</td>
                                                <td style="width: 80px; border: 1px solid #000; padding: 4px 6px; text-align: center; background: #f0f0f0; font-weight: bold; font-size: 11px; white-space: nowrap;">대 표</td>
                                            </tr>
                                            <tr>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                                <td style="height: 70px; border: 1px solid #000; padding: 5px; text-align: center;"></td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>

                                <!-- 품의부서 / 一金 테이블 -->
                                <table class="expense-info-table">
                                    <tr>
                                        <th style="width: 70px;">품의부서</th>
                                        <td class="auto-dept">-</td>
                                        <th style="width: 70px;">작성자</th>
                                        <td class="auto-applicant">-</td>
                                    </tr>
                                    <tr>
                                        <th>합계</th>
                                        <td colspan="3">
                                            <div class="amount-display">
                                                <span id="amountKorean" class="korean-amount">일금</span>
                                                <span class="amount-number" id="amountNumber">(₩ 0)</span>
                                            </div>
                                        </td>
                                    </tr>
                                </table>

                                <!-- 지출 내역 테이블 -->
                                <div class="expense-detail-section">
                                    <table class="expense-detail-table" id="expensePreviewTable">
                                        <thead>
                                            <tr>
                                                <th style="width: 60px;">일 자</th>
                                                <th>적 요</th>
                                                <th style="width: 100px;">상 호</th>
                                                <th style="width: 80px;">결제수단</th>
                                                <th style="width: 110px;">금 액</th>
                                                <th style="width: 80px;">비 고</th>
                                            </tr>
                                        </thead>
                                        <tbody id="expensePreviewBody">
                                            <tr>
                                                <td class="empty-row" colspan="6">지출 내역이 없습니다</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 합계 -->
                                <table class="expense-summary-table">
                                    <tr>
                                        <th style="width: 80px;">합계</th>
                                        <td class="auto-total" style="font-weight: 700;">₩ 0</td>
                                    </tr>
                                </table>

                                <!-- 결제 수단별 금액 -->
                                <table class="expense-payment-table">
                                    <tr>
                                        <th>현금</th>
                                        <td id="cashAmountDisplay"></td>
                                    </tr>
                                    <tr>
                                        <th>카드</th>
                                        <td id="cardAmountDisplay"></td>
                                    </tr>
                                </table>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 날짜 선택 모달 -->
    <div class="date-modal" id="dateModal">
        <div class="date-modal-content">
            <div class="date-modal-header">
                <h3><i class="fas fa-calendar-alt"></i> 날짜 선택</h3>
                <button class="date-modal-close" onclick="closeDateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="date-modal-body">
                <div class="date-calendar-header">
                    <button class="date-calendar-nav" id="datePrevMonth">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h4 class="date-calendar-title" id="dateCalendarTitle">2025년 1월</h4>
                    <button class="date-calendar-nav" id="dateNextMonth">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="date-calendar-weekdays">
                    <div class="date-weekday sun">일</div>
                    <div class="date-weekday">월</div>
                    <div class="date-weekday">화</div>
                    <div class="date-weekday">수</div>
                    <div class="date-weekday">목</div>
                    <div class="date-weekday">금</div>
                    <div class="date-weekday sat">토</div>
                </div>
                <div class="date-calendar-days" id="dateCalendarDays">
                    <!-- JavaScript로 생성 -->
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/approval_expense.js}"></script>
</body>
</html>
