<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 - 개인경비지출 관리', '/css/admin-expense-documents.css')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('admin-expense-documents')}"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title"><i class="fas fa-won-sign"></i> 개인경비지출 관리</h1>
            </div>
            <div class="header-right">
                <button class="btn-refresh" id="refreshBtn" title="새로고침">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div class="content-area">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-group">
                    <label><i class="fas fa-user-search"></i> 사용자 검색</label>
                    <input type="text" id="userSearchInput" class="search-input" placeholder="이름 검색 (초성 검색 가능)">
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-filter"></i> 문서 상태</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">전체</option>
                        <option value="active" selected>정상</option>
                        <option value="deleted">삭제됨</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-calendar-alt"></i> 연도</label>
                    <select id="yearFilter" class="filter-select">
                        <option value="">전체</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-receipt"></i> 첨부 현황</label>
                    <select id="receiptFilter" class="filter-select">
                        <option value="all">전체</option>
                        <option value="allComplete">모두 완료 (영수증+공식문서)</option>
                        <option value="complete">영수증 완료</option>
                        <option value="incomplete">영수증 미완료</option>
                        <option value="noDocument">공식문서 미첨부</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-search"></i> 기타 검색</label>
                    <input type="text" id="searchInput" class="search-input" placeholder="부서, 문서번호 검색...">
                </div>
            </div>

            <!-- 문서 목록 -->
            <div class="documents-list" id="documentsList">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>데이터를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin-expense-documents.js}"></script>
</body>
</html>
