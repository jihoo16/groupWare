<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문서를 찾을 수 없음', null)}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('')}"></div>

    <main class="main-content" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
        <div style="text-align:center; max-width:480px;">
            <i class="fas fa-file-excel" style="font-size:64px; color:#667eea; margin-bottom:20px;"></i>
            <h1 style="font-size:48px; font-weight:900; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:12px;">앗!</h1>
            <h2 style="font-size:24px; font-weight:700; color:#333; margin-bottom:16px;">여기 아무것도 없네요</h2>
            <p style="font-size:14px; color:#666; line-height:1.6; margin-bottom:32px;">
                찾으시는 문서가 사라졌거나 이사를 갔어요.<br>
                삭제되었거나 다른 곳으로 옮겨졌을 수 있습니다.
            </p>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                <button onclick="window.location.href='/home'"
                        style="padding:12px 28px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#667eea,#764ba2); color:white; box-shadow:0 4px 12px rgba(102,126,234,0.4); display:inline-flex; align-items:center; gap:8px; transition:all 0.2s;">
                    <i class="fas fa-home"></i> 홈으로 돌아가기
                </button>
                <button onclick="goBack()"
                        style="padding:12px 28px; border:2px solid #e0e0e0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; background:#f5f7fa; color:#555; display:inline-flex; align-items:center; gap:8px; transition:all 0.2s;">
                    <i class="fas fa-arrow-left"></i> 이전 페이지
                </button>
            </div>
        </div>
    </main>
</div>

<script>
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '/home';
        }
    }
</script>
</body>
</html>
