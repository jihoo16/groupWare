<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('전사 게시판', '/css/board.css')}"></head>
<body>
    <div class="container">
        <div th:replace="~{fragments/sidebar :: sidebar('board')}"></div>
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-clipboard-list"></i> 전사 게시판</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="boardSearch" placeholder="게시글 검색...">
                    </div>
                    <button class="btn-primary" id="newPostBtn"><i class="fas fa-pen"></i> 새 게시글</button>
                </div>
            </header>
            <div class="board-container">
                <div class="board-filters">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">전체 <span class="tab-count">15</span></button>
                        <button class="filter-tab" data-filter="notice">공지사항 <span class="tab-count">3</span></button>
                        <button class="filter-tab" data-filter="important">중요 <span class="tab-count">2</span></button>
                        <button class="filter-tab" data-filter="unread">읽지 않음 <span class="tab-count">5</span></button>
                    </div>
                </div>
                <div class="board-list" id="boardList"></div>
                <div class="pagination">
                    <button class="page-btn" disabled><i class="fas fa-chevron-left"></i></button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                    <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>
    <div id="postModal" class="modal"></div>
    <div id="postDetailModal" class="modal"></div>
    <div id="readersModal" class="modal"></div>
    <script th:src="@{/js/board.js}"></script>
</body>
</html>
