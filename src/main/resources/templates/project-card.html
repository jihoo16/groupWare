<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('연구비카드 관리', '/css/project.css')"></head>
<body>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar('project-card')"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">연구비카드 관리</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="addCardBtn">
                    <i class="fas fa-credit-card"></i> 카드 등록
                </button>
            </div>
        </header>

        <div class="content-card">
            <div class="card-header">
                <h2>등록된 연구비 카드</h2>
                <div class="filter-group">
                    <select id="cardCompanyFilter" class="filter-select">
                        <option value="">전체 카드사</option>
                        <option value="신한카드">신한카드</option>
                        <option value="KB국민카드">KB국민카드</option>
                        <option value="하나카드">하나카드</option>
                        <option value="삼성카드">삼성카드</option>
                        <option value="현대카드">현대카드</option>
                        <option value="BC카드">BC카드</option>
                        <option value="롯데카드">롯데카드</option>
                        <option value="NH농협카드">NH농협카드</option>
                        <option value="우리카드">우리카드</option>
                        <option value="IBK기업은행카드">IBK기업은행카드</option>
                    </select>
                    <input type="text" id="searchInput" class="search-input" placeholder="카드번호 또는 프로젝트명 검색...">
                </div>
            </div>

            <div class="card-grid-container">
                <!-- 카드 그리드 -->
                <div class="research-card-grid" id="cardGrid">
                    <!-- Sample cards - 실제로는 백엔드에서 데이터를 받아옴 -->
                    <div class="research-card-item" data-company="신한카드" data-number="1234" data-project="ERP 시스템 개발" data-project-id="1">
                        <div class="research-card-visual" onclick="showProjectInfo(1)">
                            <div class="research-card-chip">
                                <i class="fas fa-microchip"></i>
                            </div>
                            <div class="research-card-company">신한카드</div>
                            <div class="research-card-number">**** **** **** 1234</div>
                        </div>
                        <div class="research-card-info" onclick="showProjectInfo(1)">
                            <div class="info-row">
                                <span class="info-label">연결 프로젝트</span>
                                <span class="info-value">ERP 시스템 개발</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">등록일</span>
                                <span class="info-value">2025-01-15</span>
                            </div>
                        </div>
                        <div class="research-card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="editCard(1)">
                                <i class="fas fa-edit"></i> 수정
                            </button>
                            <button class="btn btn-sm btn-delete" onclick="deleteCard(1)">
                                <i class="fas fa-trash"></i> 삭제
                            </button>
                        </div>
                    </div>

                    <div class="research-card-item" data-company="KB국민카드" data-number="5678" data-project="모바일 앱 개발" data-project-id="2">
                        <div class="research-card-visual" onclick="showProjectInfo(2)">
                            <div class="research-card-chip">
                                <i class="fas fa-microchip"></i>
                            </div>
                            <div class="research-card-company">KB국민카드</div>
                            <div class="research-card-number">**** **** **** 5678</div>
                        </div>
                        <div class="research-card-info" onclick="showProjectInfo(2)">
                            <div class="info-row">
                                <span class="info-label">연결 프로젝트</span>
                                <span class="info-value">모바일 앱 개발</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">등록일</span>
                                <span class="info-value">2025-01-10</span>
                            </div>
                        </div>
                        <div class="research-card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="editCard(2)">
                                <i class="fas fa-edit"></i> 수정
                            </button>
                            <button class="btn btn-sm btn-delete" onclick="deleteCard(2)">
                                <i class="fas fa-trash"></i> 삭제
                            </button>
                        </div>
                    </div>

                    <div class="research-card-item" data-company="삼성카드" data-number="9012" data-project="ERP 시스템 개발">
                        <div class="research-card-visual">
                            <div class="research-card-chip">
                                <i class="fas fa-microchip"></i>
                            </div>
                            <div class="research-card-company">삼성카드</div>
                            <div class="research-card-number">**** **** **** 9012</div>
                        </div>
                        <div class="research-card-info">
                            <div class="info-row">
                                <span class="info-label">연결 프로젝트</span>
                                <span class="info-value">ERP 시스템 개발</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">등록일</span>
                                <span class="info-value">2025-01-05</span>
                            </div>
                        </div>
                        <div class="research-card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="editCard(3)">
                                <i class="fas fa-edit"></i> 수정
                            </button>
                            <button class="btn btn-sm btn-delete" onclick="deleteCard(3)">
                                <i class="fas fa-trash"></i> 삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 카드 등록/수정 모달 -->
<div id="cardModal" class="modal">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h2 id="modalTitle">연구비카드 등록</h2>
            <button class="modal-close" onclick="closeCardModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="cardCompany">카드사 <span class="required">*</span></label>
                <select id="cardCompany" class="form-control">
                    <option value="">선택하세요</option>
                    <option value="신한카드">신한카드</option>
                    <option value="KB국민카드">KB국민카드</option>
                    <option value="하나카드">하나카드</option>
                    <option value="삼성카드">삼성카드</option>
                    <option value="현대카드">현대카드</option>
                    <option value="BC카드">BC카드</option>
                    <option value="롯데카드">롯데카드</option>
                    <option value="NH농협카드">NH농협카드</option>
                    <option value="우리카드">우리카드</option>
                    <option value="IBK기업은행카드">IBK기업은행카드</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cardNumber">카드 뒷 4자리 <span class="required">*</span></label>
                <input type="text" id="cardNumber" class="form-control" placeholder="1234" maxlength="4" pattern="\d{4}">
                <small class="form-text">숫자 4자리를 입력하세요</small>
            </div>
            <div class="form-group">
                <label for="projectSelect">연결 프로젝트 <span class="required">*</span></label>
                <select id="projectSelect" class="form-control">
                    <option value="">선택하세요</option>
                    <option value="1">ERP 시스템 개발</option>
                    <option value="2">모바일 앱 개발</option>
                    <option value="3">홈페이지 리뉴얼</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCardModal()">취소</button>
            <button class="btn btn-primary" onclick="saveCard()">
                <i class="fas fa-check"></i> 저장
            </button>
        </div>
    </div>
</div>

<script th:src="@{/js/project.js}"></script>
</body>
</html>
