<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('연구비카드 관리', '/css/project.css')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('project-card')}"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">연구비카드 관리</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="addCardBtn">
                    <i class="fas fa-credit-card"></i> 카드 등록
                </button>
            </div>
        </header>

        <div class="content-card">
            <div class="card-header">
                <h2>등록된 연구비 카드</h2>
                <div class="filter-group">
                    <select id="cardCompanyFilter" class="filter-select">
                        <option value="">전체 카드사</option>
                        <option value="신한카드">신한카드</option>
                        <option value="KB국민카드">KB국민카드</option>
                        <option value="하나카드">하나카드</option>
                        <option value="삼성카드">삼성카드</option>
                        <option value="현대카드">현대카드</option>
                        <option value="BC카드">BC카드</option>
                        <option value="롯데카드">롯데카드</option>
                        <option value="NH농협카드">NH농협카드</option>
                        <option value="우리카드">우리카드</option>
                        <option value="IBK기업은행카드">IBK기업은행카드</option>
                    </select>
                    <input type="text" id="searchInput" class="search-input" placeholder="카드번호 또는 프로젝트명 검색...">
                </div>
            </div>

            <div class="card-grid-container">
                <!-- 카드 그리드 - JavaScript로 동적 생성 -->
                <div class="research-card-grid" id="cardGrid">
                    <p class="empty-message">카드 목록을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 카드 등록/수정 모달 -->
<div id="cardModal" class="modal">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h2 id="modalTitle">연구비카드 등록</h2>
            <button class="modal-close" onclick="closeCardModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="cardCompany">카드사 <span class="required">*</span></label>
                <select id="cardCompany" class="form-control">
                    <option value="">선택하세요</option>
                    <option value="신한카드">신한카드</option>
                    <option value="KB국민카드">KB국민카드</option>
                    <option value="하나카드">하나카드</option>
                    <option value="삼성카드">삼성카드</option>
                    <option value="현대카드">현대카드</option>
                    <option value="BC카드">BC카드</option>
                    <option value="롯데카드">롯데카드</option>
                    <option value="NH농협카드">NH농협카드</option>
                    <option value="우리카드">우리카드</option>
                    <option value="IBK기업은행카드">IBK기업은행카드</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cardNumber">카드 뒷 4자리 <span class="required">*</span></label>
                <input type="text" id="cardNumber" class="form-control" placeholder="숫자 4자리를 입력하세요" maxlength="4" pattern="\d{4}">
            </div>
            <div class="form-group">
                <label for="cardNickname">닉네임</label>
                <input type="text" id="cardNickname" class="form-control" placeholder="카드 닉네임을 입력하세요 (선택)" maxlength="100">
            </div>
            <div class="form-group">
                <label for="projectSelect">연결 프로젝트 <span class="required">*</span></label>
                <select id="projectSelect" class="form-control">
                    <option value="">선택하세요</option>
                    <option value="1">GROUPWARE 시스템 개발</option>
                    <option value="2">모바일 앱 개발</option>
                    <option value="3">홈페이지 리뉴얼</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCardModal()">취소</button>
            <button class="btn btn-primary" onclick="saveCard()">
                <i class="fas fa-check"></i> 저장
            </button>
        </div>
    </div>
</div>

<!-- 프로젝트 정보 모달 -->
<div id="projectInfoModal" class="modal">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2><i class="fas fa-project-diagram"></i> 프로젝트 정보</h2>
            <button class="modal-close" onclick="closeProjectInfoModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <!-- 프로젝트 기본 정보 -->
            <div class="project-info-section">
                <h3><i class="fas fa-info-circle"></i> 기본 정보</h3>
                <div class="project-info-grid">
                    <div class="project-info-item">
                        <label>프로젝트명</label>
                        <span id="infoProjectName">-</span>
                    </div>
                    <div class="project-info-item">
                        <label>상태</label>
                        <span id="infoProjectStatus" class="status-badge">-</span>
                    </div>
                    <div class="project-info-item">
                        <label>연구책임자</label>
                        <span id="infoProjectManager">-</span>
                    </div>
                    <div class="project-info-item">
                        <label>연구기간</label>
                        <span id="infoProjectPeriod">-</span>
                    </div>
                </div>
            </div>

            <!-- 참여연구원 정보 -->
            <div class="project-info-section">
                <h3><i class="fas fa-users"></i> 참여연구원</h3>
                <div class="team-members-container">
                    <table class="team-members-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>소속</th>
                                <th>직급</th>
                                <th>참여 시작일</th>
                                <th>참여 종료일</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="infoTeamMembers">
                            <tr>
                                <td colspan="6" class="text-center">참여연구원 정보가 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 프로젝트 설명 -->
            <div class="project-info-section">
                <h3><i class="fas fa-align-left"></i> 프로젝트 설명</h3>
                <p id="infoProjectDescription" class="project-description-text">-</p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeProjectInfoModal()">닫기</button>
        </div>
    </div>
</div>

<script th:src="@{/js/search-utils.js}"></script>
<script th:src="@{/js/project-card.js}"></script>
</body>
</html>
