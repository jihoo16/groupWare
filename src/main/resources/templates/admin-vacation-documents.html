<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 - 연차신청서 관리', '/css/admin-vacation-documents.css')}"></head>
<body>
<div class="container">
    <!-- 좌측 네비게이션 바 -->
    <div th:replace="~{fragments/sidebar :: sidebar('admin-vacation-documents')}"></div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title"><i class="fas fa-file-invoice"></i> 연차신청서 관리</h1>
            </div>
            <div class="header-right">
                <button class="btn-refresh" id="refreshBtn" title="새로고침">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div class="content-area">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-group">
                    <label><i class="fas fa-user-search"></i> 사용자 검색</label>
                    <input type="text" id="userSearchInput" class="search-input" placeholder="이름 검색 (초성 검색 가능)">
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-filter"></i> 문서 상태</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">전체</option>
                        <option value="active">정상</option>
                        <option value="deleted">삭제됨</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-calendar-alt"></i> 연도</label>
                    <select id="yearFilter" class="filter-select">
                        <option value="">전체</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-check-circle"></i> 승인 상태</label>
                    <select id="approvalFilter" class="filter-select">
                        <option value="all">전체</option>
                        <option value="approved">승인됨</option>
                        <option value="pending">미승인</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-search"></i> 기타 검색</label>
                    <input type="text" id="searchInput" class="search-input" placeholder="부서, 사유 검색...">
                </div>
            </div>

            <!-- 문서 목록 -->
            <div class="documents-list" id="documentsList">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>데이터를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin-vacation-documents.js}"></script>
</body>
</html>
