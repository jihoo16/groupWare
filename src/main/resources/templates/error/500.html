<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 오류 - ERP 시스템</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/404.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="error-code">500</h1>
            <h2 class="error-title">서버가 실수했어요!</h2>
            <p class="error-message">
                죄송합니다. 서버가 깜빡하고 요청을 처리하지 못했어요.<br>
                잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의하세요.
            </p>
            <div class="error-actions">
                <button class="btn-home" onclick="window.location.href='/'">
                    <i class="fas fa-home"></i>
                    홈으로 돌아가기
                </button>
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    이전 페이지
                </button>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            // referrer 확인하여 무한 루프 방지
            const referrer = document.referrer;
            const currentPath = window.location.pathname;

            // referrer가 없거나, 현재 에러 페이지이거나, approval 상세 페이지인 경우
            if (!referrer ||
                referrer.includes('/boom') ||
                referrer.includes('/nope') ||
                referrer.includes('/nothing') ||
                referrer.includes('/detail')) {
                // 에러가 발생한 페이지로 돌아가지 않고 안전한 페이지로 이동
                if (referrer.includes('/approval')) {
                    window.location.href = '/approval';
                } else if (referrer.includes('/team')) {
                    window.location.href = '/team';
                } else if (referrer.includes('/project')) {
                    window.location.href = '/project';
                } else {
                    window.location.href = '/';
                }
            } else {
                // 안전한 경우에만 뒤로 가기
                window.history.back();
            }
        }
    </script>
</body>
</html>
