<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('설정', '/css/settings.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('settings')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">설정</h1>
                    <p class="page-subtitle">개인 정보 및 계정 관리</p>
                </div>
            </header>

            <div class="settings-area">
                <!-- 설정 탭 -->
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="profile">
                        <i class="fas fa-user"></i>
                        프로필
                    </button>
                    <button class="tab-btn" data-tab="account">
                        <i class="fas fa-key"></i>
                        계정
                    </button>
                    <!-- 알림 탭 - 구현되지 않은 서비스 (주석처리)
                    <button class="tab-btn" data-tab="notification">
                        <i class="fas fa-bell"></i>
                        알림
                    </button>
                    -->
                    <!-- 시스템 탭 - 구현되지 않은 서비스 (주석처리)
                    <button class="tab-btn" data-tab="system">
                        <i class="fas fa-cog"></i>
                        시스템
                    </button>
                    -->
                </div>

                <!-- 프로필 설정 -->
                <div class="tab-content active" id="profile">
                    <div class="settings-card">
                        <h3 class="card-title">프로필 정보</h3>
                        <div class="profile-section">
                            <!-- 프로필 사진 변경 - 구현되지 않은 서비스 (주석처리)
                            <div class="profile-avatar">
                                <div class="avatar-display">
                                    <i class="fas fa-user-circle"></i>
                                </div>
                                <button class="btn-change-avatar">
                                    <i class="fas fa-camera"></i>
                                    사진 변경
                                </button>
                            </div>
                            -->
                            <div class="profile-form">
                                <div class="form-group">
                                    <label>이름</label>
                                    <input type="text" id="userName" class="form-input" placeholder="이름을 입력하세요">
                                </div>
                                <div class="profile-item">
                                    <label>직급</label>
                                    <div class="info-value" id="userPosition">-</div>
                                </div>
                                <div class="profile-item">
                                    <label>부서</label>
                                    <div class="info-value" id="userDept">-</div>
                                </div>
                                <div class="form-group">
                                    <label>이메일</label>
                                    <input type="email" id="userEmail" class="form-input" placeholder="이메일을 입력하세요">
                                </div>
                                <div class="form-group">
                                    <label>연락처</label>
                                    <input type="tel" id="userPhone" class="form-input" placeholder="연락처를 입력하세요">
                                </div>
                                <div class="form-group">
                                    <label>주소</label>
                                    <input type="text" id="userAddress" class="form-input" placeholder="주소를 입력하세요">
                                </div>
                            </div>
                            <div class="profile-actions">
                                <button class="btn-update-profile" id="updateProfileBtn">
                                    <i class="fas fa-save"></i>
                                    프로필 수정
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 역량관리 섹션 -->
                    <div class="settings-card">
                        <h3 class="card-title">역량관리</h3>

                        <!-- 학력 -->
                        <div class="competency-section">
                            <div class="competency-header">
                                <h4>학력</h4>
                                <button class="btn-add" data-type="education">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            <div class="competency-list" id="educationList">
                                <!-- 학력 항목들이 동적으로 추가됨 -->
                            </div>
                        </div>

                        <!-- 자격증 -->
                        <div class="competency-section">
                            <div class="competency-header">
                                <h4>자격증</h4>
                                <button class="btn-add" data-type="certificate">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            <div class="competency-list" id="certificateList">
                                <!-- 자격증 항목들이 동적으로 추가됨 -->
                            </div>
                        </div>

                        <!-- 업계경력 -->
                        <div class="competency-section">
                            <div class="competency-header">
                                <h4>업계경력</h4>
                                <button class="btn-add" data-type="career">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            <div class="competency-list" id="careerList">
                                <!-- 업계경력 항목들이 동적으로 추가됨 -->
                            </div>
                        </div>

                        <!-- 교육 -->
                        <div class="competency-section">
                            <div class="competency-header">
                                <h4>교육</h4>
                                <button class="btn-add" data-type="training">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            <div class="competency-list" id="trainingList">
                                <!-- 교육 항목들이 동적으로 추가됨 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 계정 설정 -->
                <div class="tab-content" id="account">

                    <!-- 전자서명 설정 - 보류된 서비스 (주석처리)
                    <div class="settings-card">
                        <h3 class="card-title">전자서명 설정</h3>
                        <div class="legal-notice">
                            <i class="fas fa-info-circle"></i>
                            <div class="notice-content">
                                <p><strong>전자서명 법적 고지</strong></p>
                                <ul>
                                    <li>이 시스템은 내부 결재 및 문서 승인 시 서명자의 신원을 확인하기 위해 전자서명 기능을 제공합니다.</li>
                                    <li>입력된 서명 이미지는 사내 결재 이력 검증 및 감사 목적으로 암호화되어 저장되며, 제3자에게 제공되지 않습니다.</li>
                                    <li>본 전자서명은 「전자서명법」 제3조에 따른 법적 효력이 있으며, 개인 식별정보로 취급되어 개인정보보호법에 따라 안전하게 관리됩니다.</li>
                                    <li>서명정보는 퇴직 또는 문서 보관 기간 만료 시점에 안전하게 폐기됩니다.</li>
                                </ul>
                            </div>
                        </div>
                        <div class="signature-section">
                            <div class="signature-grid">
                                <div class="signature-display">
                                    <h4>현재 서명</h4>
                                    <div class="current-signature" id="currentSignature">
                                        <div class="no-signature">
                                            <i class="fas fa-signature"></i>
                                            <p>등록된 서명이 없습니다</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="signature-editor">
                                    <h4>서명 작성</h4>
                                    <div class="signature-canvas-wrapper">
                                        <canvas id="signatureCanvas" width="600" height="250"></canvas>
                                        <div class="canvas-placeholder" id="canvasPlaceholder">
                                            <i class="fas fa-pen"></i>
                                            <p>여기에 서명해주세요</p>
                                        </div>
                                    </div>
                                    <div class="signature-actions">
                                        <button class="btn-secondary" id="clearSignature">
                                            <i class="fas fa-eraser"></i> 지우기
                                        </button>
                                        <button class="btn-primary" id="saveSignature">
                                            <i class="fas fa-save"></i> 서명 저장
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    -->

                    <div class="settings-card">
                        <h3 class="card-title">비밀번호 변경</h3>
                        <div class="password-section">
                            <div class="form-group">
                                <label>현재 비밀번호</label>
                                <input type="password" id="currentPassword" class="form-input" placeholder="현재 비밀번호를 입력하세요">
                            </div>
                            <div class="form-group">
                                <label>새 비밀번호</label>
                                <input type="password" id="newPassword" class="form-input" placeholder="새 비밀번호를 입력하세요">
                                <small>영문, 숫자, 특수문자를 포함하여 8자 이상 입력하세요.</small>
                            </div>
                            <div class="form-group">
                                <label>새 비밀번호 확인</label>
                                <input type="password" id="confirmPassword" class="form-input" placeholder="새 비밀번호를 다시 입력하세요">
                            </div>
                        </div>
                        <div class="password-actions">
                            <button class="btn-change-password" id="changePasswordBtn">
                                <i class="fas fa-key"></i>
                                비밀번호 변경
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 알림 설정 - 구현되지 않은 서비스 (주석처리)
                <div class="tab-content" id="notification">
                    <div class="settings-card">
                        <h3 class="card-title">알림 설정</h3>
                        <div class="notification-section">
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>메일 알림</h4>
                                    <p>새 메일 수신 시 알림을 받습니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>결재 알림</h4>
                                    <p>결재 요청 및 승인/반려 시 알림을 받습니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>메신저 알림</h4>
                                    <p>새 메시지 수신 시 알림을 받습니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>일정 알림</h4>
                                    <p>일정 시작 전 알림을 받습니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>데스크톱 알림</h4>
                                    <p>브라우저 데스크톱 알림을 활성화합니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <h4>알림음</h4>
                                    <p>알림 수신 시 소리를 재생합니다.</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                -->

                <!-- 시스템 설정 - 구현되지 않은 서비스 (주석처리)
                <div class="tab-content" id="system">
                    <div class="settings-card">
                        <h3 class="card-title">화면 설정</h3>
                        <div class="system-section">
                            <div class="form-group">
                                <label>테마</label>
                                <select class="form-select">
                                    <option value="light" selected>라이트 모드</option>
                                    <option value="dark">다크 모드</option>
                                    <option value="auto">시스템 설정 따라가기</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>언어</label>
                                <select class="form-select">
                                    <option value="ko" selected>한국어</option>
                                    <option value="en">English</option>
                                    <option value="ja">日本語</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>페이지당 항목 수</label>
                                <select class="form-select">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="settings-card">
                        <h3 class="card-title">데이터 관리</h3>
                        <div class="data-section">
                            <div class="data-item">
                                <div class="data-info">
                                    <h4>캐시 데이터 삭제</h4>
                                    <p>저장된 캐시 데이터를 삭제합니다.</p>
                                </div>
                                <button class="btn-danger-outline">삭제</button>
                            </div>
                            <div class="data-item">
                                <div class="data-info">
                                    <h4>내 데이터 다운로드</h4>
                                    <p>개인 정보 및 활동 기록을 다운로드합니다.</p>
                                </div>
                                <button class="btn-secondary">다운로드</button>
                            </div>
                        </div>
                    </div>

                    <div class="settings-card">
                        <h3 class="card-title">정보</h3>
                        <div class="info-section">
                            <div class="info-item">
                                <span class="info-label">버전</span>
                                <span class="info-value">v1.0.0</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">최종 업데이트</span>
                                <span class="info-value">2025-01-16</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">고객센터</span>
                                <span class="info-value">support@pinecni.com</span>
                            </div>
                        </div>
                    </div>
                </div>
                -->
            </div>
        </main>
    </div>

    <!-- 전자서명 저장 확인 모달 - 보류된 서비스 (주석처리)
    <div id="signatureConfirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-shield-alt"></i> 전자서명 저장 동의</h2>
                <button class="modal-close" id="closeSignatureModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="consent-notice">
                    <div class="notice-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3>전자서명 법적 고지</h3>
                    <div class="notice-text">
                        <p>전자서명을 저장하기 전에 다음 사항을 확인해주세요:</p>
                        <ul>
                            <li><strong>법적 효력:</strong> 본 전자서명은 「전자서명법」 제3조에 따른 법적 효력이 있으며, 결재 및 승인 시 귀하의 동의로 간주됩니다.</li>
                            <li><strong>개인정보 처리:</strong> 입력된 서명 이미지는 개인 식별정보로 취급되어 개인정보보호법에 따라 암호화되어 저장됩니다.</li>
                            <li><strong>사용 목적:</strong> 서명은 사내 결재 이력 검증 및 감사 목적으로만 사용되며, 제3자에게 제공되지 않습니다.</li>
                            <li><strong>보관 및 폐기:</strong> 서명정보는 퇴직 또는 문서 보관 기간 만료 시점에 안전하게 폐기됩니다.</li>
                            <li><strong>책임:</strong> 전자서명 등록 후 이를 사용한 모든 결재 및 승인은 본인의 의사로 간주되며, 이에 대한 책임은 본인에게 있습니다.</li>
                        </ul>
                        <div class="consent-checkbox">
                            <label>
                                <input type="checkbox" id="consentCheckbox">
                                <span>위 내용을 모두 확인하였으며, 전자서명 저장에 동의합니다.</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelSignatureSave">취소</button>
                <button class="btn-primary" id="confirmSignatureSave" disabled>
                    <i class="fas fa-check"></i> 동의 및 저장
                </button>
            </div>
        </div>
    </div>
    -->

    <script th:src="@{/js/settings.js}" defer></script>
</body>
</html>
