<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('월간업무보고 상세', '/css/approval_monthly_report.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-calendar-alt"></i> 월간업무보고 상세</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="editor-area" style="max-width: 1200px; margin: 0 auto;">
                    <!-- 문서 양식 -->
                    <div class="document-form">
                        <!-- 결재라인 -->
                        <div class="approval-line-box">
                            <table class="approval-line-table">
                                <tr>
                                    <th class="approval-header">담당</th>
                                    <th class="approval-header">부서장</th>
                                    <th class="approval-header">대표이사</th>
                                </tr>
                                <tr>
                                    <td class="approval-sign-cell">
                                        <div class="sign-area">
                                            <span class="sign-placeholder">결재</span>
                                        </div>
                                    </td>
                                    <td class="approval-sign-cell">
                                        <div class="sign-area">
                                            <span class="sign-placeholder">결재</span>
                                        </div>
                                    </td>
                                    <td class="approval-sign-cell">
                                        <div class="sign-area">
                                            <span class="sign-placeholder">결재</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="approval-name-cell">
                                        <span class="approver-name">-</span>
                                    </td>
                                    <td class="approval-name-cell">
                                        <span class="approver-name">-</span>
                                    </td>
                                    <td class="approval-name-cell">
                                        <span class="approver-name">-</span>
                                    </td>
                                </tr>

                            </table>
                        </div>

                        <h2 class="doc-title">월 간 업 무 보 고</h2>

                        <table class="form-table" style="margin-bottom: 100px">
                            <tr>
                                <th>과제명</th>
                                <td colspan="3">
                                    <input type="text" id="projectName" readonly>
                                </td>
                            </tr>
                            <tr>
                                <th>보고자</th>
                                <td><input type="text" id="userName" readonly></td>
                                <th>부서</th>
                                <td><input type="text" id="userDept" readonly></td>
                            </tr>
                            <tr>
                                <th>보고 월</th>
                                <td colspan="3"><input type="text" id="reportMonth" readonly></td>
                            </tr>
                            <tr>
                                <th>월간 주요 업무</th>
                                <td colspan="3"><textarea id="mainTasks" readonly rows="6"></textarea></td>
                            </tr>
                            <tr>
                                <th>목표 대비 실적</th>
                                <td colspan="3"><textarea id="performance" readonly rows="5"></textarea></td>
                            </tr>
                            <tr>
                                <th>개선사항</th>
                                <td colspan="3"><textarea id="improvements" readonly rows="4"></textarea></td>
                            </tr>
                            <tr>
                                <th>차월 계획</th>
                                <td colspan="3"><textarea id="nextMonthPlan" readonly rows="5"></textarea></td>
                            </tr>
                        </table>
                    </div>

                    <!-- 첨부파일 (추후 구현) -->
                    <div class="attachment-section" style="display: none;">
                        <div class="section-header">
                            <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                        </div>
                        <div class="file-list" id="fileList"></div>
                    </div>

                    <!-- 하단 액션 버튼 -->
                    <div class="project-form-footer" id="actionButtons" style="margin-top: 30px;">
                        <button type="button" class="btn btn-secondary" onclick="history.back()" style="margin-left: auto">취소</button>
                        <!-- 삭제 버튼은 작성자인 경우에만 동적으로 생성됨 -->
                        <button type="button" class="btn btn-primary" id="editReportBtn">
                            <i class="fas fa-edit"></i> 수정
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/approval_monthly_report_detail.js}"></script>
</body>
</html>
