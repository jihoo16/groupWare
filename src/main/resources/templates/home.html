<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ERP 시스템 - 홈', null)}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('home')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">파인씨앤아이</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="검색...">
                    </div>
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-area">
                <div class="quick-stats">
                    <div class="stat-card" id="vacationCard" style="cursor: pointer;">
                        <div class="stat-icon" style="background: #e3f2fd;">
                            <i class="fas fa-umbrella-beach" style="color: #1976d2;"></i>
                        </div>
                        <div class="stat-content">
                            <h3>잔여 연차</h3>
                            <p class="stat-number" id="remainingVacation">-<span>일</span></p>
                        </div>
                    </div>

                    <div class="stat-card" id="todayScheduleCard" style="cursor: pointer;">
                        <div class="stat-icon" style="background: #f3e5f5;">
                            <i class="fas fa-calendar-check" style="color: #7b1fa2;"></i>
                        </div>
                        <div class="stat-content">
                            <h3>오늘 일정</h3>
                            <p class="stat-number" id="todayScheduleCount">-<span>건</span></p>
                        </div>
                    </div>

                    <div class="stat-card" id="approvalCard" style="cursor: pointer;">
                        <div class="stat-icon" style="background: #f3e5f5;">
                            <i class="fas fa-file-signature" style="color: #667eea;"></i>
                        </div>
                        <div class="stat-content">
                            <h3>전자 문서</h3>
                            <p class="stat-number" id="pendingApprovalCount">-<span>건</span></p>
                        </div>
                    </div>

                    <div class="stat-card" id="projectDocCard" style="cursor: pointer;">
                        <div class="stat-icon" style="background: #e3f2fd;">
                            <i class="fas fa-folder-open" style="color: #1976d2;"></i>
                        </div>
                        <div class="stat-content">
                            <h3>프로젝트 문서</h3>
                            <p class="stat-number" id="projectDocCount">-<span>건</span></p>
                        </div>
                    </div>
                </div>

                <!-- 바로가기 버튼 -->
                <div class="quick-links">
                    <a href="/approval/receipt-meeting" class="quick-link-btn">
                        <i class="fas fa-file-invoice"></i>
                        <span>연구비증빙 - 회의록</span>
                    </a>
                    <a href="/approval" class="quick-link-btn">
                        <i class="fas fa-umbrella-beach"></i>
                        <span>전자문서 연차신청서</span>
                    </a>
                </div>

                <!-- 콘텐츠 영역 -->
                <div class="content-sections">
                    <!-- 이번 주 일정 -->
                    <div class="section-card">
                        <div class="home-section-header">
                            <h3><i class="fas fa-calendar-week"></i> 이번 주 일정</h3>
                            <a href="/calendar" class="view-all">전체보기 <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="section-body">
                            <div id="weeklyScheduleList" class="schedule-list">
                                <div class="loading-message">
                                    <i class="fas fa-spinner fa-spin"></i> 일정을 불러오는 중...
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 진행 중인 프로젝트 -->
                    <div class="section-card">
                        <div class="home-section-header">
                            <h3><i class="fas fa-project-diagram"></i> 진행 중인 프로젝트</h3>
                            <a href="/project" class="view-all">전체보기 <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="section-body">
                            <div id="myProjectsList" class="projects-list">
                                <div class="loading-message">
                                    <i class="fas fa-spinner fa-spin"></i> 프로젝트를 불러오는 중...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 일정 상세보기 모달 -->
    <div id="scheduleDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="scheduleModalTitle">일정 상세정보</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <div class="detail-label">일정 제목</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailTitle">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">일정 유형</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailType">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">기간</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailPeriod">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">시간</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailTime">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">장소</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailLocation">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">참석자</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailParticipants">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">설명</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailDescription">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">알림</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailNotification">-</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="closeModalBtn">닫기</button>
                <button class="btn-primary" id="goToCalendarBtn">
                    <i class="fas fa-calendar"></i>
                    캘린더에서 보기
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/home.js}"></script>
</body>
</html>
