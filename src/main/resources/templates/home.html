<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('GROUPWARE 시스템 - 홈', null)}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('home')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">
                        <img th:src="@{/images/logo.png}" alt="Logo" class="title-logo">
                        파인씨앤아이
                    </h1>
                </div>
                <div class="header-right">
                    <div class="search-box" id="globalSearchBox">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearchInput" placeholder="메뉴 검색..." autocomplete="off">
                        <div id="searchDropdown" class="search-dropdown"></div>
                    </div>
                    <!-- 알림 버튼 - 구현되지 않은 서비스 (주석처리)
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </button>
                    -->
                </div>
            </header>

            <div class="dashboard-area">
                <!-- 퀵 통계 -->
                <div class="quick-stats">
                    <div class="stat-card" id="vacationCard">
                        <div class="stat-icon icon-blue">
                            <i class="fas fa-umbrella-beach"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">잔여 연차</span>
                            <span class="stat-number" id="remainingVacation">-<em>일</em></span>
                        </div>
                    </div>
                    <div class="stat-card" id="todayScheduleCard">
                        <div class="stat-icon icon-purple">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">오늘 일정</span>
                            <span class="stat-number" id="todayScheduleCount">-<em>건</em></span>
                        </div>
                    </div>
                    <div class="stat-card" id="approvalCard">
                        <div class="stat-icon icon-indigo">
                            <i class="fas fa-file-signature"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">전자 문서</span>
                            <span class="stat-number" id="pendingApprovalCount">-<em>건</em></span>
                        </div>
                    </div>
                    <div class="stat-card" id="projectDocCard">
                        <div class="stat-icon icon-blue">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">프로젝트 문서</span>
                            <span class="stat-number" id="projectDocCount">-<em>건</em></span>
                        </div>
                    </div>
                </div>

                <!-- 바로가기 (2열) -->
                <div class="shortcut-row">
                    <!-- 문서 바로가기 -->
                    <div class="shortcut-section">
                        <h3 class="shortcut-title"><i class="fas fa-pen-to-square"></i> 문서작성 바로가기</h3>
                        <div class="shortcut-grid">
                            <a href="/approval/vacation" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-umbrella-beach"></i></div>
                                <span class="shortcut-label">연차신청서</span>
                            </a>
                            <a href="/approval/expense" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-won-sign"></i></div>
                                <span class="shortcut-label">개인경비청구</span>
                            </a>
                        </div>
                    </div>

                    <!-- 프로젝트 문서 바로가기 -->
                    <div class="shortcut-section">
                        <h3 class="shortcut-title"><i class="fas fa-folder-open"></i> 프로젝트 문서작성 바로가기</h3>
                        <div class="shortcut-grid">
                            <a href="/approval/receipt-meeting" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-file-invoice"></i></div>
                                <span class="shortcut-label">회의록</span>
                            </a>
                            <a href="/approval/receipt-trip" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-plane-departure"></i></div>
                                <span class="shortcut-label">출장</span>
                            </a>
                            <a href="/approval/receipt-trip-meeting" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-route"></i></div>
                                <span class="shortcut-label">출장+회의</span>
                            </a>
                            <a href="/approval/receipt-overtime" class="shortcut-card">
                                <div class="shortcut-icon"><i class="fas fa-utensils"></i></div>
                                <span class="shortcut-label">야근식대</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 관리자 전용 (C1101 관리자 / C1102 개발자) -->
                <div class="shortcut-section admin-section" th:if="${session.userRoleCode == 'C1101' or session.userRoleCode == 'C1102'}">
                    <h3 class="shortcut-title"><i class="fas fa-gear"></i> 관리</h3>
                    <div class="shortcut-grid">
                        <a href="/admin/vacation-documents" class="shortcut-card">
                            <div class="shortcut-icon"><i class="fas fa-file-alt"></i></div>
                            <span class="shortcut-label">연차신청서 관리</span>
                        </a>
                        <a href="/admin/expense-documents" class="shortcut-card">
                            <div class="shortcut-icon"><i class="fas fa-receipt"></i></div>
                            <span class="shortcut-label">개인경비 지출관리</span>
                        </a>
                        <a href="/project/documents" class="shortcut-card">
                            <div class="shortcut-icon"><i class="fas fa-folder-open"></i></div>
                            <span class="shortcut-label">연구비증빙 관리</span>
                        </a>
                        <a href="/admin/competency-management" class="shortcut-card">
                            <div class="shortcut-icon"><i class="fas fa-user-graduate"></i></div>
                            <span class="shortcut-label">역량관리</span>
                        </a>
                    </div>
                </div>

                <!-- 역량열람자 전용 (C1103) — 관리자가 아닌 경우에만 표시 -->
                <div class="shortcut-section admin-section" th:if="${session.userRoleCode == 'C1103'}">
                    <h3 class="shortcut-title"><i class="fas fa-gear"></i> 관리</h3>
                    <div class="shortcut-grid">
                        <a href="/admin/competency-management" class="shortcut-card">
                            <div class="shortcut-icon"><i class="fas fa-user-graduate"></i></div>
                            <span class="shortcut-label">역량관리</span>
                        </a>
                    </div>
                </div>

                <!-- 콘텐츠 영역 -->
                <div class="content-sections">
                    <!-- 이번 주 일정 -->
                    <div class="section-card">
                        <div class="home-section-header">
                            <h3><i class="fas fa-calendar-week"></i> 이번 주 일정</h3>
                            <a href="/calendar" class="view-all">전체보기 <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="section-body">
                            <div id="weeklyScheduleList" class="schedule-list">
                                <div class="loading-message">
                                    <i class="fas fa-spinner fa-spin"></i> 일정을 불러오는 중...
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 진행 중인 프로젝트 -->
                    <div class="section-card">
                        <div class="home-section-header">
                            <h3><i class="fas fa-project-diagram"></i> 진행 중인 프로젝트</h3>
                            <a href="/project" class="view-all">전체보기 <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="section-body">
                            <div id="myProjectsList" class="projects-list">
                                <div class="loading-message">
                                    <i class="fas fa-spinner fa-spin"></i> 프로젝트를 불러오는 중...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 일정 상세보기 모달 -->
    <div id="scheduleDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="scheduleModalTitle">일정 상세정보</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <div class="detail-label">일정 제목</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailTitle">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">일정 유형</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailType">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">기간</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailPeriod">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">시간</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailTime">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">장소</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailLocation">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">참석자</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailParticipants">-</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">설명</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailDescription">-</div>
                    </div>
                </div>

                <!-- 알림 정보 - 구현되지 않은 서비스 (주석처리)
                <div class="detail-row">
                    <div class="detail-label">알림</div>
                    <div class="detail-value-container">
                        <div class="detail-value" id="detailNotification">-</div>
                    </div>
                </div>
                -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="closeModalBtn">닫기</button>
                <button class="btn-primary" id="goToCalendarBtn">
                    <i class="fas fa-calendar"></i>
                    캘린더에서 보기
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/home.js}"></script>
</body>
</html>
