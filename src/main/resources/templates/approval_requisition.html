<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('지출품의서', '/css/approval_requisition.css')}"></head>
<body>
    <div class="container">
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-file-invoice"></i> 문서 작성 > 지출품의서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-outline btn-lg" id="printBtn" style="display:none;">
                        <i class="fas fa-print"></i>
                        인쇄하기
                    </button>
                    <button class="btn-primary btn-lg" id="submitBtn"
                            data-tip="💡 모든 필수값을 채우면 좌측에 인쇄하기 버튼이 나타납니다">
                        <i class="fas fa-paper-plane"></i>
                        저장
                    </button>
                    <button class="btn-danger btn-lg" id="deleteBtn" style="display:none;">
                        <i class="fas fa-trash"></i>
                        삭제
                    </button>
                    <button class="btn-secondary btn-lg" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 사이드바 -->
                    <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('requisition')}"></div>

                    <!-- 우측: 에디터 단일 카드 -->
                    <div class="editor-area">

                        <div class="input-area">

                            <!-- 기본 정보 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-info-circle"></i> 기본 정보</h3>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label><i class="fas fa-building"></i> 부서/팀</label>
                                        <div class="form-text-display" id="applicantDept">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-user"></i> 작성자</label>
                                        <div class="form-text-display" id="applicantName">-</div>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-calendar"></i> 작성일자</label>
                                        <div class="form-text-display" id="documentDate">-</div>
                                    </div>
                                </div>
                            </div>

                            <!-- 품의 내용 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-clipboard-list"></i> 품의 내용</h3>
                                </div>
                                <div class="form-group">
                                    <label><i class="fas fa-align-left"></i> 품의 내용 <span class="required-mark">*</span></label>
                                    <input type="text" class="form-input" id="requisitionContent"
                                           placeholder="예시) 문서작성 툴 연간 결제">
                                </div>
                            </div>

                            <!-- 지출 예정 내역 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-list"></i> 지출 예정 내역 <span class="required-mark">*</span></h3>
                                    <button type="button" class="btn-add-row" id="addRowBtn">
                                        <i class="fas fa-plus"></i> 항목 추가
                                    </button>
                                </div>

                                <div class="expense-items-container" id="requisitionItemsContainer">
                                    <div class="expense-item">
                                        <span class="expense-item-number">1</span>
                                        <div class="expense-item-body">
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 0 0 180px;">
                                                    <label><i class="fas fa-calendar-day"></i> 날짜 <span class="required-mark">*</span></label>
                                                    <input type="text" class="form-input date-input req-date-picker" placeholder="날짜 선택" readonly>
                                                </div>
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-edit"></i> 적요 <span class="required-mark">*</span></label>
                                                    <input type="text" class="form-input description-input" placeholder="지출 예정 내역 입력">
                                                </div>
                                            </div>
                                            <div class="form-row">
                                                <div class="form-group" style="flex: 1;">
                                                    <label><i class="fas fa-store"></i> 상호</label>
                                                    <input type="text" class="form-input shop-input" placeholder="상호명 입력">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 180px;">
                                                    <label><i class="fas fa-won-sign"></i> 금액 <span class="required-mark">*</span></label>
                                                    <input type="text" class="form-input amount-input" placeholder="금액 입력" inputmode="numeric">
                                                </div>
                                                <div class="form-group" style="flex: 0 0 150px;">
                                                    <label><i class="fas fa-sticky-note"></i> 비고</label>
                                                    <input type="text" class="form-input note-input" placeholder="">
                                                </div>
                                            </div>
                                        </div>
                                        <button type="button" class="btn-remove-item" onclick="removeRequisitionItem(this)">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="expense-items-footer">
                                    <button type="button" class="btn-add-row-bottom" id="addRowBtnBottom">
                                        <i class="fas fa-plus"></i> 항목 추가
                                    </button>
                                    <div class="total-amount-display">
                                        <label>계</label>
                                        <span class="total-amount" id="totalAmountDisplay">₩ 0</span>
                                    </div>
                                </div>
                            </div>

                            <!-- 지급 종류 + 특이사항 -->
                            <div class="input-section">
                                <div class="section-header">
                                    <h3><i class="fas fa-credit-card"></i> 지급 종류 및 특이사항</h3>
                                </div>
                                <div class="form-group" style="margin-bottom: 16px;">
                                    <label><i class="fas fa-credit-card"></i> 지급 종류 <span class="required-mark">*</span></label>
                                    <div class="payment-type-group">
                                        <label class="radio-label">
                                            <input type="radio" name="paymentType" id="payTypeCash" value="현금">
                                            <span class="radio-custom"></span>
                                            현금
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="paymentType" id="payTypeBizCard" value="사업비카드">
                                            <span class="radio-custom"></span>
                                            사업비카드
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="paymentType" id="payTypePersonalCard" value="개인카드">
                                            <span class="radio-custom"></span>
                                            개인카드
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label><i class="fas fa-exclamation-circle"></i> 특이사항</label>
                                    <textarea class="form-input form-textarea" id="specialNote" placeholder="특이사항을 입력하세요" rows="3"></textarea>
                                </div>
                            </div>

                        </div><!-- /input-area -->

                        <!-- 공식 문서 미리보기 토글 -->
                        <div class="document-preview-toggle">
                            <button class="toggle-btn" id="documentFormToggle">
                                <i class="fas fa-file-alt"></i>
                                공식 문서 미리보기
                                <i class="fas fa-chevron-down toggle-icon"></i>
                            </button>
                        </div>

                        <!-- 공식 문서 미리보기 -->
                        <div class="document-form-wrapper collapsed">
                            <div class="document-form">

                                <!-- 제목 + 결재란 -->
                                <div class="doc-print-header">
                                    <div class="doc-print-header-left">
                                        <h2 class="req-doc-title">지 출 품 의 서</h2>
                                        <div style="font-size: 12px; color: #555; margin-top: 4px;">
                                            <span id="previewDocDateTop">-</span>
                                        </div>
                                    </div>
                                    <div class="doc-print-header-right">
                                        <table class="doc-approval-table">
                                            <tr>

                                                <td class="doc-approval-head">신청자</td>
                                                <td class="doc-approval-head">부 서 장</td>
                                                <td class="doc-approval-head">대 표</td>
                                            </tr>
                                            <tr>
                                                <td class="doc-approval-sign" data-slot="C1602"><div class="sign-area"><span class="sign-placeholder"></span></div></td>
                                                <td class="doc-approval-sign" data-slot="C1604"><div class="sign-area"><span class="sign-placeholder"></span></div></td>
                                                <td class="doc-approval-sign signature-offline"><div class="sign-area"><span class="sign-placeholder"></span></div></td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>

                                <!-- 품의 내용 -->
                                <table class="expense-info-table" style="margin-bottom: 0;">
                                    <tr>
                                        <th style="width: 90px;">품 의 내 용</th>
                                        <td id="previewContent">-</td>
                                    </tr>
                                </table>

                                <!-- 지출 예정 내역 -->
                                <div class="expense-detail-section" style="margin-top: 15px;">
                                    <table class="expense-detail-table" id="reqPreviewTable">
                                        <thead>
                                            <tr>
                                                <th colspan="5" style="text-align: center; letter-spacing: 4px; background: #efefef; font-size: 12px; padding: 7px;">지 출 예 정 내 역</th>
                                            </tr>
                                            <tr>
                                                <th style="width: 90px;">날 짜</th>
                                                <th>적 요</th>
                                                <th style="width: 100px;">상 호</th>
                                                <th style="width: 120px;">금 액</th>
                                                <th style="width: 80px;">비 고</th>
                                            </tr>
                                        </thead>
                                        <tbody id="reqPreviewBody">
                                            <tr>
                                                <td class="empty-row" colspan="5">내역이 없습니다</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 계 / 지급종류 / 특의사항 / 작성자 — 단일 테이블로 통일 -->
                                <table class="req-bottom-table">
                                    <colgroup>
                                        <col style="width: 90px;">
                                        <col>
                                    </colgroup>
                                    <tr>
                                        <th>계</th>
                                        <td colspan="4" id="previewTotalAmount" style="font-weight: 700;">-</td>
                                    </tr>
                                    <tr>
                                        <th>지급 종류</th>
                                        <td colspan="4" id="previewPaymentType">현금( &nbsp;&nbsp;) / 사업비카드( &nbsp;&nbsp;) / 개인카드( &nbsp;&nbsp;)</td>
                                    </tr>
                                    <tr>
                                        <th style="vertical-align: top; padding-top: 10px;">특의사항</th>
                                        <td colspan="4" id="previewSpecialNote" style="min-height: 60px; white-space: pre-wrap; vertical-align: top; padding-top: 10px;"></td>
                                    </tr>
                                    <tr>
                                        <th>작 성 자</th>
                                        <td colspan="4"></td>
                                    </tr>
                                    <tr>
                                        <th>일 자</th>
                                        <td id="previewDocDate">-</td>
                                        <th style="width: 40px;">성 명</th>
                                        <td id="previewApplicant">-</td>
                                        <td style="width: 36px; text-align: center;">(인)</td>
                                    </tr>
                                </table>

                                <!-- 회사명 -->
                                <div class="req-company-name">주식회사 파인씨엔아이</div>

                            </div><!-- /document-form -->
                        </div><!-- /document-form-wrapper -->

                    </div><!-- /editor-area -->
                </div>
            </div>
        </main>
    </div>

    <!-- 날짜 선택 모달 -->
    <div class="date-modal" id="dateModal">
        <div class="date-modal-content">
            <div class="date-modal-header">
                <h3><i class="fas fa-calendar-alt"></i> 날짜 선택</h3>
                <button class="date-modal-close" onclick="closeDateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="date-modal-body">
                <div class="date-calendar-header">
                    <button class="date-calendar-nav" id="datePrevMonth"><i class="fas fa-chevron-left"></i></button>
                    <h4 class="date-calendar-title" id="dateCalendarTitle">2025년 1월</h4>
                    <button class="date-calendar-nav" id="dateNextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="date-calendar-weekdays">
                    <div class="date-weekday sun">일</div>
                    <div class="date-weekday">월</div>
                    <div class="date-weekday">화</div>
                    <div class="date-weekday">수</div>
                    <div class="date-weekday">목</div>
                    <div class="date-weekday">금</div>
                    <div class="date-weekday sat">토</div>
                </div>
                <div class="date-calendar-days" id="dateCalendarDays">
                    <!-- JavaScript로 생성 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 전자서명 QR 모달 프래그먼트 -->
    <div th:replace="~{fragments/signature-modal :: signature-modal}"></div>

    <script th:src="@{/js/approval_requisition.js}"></script>
</body>
</html>
