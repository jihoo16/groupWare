<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>휴가계</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===========================================================
           휴가계 PDF — 화면 form (approval_vacation.html) 과 시각적 동일
           기본 클래스/구조: approval_vacation.css 의 form 영역 복제
           PDF 전용 보정: font 크기/패딩 축소 (saveVacationRequest inject CSS와 동일)
           =========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'NanumGothic', 'Nanum Gothic', 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            background: white;
            margin: 1.5cm;
        }

        .document-form-wrapper {
            background: white;
            padding: 0;
        }

        .document-form {
            background: white;
            padding: 0;
        }

        /* 문서 제목 */
        .doc-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin: 0 0 15px 0;
            padding-bottom: 15px;
            border-bottom: 3px double #333;
        }

        /* 결재라인 */
        .approval-line-box {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .approval-line-table {
            border-collapse: collapse;
            border: 2px solid #333;
        }

        .approval-line-table th,
        .approval-line-table td {
            border: 1px solid #333;
            text-align: center;
            padding: 0;
            vertical-align: middle;
        }

        /* 결재라인 — PDF 표준 (saveVacationRequest inject CSS 와 동일: 80×80, 9px) */
        .approval-header {
            font-size: 9px;
            font-weight: 700;
            color: #333;
            background: #f0f0f0;
            padding: 5px 10px;
            width: 80px;
        }

        .doc-approval-sign {
            height: 80px;
            width: 80px;
            padding: 3px;
            position: relative;
            background: white;
        }

        .sign-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sign-placeholder {
            font-size: 11px;
            color: #999;
        }

        .approval-name-cell {
            font-size: 9px;
            padding: 6px 5px;
            background: white;
            color: #333;
        }

        /* 양식 테이블 — 화면 form-table 과 동일 구조 */
        .form-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #333;
            margin-bottom: 20px;
            table-layout: fixed;
        }

        .form-table th,
        .form-table td {
            border: 1px solid #333;
            padding: 8px 12px;
            font-size: 10px;
            vertical-align: middle;
            color: #333;
        }

        .form-table th {
            background: #f5f5f5;
            font-weight: 700;
            text-align: center;
            width: 120px;
        }

        .form-table td {
            color: #555;
        }

        /* readonly 텍스트 — 화면과 동일 */
        .readonly-text {
            display: block;
            padding: 4px 12px;
            font-size: 10px;
            color: #555;
            text-align: center;
            line-height: 1.4;
            white-space: pre-line;
            word-wrap: break-word;
            word-break: break-word;
            min-height: 16px;
        }

        /* 사유 셀 특별 스타일 (긴 내용 대응) */
        .form-table .reason-cell {
            display: block;
            min-height: 60px;
            padding: 12px 16px;
            text-align: left;
        }

        /* 내용 입력란 (readonly 표시) */
        .content-text {
            display: block;
            text-align: center;
            font-weight: 600;
            font-size: 10px;
            color: #333;
            padding: 4px 0;
        }

        /* 휴가기간 표시 영역 — 화면 #vacation_period_display 와 동일 */
        .vacation-period-display {
            font-weight: 500;
            min-height: 80px;
            line-height: 1.6;
            padding: 8px 0;
            color: #333;
            font-size: 10px;
            text-align: center;
            white-space: pre-line;
        }

        .vacation-period-display .total-line {
            margin-top: 12px;
            font-weight: 600;
        }

        /* 문서 하단 */
        .document-footer {
            margin-top: 30px;
            padding: 20px 0;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }

        .footer-date {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
        }

        .footer-signature {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            color: #333;
        }

        .signature-label {
            font-weight: 600;
        }

        .signature-name {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3em;
            min-width: 100px;
            text-align: center;
        }

        .signature-seal {
            font-weight: 500;
            color: #666;
        }

        @page {
            margin: 0;
            size: A4;
        }
    </style>
</head>
<body>
    <div class="document-form-wrapper">
        <div class="document-form">
            <!-- 결재라인 -->
            <div class="approval-line-box">
                <table class="approval-line-table">
                    <tr>
                        <th class="approval-header">신청자</th>
                        <th class="approval-header">부 서 장</th>
                        <th class="approval-header">대 표</th>
                    </tr>
                    <tr>
                        <td class="doc-approval-sign">
                            <div class="sign-area">
                                <span class="sign-placeholder"></span>
                            </div>
                        </td>
                        <td class="doc-approval-sign">
                            <div class="sign-area">
                                <span class="sign-placeholder"></span>
                            </div>
                        </td>
                        <td class="doc-approval-sign">
                            <div class="sign-area">
                                <span class="sign-placeholder"></span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="approval-name-cell">
                            <span class="approver-name" th:text="${applicant}">-</span>
                        </td>
                        <td class="approval-name-cell">
                            <span class="approver-name" th:text="${deptManagerName}">-</span>
                        </td>
                        <td class="approval-name-cell">
                            <span class="approver-name" th:text="${ceoName}">-</span>
                        </td>
                    </tr>
                </table>
            </div>

            <h2 class="doc-title">휴 가 계</h2>

            <table class="form-table">
                <colgroup>
                    <col style="width: 120px;">
                    <col>
                    <col style="width: 120px;">
                    <col>
                </colgroup>
                <tr>
                    <th>주 소</th>
                    <td colspan="3"><span class="readonly-text" th:text="${address}"></span></td>
                </tr>
                <tr>
                    <th>생년월일</th>
                    <td><span class="readonly-text" th:text="${birthDate}"></span></td>
                    <th>연 락 처</th>
                    <td><span class="readonly-text" th:text="${contact}"></span></td>
                </tr>
                <tr>
                    <th>소 속</th>
                    <td><span class="readonly-text" th:text="${department}"></span></td>
                    <th>직 급</th>
                    <td><span class="readonly-text" th:text="${position}"></span></td>
                </tr>
                <tr>
                    <th>성 명</th>
                    <td colspan="3"><span class="readonly-text" th:text="${applicant}"></span></td>
                </tr>
                <tr>
                    <th>내 용</th>
                    <td colspan="3"><span class="content-text">휴가 신청</span></td>
                </tr>
                <tr>
                    <th>사 유</th>
                    <td colspan="3"><span class="readonly-text reason-cell" th:text="${reason}"></span></td>
                </tr>
                <tr>
                    <th>휴가기간</th>
                    <td colspan="3">
                        <div class="vacation-period-display">
                            <div th:each="period : ${periods}" th:text="${period['displayText']}">-</div>
                            <div class="total-line" th:if="${totalDaysText != null and !#strings.isEmpty(totalDaysText)}" th:text="${totalDaysText}"></div>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="document-footer">
                <p class="footer-text">위 사유로 상기기간 동안 휴가사용을 신청하오니 허가하여 주시기 바랍니다.</p>
                <div class="footer-date" th:text="${applyDate}">2026년 01월 13일</div>
                <div class="footer-signature">
                    <span class="signature-label">신청인</span>
                    <span class="signature-name" th:text="${applicantSpaced}">홍 길 동</span>
                    <span class="signature-seal">(서명 또는 인)</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
