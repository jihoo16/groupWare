<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ERP 시스템 - 연차관리', '/css/vacation.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('vacation')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">연차관리</h1>
                </div>
                <div class="header-right">
                    <button class="btn-primary" onclick="location.href='/approval/vacation'">
                        <i class="fas fa-plus"></i>
                        연차 신청
                    </button>
                </div>
            </header>

            <div class="leave-content">
                <!-- 연차 현황 카드 -->
                <div class="leave-summary">
                    <div class="summary-card total clickable" id="totalLeaveCard">
                        <div class="card-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="card-content">
                            <h3>총 연차</h3>
                            <p class="number">-<span>일</span></p>
                            <p class="sub-info"></p>
                        </div>
                    </div>

                    <div class="summary-card used clickable" id="usedLeaveCard">
                        <div class="card-icon">
                            <i class="fas fa-calendar-times"></i>
                        </div>
                        <div class="card-content">
                            <h3>사용 연차</h3>
                            <p class="number">-<span>일</span></p>
                            <p class="sub-info"></p>
                        </div>
                    </div>

                    <div class="summary-card remaining clickable" id="remainingLeaveCard">
                        <div class="card-icon">
                            <i class="fas fa-umbrella-beach"></i>
                        </div>
                        <div class="card-content">
                            <h3>잔여 연차</h3>
                            <p class="number">-<span>일</span></p>
                        </div>
                    </div>
                </div>

                <!-- 연차 사용 내역 -->
                <div class="leave-history">
                    <div class="section-header">
                        <h2>연차 사용 내역</h2>
                    </div>

                    <div class="history-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>신청일</th>
                                    <th>구분</th>
                                    <th>시작일</th>
                                    <th>종료일</th>
                                    <th>일수</th>
                                    <th>사유</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JavaScript로 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 연간 연차 달력 -->
                <div class="annual-calendar-section">
                    <div class="section-header">
                        <h2>연차 캘린더</h2>
                        <div class="calendar-controls">
                            <button class="year-nav-btn" id="prevYearBtn">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="current-year" id="currentCalendarYear">2025</span>
                            <button class="year-nav-btn" id="nextYearBtn">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        <div class="calendar-legend">
                            <div class="legend-item">
                                <span class="legend-color approved"></span>
                                <span>사용 내역</span>
                            </div>
                        </div>
                    </div>
                    <div class="annual-calendar-grid" id="annualCalendar"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 사용 연차 상세 모달 -->
    <div class="modal" id="usedLeaveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>사용 연차 상세</h2>
                <button class="modal-close" id="closeUsedModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="used-summary">
                    <div class="summary-row">
                        <span class="label">총 사용 연차:</span>
                        <span class="value" id="usedLeaveSummary">-</span>
                    </div>
                </div>
                <div class="used-table">
                    <table>
                        <thead>
                            <tr>
                                <th>사용 날짜</th>
                                <th>구분</th>
                                <th>사유</th>
                            </tr>
                        </thead>
                        <tbody id="usedLeaveTableBody">
                            <!-- JavaScript로 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 총 연차 계산 상세 모달 -->
    <div class="modal" id="totalLeaveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>총 연차 계산 상세</h2>
                <button class="modal-close" id="closeTotalModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="calculation-detail" id="calculationDetailContent">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 잔여 연차 상세 모달 -->
    <div class="modal" id="remainingLeaveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>잔여 연차 상세</h2>
                <button class="modal-close" id="closeRemainingModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="remaining-summary">
                    <div class="summary-row">
                        <span class="label">현재 잔여 연차:</span>
                        <span class="value" id="remainingLeaveSummary">-</span>
                    </div>
                </div>
                <div class="remaining-table">
                    <table>
                        <thead>
                            <tr>
                                <th>사용 날짜</th>
                                <th>구분</th>
                                <th>사용 전 잔여</th>
                                <th>사용 일수</th>
                                <th>사용 후 잔여</th>
                            </tr>
                        </thead>
                        <tbody id="remainingLeaveTableBody">
                            <!-- JavaScript로 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/vacation.js}"></script>
</body>
</html>
