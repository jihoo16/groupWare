<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${purchaseType == 'equipment'} ? '연구비 증빙 - 장비비' : '연구비 증빙 - 재료비', '/css/approval_receipt_purchase.css')}"></head>
<body>
<!-- 로딩 오버레이 -->
<div th:replace="~{fragments/loading-overlay :: overlay}"></div>

<!-- 수정 모드 진입 시 즉시 로딩 오버레이 표시 & 콘텐츠 숨김 -->
<script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('documentIdx')) {
            var overlay = document.getElementById('pageLoadingOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
            }
            document.documentElement.classList.add('edit-mode-loading');
        }
    })();
</script>
<style>
    html.edit-mode-loading .container {
        visibility: hidden;
    }
    html.edit-mode-loading .container.data-loaded {
        visibility: visible;
    }
</style>

<!-- 서버에서 전달받은 purchaseType을 JS에서 사용 -->
<script th:inline="javascript">
    const PURCHASE_TYPE = /*[[${purchaseType}]]*/ 'material';
    const PURCHASE_TYPE_LABEL = /*[[${purchaseType == 'equipment'} ? '장비비' : '재료비']]*/ '재료비';
</script>

<div class="container">
    <!-- 좌측 네비게이션 바 -->
    <div th:replace="~{fragments/sidebar :: sidebar(${purchaseType == 'equipment'} ? 'receipt-purchase-equipment' : 'receipt-purchase-material')}"></div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">
                    <i class="fas fa-receipt"></i>
                    <a href="/project/documents">프로젝트 문서함</a>
                    &gt;
                    <span th:text="${purchaseType == 'equipment'} ? '연구비 증빙 - 장비비' : '연구비 증빙 - 재료비'">연구비 증빙 - 재료비</span>
                </h1>
            </div>
            <div class="header-right">
                <button class="btn-outline" id="printDocumentBtn" style="display: none;">
                    <i class="fas fa-print"></i>
                    인쇄
                </button>
                <button class="btn-danger" id="deleteBtn" style="display: none;">
                    <i class="fas fa-trash"></i>
                    삭제하기
                </button>
                <button class="btn-primary btn-with-tooltip" id="submitBtn">
                    <i class="fas fa-save"></i>
                    저장
                    <span class="tooltip-text">💡 모든 필수값을 채우면 좌측에 인쇄 버튼이 나타납니다</span>
                </button>
                <button class="btn-secondary" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                    돌아가기
                </button>
            </div>
        </header>

        <div class="write-container">
            <div class="write-layout">
                <!-- 좌측: 템플릿 선택 (프로젝트 문서 전용) -->
                <div th:replace="~{fragments/project-document-sidebar :: project-document-sidebar(${purchaseType == 'equipment'} ? 'receipt-purchase-equipment' : 'receipt-purchase-material')}"></div>

                <!-- 우측: 문서 편집 영역 -->
                <div class="editor-area">
                    <div id="documentForm">

                        <!-- 기본 정보 섹션 -->
                        <div class="common-info-section">
                            <div class="section-header">
                                <h3><i class="fas fa-edit"></i> 기본 정보</h3>
                            </div>

                            <!-- 과제명 -->
                            <div class="form-group full-width">
                                <label for="pu_project">
                                    <i class="fas fa-project-diagram"></i> 과제명
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" id="pu_project" class="form-input clickable-input" placeholder="클릭하여 과제 선택" readonly>
                                <input type="hidden" id="selectedProjectIdx">
                            </div>

                            <!-- 사용 카드 -->
                            <div class="form-group full-width">
                                <label for="pu_card">
                                    <i class="fas fa-credit-card"></i> 사용 카드
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" id="pu_card" class="form-input clickable-input" placeholder="과제를 먼저 선택하세요" readonly onclick="openCardModal()">
                                <input type="hidden" id="selectedCardIdx">
                            </div>

                            <!-- 신청자 -->
                            <div class="form-group full-width">
                                <label for="pu_applicant">
                                    <i class="fas fa-user-edit"></i> 신청자
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" id="pu_applicant" class="form-input clickable-input" placeholder="과제를 먼저 선택하세요" readonly onclick="openApplicantModal()">
                                <input type="hidden" id="selectedApplicantIdx">
                            </div>

                            <!-- 품의일자 & 품의명 -->
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="pu_approval_date">
                                        <i class="fas fa-calendar-day"></i> 품의일자
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="date" id="pu_approval_date" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label for="pu_title">
                                        <i class="fas fa-heading"></i> 품의명
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="text" id="pu_title" class="form-input"
                                           th:placeholder="${purchaseType == 'equipment'} ? '예: 장비비' : '예: 재료비'"
                                           th:value="${purchaseType == 'equipment'} ? '장비비' : '재료비'">
                                </div>
                            </div>

                            <!-- 지급종류 -->
                            <div class="form-group full-width">
                                <label>
                                    <i class="fas fa-money-check-alt"></i> 지급종류
                                    <span class="required-mark">*</span>
                                </label>
                                <div class="payment-type-group">
                                    <label class="radio-label">
                                        <input type="radio" name="paymentType" value="card" checked>
                                        <span class="radio-custom"></span>
                                        연구비카드
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="paymentType" value="transfer">
                                        <span class="radio-custom"></span>
                                        연구비이체
                                    </label>
                                </div>
                            </div>

                            <!-- 품의 내용 -->
                            <div class="form-group full-width">
                                <label for="pu_content">
                                    <i class="fas fa-file-alt"></i> 품의 내용
                                    <span class="required-mark">*</span>
                                </label>
                                <textarea id="pu_content" class="form-textarea" rows="5"
                                          th:placeholder="${purchaseType == 'equipment'} ? '장비비 구입 품의 내용을 입력하세요' : '재료비 구입 품의 내용을 입력하세요'"></textarea>
                            </div>
                        </div>

                        <!-- 품의 내역서 섹션 -->
                        <div class="common-info-section" style="margin-top: 0;">
                            <div class="section-header">
                                <h3><i class="fas fa-list-alt"></i> 품의 내역서</h3>
                                <button type="button" class="btn-add-item" onclick="addItemRow()">
                                    <i class="fas fa-plus"></i> 항 추가
                                </button>
                            </div>

                            <div class="item-table-wrapper">
                                <table class="item-table" id="itemTable">
                                    <thead>
                                        <tr>
                                            <th style="width: 110px;">날짜</th>
                                            <th>적요</th>
                                            <th style="width: 70px;">수량</th>
                                            <th style="width: 120px;">총공급가액</th>
                                            <th style="width: 100px;">총세액</th>
                                            <th style="width: 120px;">비고</th>
                                            <th style="width: 44px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemTableBody">
                                        <!-- 동적 행 추가 -->
                                    </tbody>
                                    <tfoot>
                                        <tr class="item-total-row">
                                            <td colspan="3" style="text-align: center; font-weight: bold;">계</td>
                                            <td id="totalSupplyAmount" style="text-align: right; font-weight: bold;">0</td>
                                            <td id="totalTaxAmount" style="text-align: right; font-weight: bold;">0</td>
                                            <td colspan="2"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>

                            <!-- 총 공급대가 -->
                            <div class="form-grid" style="margin-top: 16px;">
                                <div class="form-group">
                                    <label for="pu_amount">
                                        <i class="fas fa-won-sign"></i> 총 공급대가 (원)
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="text" id="pu_amount" class="form-input" placeholder="품의 내역서 입력 시 자동 계산" readonly>
                                </div>
                            </div>
                        </div>

                        <!-- 파일 업로드 섹션 -->
                        <div class="attachment-section">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                <div>
                                    <div class="section-header">
                                        <h4><i class="fas fa-receipt"></i> 영수증 업로드</h4>
                                    </div>
                                    <div class="file-upload-area" id="receiptUploadArea">
                                        <input type="file" id="receiptInput" multiple hidden>
                                        <label for="receiptInput" class="file-upload-label">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                            <span>파일을 선택하거나 드래그하세요</span>
                                            <small>최대 10MB, 최대 5개</small>
                                        </label>
                                    </div>
                                    <div class="file-list" id="receiptFileList"></div>
                                </div>
                                <div>
                                    <div class="section-header">
                                        <h4><i class="fas fa-file-alt"></i> 공식문서 업로드</h4>
                                    </div>
                                    <div class="file-upload-area" id="documentUploadArea">
                                        <input type="file" id="documentInput" multiple hidden>
                                        <label for="documentInput" class="file-upload-label">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                            <span>파일을 선택하거나 드래그하세요</span>
                                            <small>최대 10MB, 최대 5개</small>
                                        </label>
                                    </div>
                                    <div class="file-list" id="documentFileList"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 공식 문서 미리보기 토글 -->
                        <div class="document-preview-toggle">
                            <button class="toggle-btn" id="documentFormToggle">
                                <i class="fas fa-file-alt"></i>
                                공식 문서 미리보기
                                <i class="fas fa-chevron-down toggle-icon"></i>
                            </button>
                        </div>

                        <!-- 공식 문서 양식 -->
                        <div class="document-form-wrapper collapsed">
                            <div class="document-form">

                                <!-- 품의서 -->
                                <div style="background: white; border: 2px solid #e0e0e0; border-radius: 8px; padding: 30px; margin: 0 auto 30px; max-width: 881px;">

                                    <!-- 결재란 -->
                                    <div style="text-align: right; margin-bottom: 20px;">
                                        <table style="border: 2px solid #000; border-collapse: collapse; display: inline-table;">
                                            <tr>
                                                <td style="width: 110px; height: 20px; border: 1px solid #000; padding: 2px 16px; text-align: center; background: #f0f0f0; font-weight: bold; line-height: 1;">신청자</td>
                                                <td style="width: 110px; height: 20px; border: 1px solid #000; padding: 2px 16px; text-align: center; background: #f0f0f0; font-weight: bold; line-height: 1;">연구책임자</td>
                                                <td style="width: 110px; height: 20px; border: 1px solid #000; padding: 2px 16px; text-align: center; background: #f0f0f0; font-weight: bold; line-height: 1;">대표자</td>
                                            </tr>
                                            <tr>
                                                <td class="pu-signature-applicant" style="height: 80px; border: 1px solid #000; padding: 10px 16px; text-align: center; min-width: 80px;"></td>
                                                <td class="pu-signature-manager" style="height: 80px; border: 1px solid #000; padding: 10px 16px; text-align: center; min-width: 80px;"></td>
                                                <td style="height: 80px; border: 1px solid #000; padding: 10px 16px; text-align: center; min-width: 80px;"></td>
                                            </tr>
                                        </table>
                                    </div>

                                    <h2 class="doc-title" style="font-size: 30px; font-weight: bold; letter-spacing: 8px;">품 의 서</h2>

                                    <table class="form-table" style="margin-top: 20px;">
                                        <tr>
                                            <th style="width: 13%;">과 제 명</th>
                                            <td style="padding: 10px;"><span class="pu-auto-project"></span></td>
                                            <th style="width: 15%;">연구책임자명</th>
                                            <td style="padding: 10px; text-align: center;"><span class="pu-auto-manager"></span></td>
                                        </tr>
                                        <tr>
                                            <th>품의일자</th>
                                            <td colspan="3" style="text-align: center;"><span class="pu-auto-approval-date"></span></td>
                                        </tr>
                                        <tr>
                                            <th>신 청 자</th>
                                            <td colspan="3" style="text-align: center;"><span class="pu-auto-applicant"></span> 연구원</td>
                                        </tr>
                                        <tr>
                                            <th>품 의 명</th>
                                            <td colspan="3" style="text-align: center;"><span class="pu-auto-title"></span></td>
                                        </tr>
                                        <tr>
                                            <th>지급종류</th>
                                            <td colspan="3" style="text-align: center;">
                                                연구비카드(<span class="pu-auto-payment-card"></span>) / 연구비이체(<span class="pu-auto-payment-transfer"></span>)
                                            </td>
                                        </tr>
                                        <tr>
                                            <th style="height: 180px; vertical-align: top; padding-top: 12px;">품의 내용</th>
                                            <td colspan="3" style="text-align: left; padding: 12px; white-space: pre-wrap; height: 180px; vertical-align: top;"><span class="pu-auto-content"></span></td>
                                        </tr>
                                        <tr>
                                            <th colspan="4" style="background: #f0f0f0; padding: 12px; text-align: center;">품의 내역서</th>
                                        </tr>
                                        <tr>
                                            <th style="text-align: center;">날짜</th>
                                            <th style="text-align: center;">적요</th>
                                            <th style="text-align: center; width: 60px;">수량</th>
                                            <th style="text-align: center; width: 110px;">총공급가액</th>
                                        </tr>
                                        <!-- 동적으로 채워지는 내역서 행 -->
                                        <tbody id="docItemTableBody">
                                            <tr>
                                                <td style="height: 40px;"></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <td style="height: 40px;"></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <td style="height: 40px;"></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <td style="height: 40px;"></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                            </tr>
                                        </tbody>
                                        <tr>
                                            <td colspan="3" style="text-align: center; font-weight: bold; background: #f9f9f9;">계</td>
                                            <td style="text-align: right; font-weight: bold; padding-right: 8px;"><span class="pu-auto-total-amount"></span></td>
                                        </tr>
                                    </table>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 프로젝트 선택 모달 -->
<div class="modal" id="projectModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>과제 선택</h3>
            <button class="modal-close" onclick="closeProjectModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-search">
                <i class="fas fa-search"></i>
                <input type="text" id="projectSearch" placeholder="과제명으로 검색">
            </div>
            <div class="employee-list" id="projectList"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeProjectModal()">취소</button>
        </div>
    </div>
</div>

<!-- 카드 선택 모달 -->
<div class="modal" id="cardModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-credit-card"></i> 사용 카드 선택</h3>
            <button class="modal-close" onclick="closeCardModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="cardSearch" placeholder="카드명 또는 카드번호로 검색">
            </div>
            <div class="modal-item-list" id="cardList"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeCardModal()">취소</button>
        </div>
    </div>
</div>

<!-- 신청자 선택 모달 -->
<div class="modal" id="applicantModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-user-edit"></i> 신청자 선택</h3>
            <button class="modal-close" onclick="closeApplicantModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="applicantSearch" placeholder="이름으로 검색">
            </div>
            <div class="modal-item-list" id="applicantList"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeApplicantModal()">취소</button>
        </div>
    </div>
</div>

<script th:src="@{/js/approval_receipt_purchase.js}"></script>
</body>
</html>
