<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ERP 시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <!-- Left Panel - Branding -->
    <div class="login-left">
        <div class="brand-section">
            <div class="logo-circle">
                <i class="fas fa-building"></i>
            </div>
            <h1 class="brand-title">ERP System</h1>
            <p class="brand-subtitle">통합 업무 관리 시스템</p>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>전자문서 작성 및 관리</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>프로젝트 및 일정관리</span>
            </div>
        </div>

        <div class="decorative-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <!-- Right Panel - Login Form -->
    <div class="login-right">
        <div class="login-form-container">
            <div class="login-header">
                <h2>로그인</h2>
                <p>ERP 시스템에 오신 것을 환영합니다</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        사용자 ID
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="사용자 ID를 입력하세요"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        비밀번호
                    </label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        <span class="label-text">로그인 상태 유지</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <span>로그인</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="alert-message" id="alertMessage"></div>
            </form>
        </div>

        <div class="copyright">
            <p>&copy; 2025 (주)파인씨엔아이. All rights reserved.</p>
        </div>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
