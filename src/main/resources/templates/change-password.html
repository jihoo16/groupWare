<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - ERP System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/change-password.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="change-password-container">
        <div class="change-password-card">
            <!-- 헤더 -->
            <div class="header-section">
                <div class="logo-circle">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="page-title">비밀번호 변경</h1>
                <p class="page-subtitle">안전한 계정 사용을 위해 비밀번호를 변경해주세요</p>
            </div>

            <!-- 비밀번호 변경 폼 -->
            <form id="changePasswordForm" class="change-password-form">
                <!-- 현재 비밀번호 (최초 로그인이 아닐 때만 표시) -->
                <div class="form-group" id="currentPasswordGroup" style="display: none;">
                    <label for="currentPassword">
                        <i class="fas fa-lock"></i> 현재 비밀번호
                        <span class="required-mark">*</span>
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="currentPassword" class="form-input"
                               placeholder="현재 비밀번호를 입력하세요">
                        <button type="button" class="toggle-password" id="toggleCurrentPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 새 비밀번호 -->
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-key"></i> 새 비밀번호
                        <span class="required-mark">*</span>
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" class="form-input"
                               placeholder="새 비밀번호를 입력하세요" required>
                        <button type="button" class="toggle-password" id="toggleNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-requirements">
                        <p class="requirement-title"><i class="fas fa-info-circle"></i> 비밀번호 요구사항</p>
                        <ul class="requirement-list">
                            <li id="req-length" class="requirement-item">
                                <i class="fas fa-circle"></i> 8~20자 이내
                            </li>
                            <li id="req-letter" class="requirement-item">
                                <i class="fas fa-circle"></i> 영문 포함
                            </li>
                            <li id="req-number" class="requirement-item">
                                <i class="fas fa-circle"></i> 숫자 포함
                            </li>
                            <li id="req-special" class="requirement-item">
                                <i class="fas fa-circle"></i> 특수문자 포함 (@$!%*?&#)
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 비밀번호 확인 -->
                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-check-circle"></i> 비밀번호 확인
                        <span class="required-mark">*</span>
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" class="form-input"
                               placeholder="새 비밀번호를 다시 입력하세요" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-match-message" id="passwordMatchMessage"></div>
                </div>

                <!-- 알림 메시지 -->
                <div class="alert-message" id="alertMessage"></div>

                <!-- 버튼 그룹 -->
                <div class="button-group">
                    <button type="submit" class="btn-primary" id="changePasswordBtn">
                        <i class="fas fa-save"></i> 비밀번호 변경
                    </button>
                    <button type="button" class="btn-secondary" id="cancelBtn">
                        <i class="fas fa-sign-out-alt"></i> 로그아웃
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/change-password.js}"></script>
</body>
</html>
