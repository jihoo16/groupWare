<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('출장보고서', '/css/approval_trip_report.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-clipboard-list"></i> 문서 작성 > 출장보고서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('trip-report')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 출장신청 불러오기 -->
                        <div class="trip-request-section">
                            <button type="button" class="btn-load-trip-request" id="btnLoadTripRequest">
                                <i class="fas fa-download"></i> 출장신청 불러오기
                            </button>
                            <div class="selected-trip-info" id="selectedTripInfo" style="display: none;">
                                <span class="trip-info-label">선택된 출장신청:</span>
                                <span class="trip-info-text" id="selectedTripText"></span>
                                <button type="button" class="btn-clear-trip" id="btnClearTrip">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <h2 class="doc-title">출 장 보 고 서</h2>

                            <table class="form-table">
                                <tr>
                                    <th>보고자</th>
                                    <td><input type="text" id="applicantName" readonly></td>
                                    <th>부서</th>
                                    <td><input type="text" id="applicantDept" readonly></td>
                                </tr>
                                <tr>
                                    <th>출장지</th>
                                    <td colspan="3"><input type="text" placeholder="출장 목적지"></td>
                                </tr>
                                <tr>
                                    <th>출장 기간</th>
                                    <td><input type="date" placeholder="시작일"></td>
                                    <th>~</th>
                                    <td><input type="date" placeholder="종료일"></td>
                                </tr>
                                <tr>
                                    <th>출장 목적</th>
                                    <td colspan="3"><textarea placeholder="출장 목적" rows="3"></textarea></td>
                                </tr>
                                <tr>
                                    <th>주요 활동 내역</th>
                                    <td colspan="3"><textarea placeholder="출장 중 수행한 주요 활동" rows="8"></textarea></td>
                                </tr>
                                <tr>
                                    <th>성과 및 결과</th>
                                    <td colspan="3"><textarea placeholder="출장을 통해 얻은 성과 및 결과" rows="5"></textarea></td>
                                </tr>
                                <tr>
                                    <th>비고</th>
                                    <td colspan="3"><textarea placeholder="비고" rows="4"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 출장신청 목록 모달 -->
    <div class="modal" id="tripRequestModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-plane"></i> 출장신청 목록</h3>
                <button class="close-modal" id="closeTripRequestModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="search-box">
                    <input type="text" id="tripRequestSearch" placeholder="출장지 또는 목적으로 검색...">
                    <i class="fas fa-search"></i>
                </div>
                <div class="trip-request-list">
                    <table class="trip-request-table">
                        <thead>
                            <tr>
                                <th width="80">신청일</th>
                                <th>출장지</th>
                                <th width="100">출장 기간</th>
                                <th>목적</th>
                                <th width="80">선택</th>
                            </tr>
                        </thead>
                        <tbody id="tripRequestTableBody">
                            <!-- 출장신청 목록이 여기에 동적으로 추가됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelTripRequestBtn">닫기</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/approval_trip_report.js}"></script>
</body>
</html>
