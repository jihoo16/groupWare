<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('프로젝트 문서함', '/css/approval.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('project-documents')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-folder-open"></i> 프로젝트 문서함</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="문서 검색...">
                    </div>
                    <div class="dropdown-container">
                        <button class="btn-primary" id="newDocumentBtn">
                            <i class="fas fa-pen"></i>
                            새 문서 작성
                        </button>
                        <div class="dropdown-menu" id="documentTypeMenu">
                            <a href="/approval/receipt-meeting" class="dropdown-item">
                                <i class="fas fa-utensils"></i>
                                회의비 증빙
                            </a>
                            <a href="/approval/receipt-trip" class="dropdown-item">
                                <i class="fas fa-plane"></i>
                                단독 출장 증빙
                            </a>
                            <a href="/approval/receipt-trip-meeting" class="dropdown-item">
                                <i class="fas fa-suitcase"></i>
                                회의+출장 증빙
                            </a>
                            <a href="/approval/receipt-overtime" class="dropdown-item">
                                <i class="fas fa-moon"></i>
                                야근식대 증빙
                            </a>
                            <a href="/approval/project-weekly-report" class="dropdown-item">
                                <i class="fas fa-calendar-week"></i>
                                프로젝트 주간보고
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="approval-container">
                <!-- 좌측: 문서함 메뉴 -->
                <aside class="approval-sidebar">
                    <div class="sidebar-section">
                        <h3 class="sidebar-title">
                            <i class="fas fa-folder"></i>
                            프로젝트 문서
                        </h3>
                        <nav class="sidebar-menu">
                            <a href="#" class="menu-item active" data-category="all">
                                <i class="fas fa-copy"></i>
                                <span>전체 문서</span>
                            </a>
                            <a href="#" class="menu-item" data-category="project-weekly-report">
                                <i class="fas fa-calendar-week"></i>
                                <span>프로젝트 주간보고</span>
                            </a>
                            <a href="#" class="menu-item" data-category="receipt-meeting">
                                <i class="fas fa-utensils"></i>
                                <span>회의비 증빙</span>
                            </a>
                            <a href="#" class="menu-item" data-category="receipt-trip">
                                <i class="fas fa-plane"></i>
                                <span>단독 출장 증빙</span>
                            </a>
                            <a href="#" class="menu-item" data-category="receipt-trip-meeting">
                                <i class="fas fa-suitcase"></i>
                                <span>회의+출장 증빙</span>
                            </a>
                            <a href="#" class="menu-item" data-category="receipt-overtime">
                                <i class="fas fa-moon"></i>
                                <span>야근식대 증빙</span>
                            </a>
                        </nav>
                    </div>
                </aside>

                <!-- 우측: 문서 목록 -->
                <div class="approval-content">
                    <div class="content-header">
                        <h2 class="content-title">전체 문서 <span class="document-count-badge" id="documentCountBadge">0</span></h2>
                        <div class="content-controls">
                            <div class="period-filter-wrapper">
                                <select class="sort-select" id="periodFilter">
                                    <option value="all">전체기간</option>
                                    <option value="today">오늘</option>
                                    <option value="week">최근 1주일</option>
                                    <option value="month">최근 1개월</option>
                                    <option value="3months">최근 3개월</option>
                                    <option value="6months">최근 6개월</option>
                                    <option value="year">최근 1년</option>
                                    <option value="custom">직접입력</option>
                                </select>
                                <div class="filter-tooltip">
                                    <i class="fas fa-info-circle"></i>
                                    <div class="tooltip-content">
                                        <strong>기간 검색 기준</strong>
                                        <ul>
                                            <li><strong>주간보고:</strong> 문서 작성일 기준</li>
                                            <li><strong>연구비증빙:</strong> 실제 지출일 기준
                                                <span class="tooltip-sub">(회의일자, 출장일자, 야근일자)</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <!-- 프로젝트 필터 -->
                            <div class="project-filter-wrapper">
                                <div class="project-filter-input" id="projectFilterInput">
                                    <i class="fas fa-project-diagram"></i>
                                    <input type="text"
                                           id="projectSearchInput"
                                           placeholder="프로젝트 검색 또는 선택..."
                                           autocomplete="off"
                                           readonly>
                                    <i class="fas fa-chevron-down arrow-icon"></i>
                                </div>

                                <!-- 프로젝트 드롭다운 -->
                                <div class="project-dropdown" id="projectDropdown" style="display: none;">
                                    <div class="project-search-wrapper">
                                        <i class="fas fa-search"></i>
                                        <input type="text"
                                               id="projectSearchBox"
                                               placeholder="프로젝트명 입력..."
                                               autocomplete="off">
                                    </div>
                                    <div class="project-list-wrapper">
                                        <!-- 전체 프로젝트 옵션 -->
                                        <div class="project-all-option" id="projectAllOption">
                                            <div class="project-item" data-project-idx="all">
                                                <span class="project-item-name"><strong>전체 프로젝트</strong></span>
                                                <span class="project-item-count" id="allProjectCount">0</span>
                                            </div>
                                        </div>

                                        <div class="project-group">
                                            <div class="project-group-header">
                                                <i class="fas fa-circle" style="color: #4ade80;"></i>
                                                진행중
                                            </div>
                                            <div class="project-items" id="activeProjects">
                                                <!-- JavaScript로 동적 생성 -->
                                            </div>
                                        </div>
                                        <div class="project-group">
                                            <div class="project-group-header">
                                                <i class="fas fa-check-circle" style="color: #94a3b8;"></i>
                                                완료
                                            </div>
                                            <div class="project-items" id="completedProjects">
                                                <!-- JavaScript로 동적 생성 -->
                                            </div>
                                        </div>
                                        <div class="project-group">
                                            <div class="project-group-header">
                                                <i class="fas fa-pause-circle" style="color: #fbbf24;"></i>
                                                보류
                                            </div>
                                            <div class="project-items" id="pausedProjects">
                                                <!-- JavaScript로 동적 생성 -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 직접입력 날짜 범위 (기본 숨김) -->
                    <div class="date-range-container" id="dateRangeContainer" style="display: none;">
                        <div class="date-range-wrapper">
                            <div class="date-input-group">
                                <i class="fas fa-calendar-alt"></i>
                                <input type="date" id="startDate" class="date-input" placeholder="시작일">
                            </div>
                            <span class="date-separator">~</span>
                            <div class="date-input-group">
                                <i class="fas fa-calendar-alt"></i>
                                <input type="date" id="endDate" class="date-input" placeholder="종료일">
                            </div>
                            <button class="btn-date-search" id="btnDateSearch">
                                <i class="fas fa-search"></i>
                                조회
                            </button>
                            <button class="btn-date-reset" id="btnDateReset">
                                <i class="fas fa-redo"></i>
                            </button>
                        </div>
                    </div>

                    <div class="document-table-wrapper">
                        <div class="document-table-container" id="documentList">
                            <table class="document-table">
                            <thead>
                                <tr>
                                    <th width="150" class="sortable" data-sort="type">
                                        문서종류 <i class="fas fa-sort"></i>
                                    </th>
                                    <th width="180" class="sortable" data-sort="project">
                                        프로젝트 <i class="fas fa-sort"></i>
                                    </th>
                                    <th class="sortable" data-sort="title">
                                        제목 <i class="fas fa-sort"></i>
                                    </th>
                                    <th width="120" class="sortable" data-sort="drafter">
                                        문서 생성자 <i class="fas fa-sort"></i>
                                    </th>
                                    <th width="120" class="sortable" data-sort="department">
                                        부서 <i class="fas fa-sort"></i>
                                    </th>
                                    <th width="120" class="sortable" data-sort="date">
                                        작성일시 <i class="fas fa-sort"></i>
                                    </th>
                                    <th width="100">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JavaScript에서 동적으로 렌더링됩니다 -->
                            </tbody>
                        </table>
                            <!-- 빈 상태 -->
                            <div class="empty-state" id="emptyState" style="display: none;">
                                <i class="fas fa-inbox"></i>
                                <h3>문서가 없습니다</h3>
                                <p>조건에 맞는 프로젝트 문서가 없습니다.</p>
                            </div>
                        </div>

                        <!-- 페이지네이션 (JavaScript에서 동적 생성) -->
                        <div class="pagination" style="display: none;">
                            <!-- 페이지네이션 버튼은 JavaScript에서 동적으로 생성됩니다 -->
                        </div>
                    </div>


                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/search-utils.js}"></script>
    <script th:src="@{/js/project-documents.js}"></script>
</body>
</html>
