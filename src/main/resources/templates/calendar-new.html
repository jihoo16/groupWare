<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ERP 시스템 - 일정 추가', '/css/calendar-new.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('calendar')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <div class="edit-container">
                <!-- 헤더 -->
                <div class="edit-header">
                    <div class="header-title-wrapper">
                        <h1 class="page-title">
                            <i class="fas fa-calendar-plus"></i>
                            일정 추가
                        </h1>
                        <button class="btn-back" id="backBtn">
                            <i class="fas fa-arrow-left"></i>
                            목록으로
                        </button>
                    </div>
                </div>

                <!-- 추가 폼 -->
                <div class="edit-content">
                    <form id="newScheduleForm" class="schedule-form">
                        <div class="form-section">
                            <h2 class="section-title">기본 정보</h2>

                            <!-- 탭 UI -->
                            <div class="event-type-tabs">
                                <button type="button" class="event-type-tab active" data-tab="personal">
                                    <i class="fas fa-user"></i> 개인 일정
                                </button>
                                <!-- 팀 일정 탭 - 보류
                                <button type="button" class="event-type-tab" data-tab="team">
                                    <i class="fas fa-users"></i> 팀 일정
                                </button>
                                -->
                            </div>

                            <!-- 탭 컨텐츠 영역 -->
                            <div class="tab-content-area">
                            <!-- 팀 일정 전용 필드 - 보류
                            <div class="form-group team-only" style="display: none;">
                                <label class="form-label">팀 선택 <span class="required">*</span></label>
                                <button type="button" id="openTeamSelectModalBtn" class="btn-add" style="width: 100%; justify-content: center;">
                                    <i class="fas fa-users"></i>
                                    팀 선택
                                </button>
                                <div id="selectedTeamTagContainer" class="participants-list" style="margin-top: 12px;"></div>
                            </div>
                            -->

                            <div class="form-group">
                                <label class="form-label">일정 제목 <span class="required">*</span></label>
                                <input type="text" id="scheduleTitle" class="form-input" placeholder="일정 제목을 입력하세요" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">일정 유형 <span class="required">*</span></label>
                                <select id="scheduleType" class="form-input" required>
                                    <option value="business" selected>업무 일정</option>
                                    <option value="meeting-room">회의실 예약</option>
                                    <option value="etc">기타</option>
                                </select>
                            </div>

                            <!-- 달력 UI -->
                            <div class="schedule-calendar-section">
                                <div class="calendar-header">
                                    <button type="button" class="calendar-nav" id="prevMonthBtn">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <h4 class="calendar-title" id="scheduleCalendarTitle">2025년 1월</h4>
                                    <button type="button" class="calendar-nav" id="nextMonthBtn">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                                <div class="calendar-weekdays">
                                    <div class="weekday sun">일</div>
                                    <div class="weekday">월</div>
                                    <div class="weekday">화</div>
                                    <div class="weekday">수</div>
                                    <div class="weekday">목</div>
                                    <div class="weekday">금</div>
                                    <div class="weekday sat">토</div>
                                </div>
                                <div class="calendar-days" id="scheduleCalendarDays">
                                    <!-- JavaScript로 생성 -->
                                </div>
                                <div class="selected-period-display" id="selectedPeriodDisplay">
                                    <i class="fas fa-calendar-check"></i>
                                    <span id="selectedPeriodText">날짜를 선택해주세요</span>
                                </div>
                            </div>

                            <!-- Hidden inputs for form submission -->
                            <input type="hidden" id="scheduleStartDate" required>
                            <input type="hidden" id="scheduleEndDate" required>

                            <div class="form-group">
                                <label class="form-checkbox-wrapper">
                                    <span class="form-checkbox-label">종일</span>
                                    <input type="checkbox" id="isAllDayCheckbox" class="form-checkbox-input">
                                    <span class="toggle-switch"></span>
                                </label>
                            </div>

                            <div class="form-row" id="timeInputRow">
                                <div class="form-group">
                                    <label class="form-label">시작 시간</label>
                                    <input type="time" id="scheduleStartTime" class="form-input" value="09:00">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">종료 시간</label>
                                    <input type="time" id="scheduleEndTime" class="form-input" value="18:00">
                                </div>
                            </div>
                            </div><!-- /.tab-content-area -->
                        </div>

                        <div class="form-section" id="participantsSection">
                            <h2 class="section-title">참석자</h2>

                            <div class="form-group">
                                <div class="participants-input-wrapper">
                                    <div class="participants-input">
                                        <input type="text" id="participantInput" class="form-input" placeholder="직원 이름 검색 또는 외부인원 입력 후 Enter" autocomplete="off">
                                        <button type="button" id="addParticipantBtn" class="btn-add">
                                            <i class="fas fa-user-plus"></i> 추가
                                        </button>
                                    </div>
                                    <div id="employeeDropdown" class="employee-dropdown" style="display: none;"></div>
                                </div>
                                <div id="participantsList" class="participants-list">
                                    <!-- JavaScript에서 동적으로 렌더링됨 -->
                                </div>
                            </div>
                        </div>

                        <div class="form-section" id="detailSection">
                            <h2 class="section-title">상세 정보</h2>

                            <div class="form-group">
                                <label class="form-label">설명</label>
                                <textarea id="scheduleDescription" class="form-textarea" rows="6" placeholder="일정에 대한 설명을 입력하세요"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">장소</label>
                                <input type="text" id="scheduleLocation" class="form-input" placeholder="장소를 입력하세요">
                            </div>

                            <!-- 알림 설정 - 구현되지 않은 서비스 (주석처리)
                            <div class="form-group">
                                <div class="notification-wrapper">
                                    <div class="notification-toggle-wrapper">
                                        <label class="form-checkbox-wrapper">
                                            <span class="form-checkbox-label">알림 설정</span>
                                            <input type="checkbox" id="notificationToggleCheckbox" class="form-checkbox-input">
                                            <span class="toggle-switch"></span>
                                        </label>
                                    </div>
                                    <div id="notificationTimeButtons" class="notification-time-buttons" style="display: none;">
                                        <button type="button" class="notification-time-btn active" data-time="10">10분 전</button>
                                        <button type="button" class="notification-time-btn" data-time="30">30분 전</button>
                                        <button type="button" class="notification-time-btn" data-time="60">1시간 전</button>
                                    </div>
                                </div>
                            </div>
                            -->
                        </div>
                    </form>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div class="form-actions">
                <div style="flex: 1;"></div>
                <div class="action-buttons-right">
                    <button type="button" class="btn-secondary" id="cancelBtn">
                        취소
                    </button>
                    <button type="button" class="btn-primary" id="saveScheduleBtn">
                        <i class="fas fa-check"></i>
                        저장
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 팀 선택 모달 - 보류
    <div id="teamSelectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">팀 선택</h2>
                <button class="modal-close" id="closeTeamSelectModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="team-select-list" id="teamSelectList">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelTeamSelectBtn">취소</button>
            </div>
        </div>
    </div>
    -->

    <!-- 직원 선택 모달 -->
    <div id="employeeSelectionModal" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>직원 선택</h2>
                <button class="modal-close" id="closeEmployeeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="employee-selection-container">
                    <div class="org-tree-panel">
                        <div class="panel-header">
                            <input type="text" id="employeeSearch" class="search-input" placeholder="이름, 부서, 직급으로 검색...">
                            <div class="panel-header-buttons">
                                <button type="button" id="selectAllBtn" class="btn-select-all">
                                    <i class="fas fa-check-double"></i> 전체 선택
                                </button>
                                <button type="button" id="expandAllBtn" class="btn-expand">
                                    <i class="fas fa-plus-square"></i> 전체 펼치기
                                </button>
                            </div>
                        </div>
                        <div class="org-tree-wrapper">
                            <div id="employeeOrgTree" class="org-tree"></div>
                        </div>
                    </div>
                    <div class="selected-employees-panel">
                        <div class="panel-header">
                            <h3>선택된 직원 (<span id="selectedCount">0</span>)</h3>
                            <button type="button" id="clearSelectedBtn" class="btn-clear">
                                <i class="fas fa-times"></i> 전체 해제
                            </button>
                        </div>
                        <div id="selectedEmployeesList" class="selected-employees-list"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancelEmployeeSelection">취소</button>
                <button type="button" class="btn-confirm" id="confirmEmployeeSelection">
                    <i class="fas fa-check"></i> 선택 완료
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/calendar-new.js}"></script>
</body>
</html>
