<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('팀 관리', '/css/team.css')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('team')}"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">
                    <i class="fas fa-users-cog"></i>
                    팀 관리
                </h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="newTeamBtn">
                    <i class="fas fa-plus"></i> 신규 팀 생성
                </button>
            </div>
        </header>

        <!-- 필터 및 검색 -->
        <div class="filter-section">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">
                    <i class="fas fa-list"></i> 전체 팀
                </button>
                <button class="filter-tab" data-filter="my-created">
                    <i class="fas fa-user-plus"></i> 내가 만든 팀
                </button>
                <button class="filter-tab" data-filter="my-teams">
                    <i class="fas fa-users"></i> 내가 속한 팀
                </button>
                <button class="filter-tab" data-filter="leader">
                    <i class="fas fa-crown"></i> 내가 리더인 팀
                </button>
            </div>
            <div class="team-search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="teamSearchInput" class="team-search-input" placeholder="팀 이름으로 검색...">
            </div>
        </div>

        <!-- 팀 목록 -->
        <div class="content-section">
            <div class="teams-header">
                <h2 class="section-title">팀 목록 (<span id="teamCount">0</span>)</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">
                        <i class="fas fa-th"></i>
                    </button>
                    <button class="view-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <!-- 로딩 상태 -->
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
                <p>팀 목록을 불러오는 중...</p>
            </div>

            <!-- 에러 상태 -->
            <div id="errorState" class="error-state" style="display: none;">
                <div class="error-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <p>팀 목록을 불러오는데 실패했습니다.</p>
                <button class="btn btn-secondary" id="retryBtn">
                    <i class="fas fa-redo"></i> 다시 시도
                </button>
            </div>

            <!-- 팀 그리드 -->
            <div id="teamGrid" class="team-grid" style="display: none;">
                <!-- 팀 카드가 동적으로 추가됩니다 -->
            </div>

            <!-- 팀 리스트 -->
            <div id="teamList" class="team-list" style="display: none;">
                <table class="team-table">
                    <thead>
                        <tr>
                            <th width="50">No</th>
                            <th>팀 이름</th>
                            <th width="100">팀 유형</th>
                            <th width="120">팀 리더</th>
                            <th width="80">멤버 수</th>
                            <th width="150">생성일</th>
                            <th width="100">상태</th>
                            <th width="150">액션</th>
                        </tr>
                    </thead>
                    <tbody id="teamTableBody">
                        <!-- 팀 행이 동적으로 추가됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- 팀 상세 모달 -->
<div id="teamDetailModal" class="modal">
    <div class="modal-content modal-lg">
        <div class="modal-header">
            <h2 id="modalTeamName">팀 상세 정보</h2>
            <button class="modal-close" id="closeDetailModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="team-detail-content">
                <div class="detail-section">
                    <h3>기본 정보</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>팀 이름</label>
                            <p id="detailTeamName">-</p>
                        </div>
                        <div class="detail-item">
                            <label>팀 유형</label>
                            <p id="detailTeamType">-</p>
                        </div>
                        <div class="detail-item">
                            <label>팀 리더</label>
                            <p id="detailTeamLeader">-</p>
                        </div>
                        <div class="detail-item">
                            <label>생성자</label>
                            <p id="detailCreator">-</p>
                        </div>
                        <div class="detail-item">
                            <label>생성일</label>
                            <p id="detailCreatedAt">-</p>
                        </div>
                        <div class="detail-item">
                            <label>상태</label>
                            <p id="detailStatus">-</p>
                        </div>
                    </div>
                    <div class="detail-item full-width">
                        <label>팀 설명</label>
                        <p id="detailDescription">-</p>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>팀원 목록 (<span id="detailMemberCount">0</span>명)</h3>
                    <div class="member-list" id="detailMemberList">
                        <!-- 멤버 목록이 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="closeDetailBtn">닫기</button>
            <button class="btn btn-primary" id="editTeamBtn">
                <i class="fas fa-edit"></i> 수정
            </button>
        </div>
    </div>
</div>

<!-- 팀 삭제 확인 모달 -->
<div id="deleteConfirmModal" class="modal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h2>팀 삭제 확인</h2>
            <button class="modal-close" id="closeDeleteModal">&times;</button>
        </div>
        <div class="modal-body">
            <p>정말로 이 팀을 삭제하시겠습니까?</p>
            <p class="warning-text">
                <i class="fas fa-exclamation-triangle"></i>
                삭제된 팀은 복구할 수 없습니다.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelDeleteBtn">취소</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">
                <i class="fas fa-trash"></i> 삭제
            </button>
        </div>
    </div>
</div>

<script th:src="@{/js/team.js}"></script>
</body>
</html>
