<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('프로젝트 주간업무보고 상세', '/css/approval_project_weekly_report_detail.css')}"></head>
<body>
<!-- 로딩 오버레이 -->
<div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('project-documents')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-calendar-week"></i> 프로젝트 주간업무보고 상세</h1>
                </div>
                <div class="header-right" id="headerButtons">
                    <!-- 수정/삭제 버튼은 작성자인 경우에만 동적으로 생성됨 -->
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="editor-area">
                    <!-- 문서 양식 -->
                    <div class="document-form">
                        <h2 class="doc-title">주 간 업 무 보 고</h2>

                        <!-- 기본 정보 -->
                        <table class="form-table">
                            <tr>
                                <th>프로젝트명</th>
                                <td colspan="3">
                                    <input type="text" id="projectName" readonly>
                                </td>
                            </tr>
                            <tr>
                                <th>보고자</th>
                                <td>
                                    <input type="text" id="userName" readonly>
                                </td>
                                <th style="width: 15%;">부서</th>
                                <td>
                                    <input type="text" id="userDept" readonly>
                                </td>
                            </tr>
                            <tr>
                                <th>보고 기간</th>
                                <td colspan="3">
                                    <input type="text" id="reportPeriod" readonly>
                                </td>
                            </tr>
                            <tr>
                                <th>주간 달성률</th>
                                <td colspan="3">
                                    <input type="text" id="weeklyAchievementRate" readonly>
                                </td>
                            </tr>
                        </table>

                        <!-- 금주 주요 업무 -->
                        <h3 class="section-title">금주 주요 업무</h3>
                        <div class="content-box">
                            <p id="mainTasks" class="content-text"></p>
                        </div>

                        <!-- 주요 성과 -->
                        <h3 class="section-title">주요 성과</h3>
                        <div class="content-box">
                            <p id="achievements" class="content-text"></p>
                        </div>

                        <!-- 주요 이슈 -->
                        <h3 class="section-title">주요 이슈</h3>
                        <div class="content-box">
                            <p id="issues" class="content-text"></p>
                        </div>

                        <!-- 차주 계획 -->
                        <h3 class="section-title">차주 계획</h3>
                        <div class="content-box">
                            <p id="nextWeekPlan" class="content-text"></p>
                        </div>

                        <!-- 기타 -->
                        <h3 class="section-title">기타</h3>
                        <div class="content-box">
                            <p id="remarks" class="content-text"></p>
                        </div>

                        <!-- 첨부파일 -->
                        <h3 class="section-title">첨부파일</h3>
                        <div id="attachedFileList" class="attachments-list">
                            <p style="color: #999; font-size: 13px;">첨부된 파일이 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/approval_project_weekly_report_detail.js}"></script>
</body>
</html>
