<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('월간업무보고', '/css/approval_monthly_report.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-calendar-alt"></i> 문서 작성 > 월간업무보고</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 -->
                    <aside class="template-sidebar">
                        <div class="sidebar-section">
                            <div class="sidebar-header">
                                <h3 class="sidebar-title"><i class="fas fa-file-alt"></i> 문서 양식</h3>
                                <button class="btn-toggle-all" id="toggleAllBtn">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </div>
                            <nav class="sidebar-menu">
                                <!-- 인사 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-user-tie"></i>
                                        <span>인사</span>
                                        <span class="category-badge">1</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/vacation" class="menu-item">
                                            <i class="fas fa-umbrella-beach"></i>
                                            <span>연차신청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 지출 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-coins"></i>
                                        <span>지출</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/expense" class="menu-item">
                                            <i class="fas fa-won-sign"></i>
                                            <span>지출승인서</span>
                                        </a>
                                        <a href="/approval/purchase" class="menu-item">
                                            <i class="fas fa-shopping-cart"></i>
                                            <span>구매요청서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 보고 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-chart-line"></i>
                                        <span>보고</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/weekly-report" class="menu-item">
                                            <i class="fas fa-calendar-week"></i>
                                            <span>주간업무보고</span>
                                        </a>
                                        <a href="/approval/monthly-report" class="menu-item active">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span>월간업무보고</span>
                                        </a>
                                        <a href="/approval/meeting" class="menu-item">
                                            <i class="fas fa-users"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/general" class="menu-item">
                                            <i class="fas fa-file-alt"></i>
                                            <span>일반기안문서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 출장 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-plane-departure"></i>
                                        <span>출장</span>
                                        <span class="category-badge">2</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/business-trip" class="menu-item">
                                            <i class="fas fa-plane"></i>
                                            <span>출장신청</span>
                                        </a>
                                        <a href="/approval/trip-report" class="menu-item">
                                            <i class="fas fa-clipboard-list"></i>
                                            <span>출장보고서</span>
                                        </a>
                                    </div>
                                </div>

                                <!-- 연구비증빙 -->
                                <div class="menu-category expanded">
                                    <div class="category-header">
                                        <i class="fas fa-chevron-right category-toggle"></i>
                                        <i class="fas fa-file-invoice-dollar"></i>
                                        <span>연구비증빙</span>
                                        <span class="category-badge">4</span>
                                    </div>
                                    <div class="category-items">
                                        <a href="/approval/receipt-meeting" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>회의록</span>
                                        </a>
                                        <a href="/approval/receipt-trip" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>출장</span>
                                        </a>
                                        <a href="/approval/receipt-trip-meeting" class="menu-item">
                                            <i class="fas fa-file-invoice"></i>
                                            <span>출장+회의</span>
                                        </a>
                                        <a href="/approval/receipt-overtime" class="menu-item">
                                            <i class="fas fa-receipt"></i>
                                            <span>야근식대</span>
                                        </a>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                    </tr>

                                </table>
                            </div>

                            <h2 class="doc-title">월 간 업 무 보 고</h2>

                            <table class="form-table">
                                <tr>
                                    <th>과제명</th>
                                    <td colspan="3">
                                        <select id="projectName" class="form-control">
                                            <option value="">선택 안함</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <th>보고자</th>
                                    <td><input type="text" value="홍길동" readonly></td>
                                    <th>부서</th>
                                    <td><input type="text" value="개발팀" readonly></td>
                                </tr>
                                <tr>
                                    <th>보고 월</th>
                                    <td colspan="3"><input type="month" id="reportMonth" class="auto-month"></td>
                                </tr>
                                <tr>
                                    <th>월간 주요 업무</th>
                                    <td colspan="3"><textarea id="mainTasks" placeholder="이번 달 수행한 주요 업무" rows="6"></textarea></td>
                                </tr>
                                <tr>
                                    <th>목표 대비 실적</th>
                                    <td colspan="3"><textarea id="performance" placeholder="설정한 목표와 달성 실적 비교" rows="5"></textarea></td>
                                </tr>
                                <tr>
                                    <th>개선사항</th>
                                    <td colspan="3"><textarea id="improvements" placeholder="개선이 필요한 사항" rows="4"></textarea></td>
                                </tr>
                                <tr>
                                    <th>차월 계획</th>
                                    <td colspan="3"><textarea id="nextMonthPlan" placeholder="다음 달 주요 계획" rows="5"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/approval_monthly_report.js}"></script>
</body>
</html>
