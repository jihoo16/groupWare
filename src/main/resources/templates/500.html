<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 오류 - ERP 시스템</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/404.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="error-code">500</h1>
            <h2 class="error-title">서버가 실수했어요!</h2>
            <p class="error-message">
                죄송합니다. 서버가 깜빡하고 요청을 처리하지 못했어요.<br>
                잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의하세요.
            </p>
            <div class="error-actions">
                <button class="btn-home" onclick="window.location.href='/'">
                    <i class="fas fa-home"></i>
                    홈으로 돌아가기
                </button>
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    이전 페이지
                </button>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            // 히스토리가 있으면 이전 페이지로, 없으면 홈으로
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
