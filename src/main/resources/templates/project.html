<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('프로젝트 관리', '/css/project.css')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar('project')}"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">프로젝트 관리</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="newProjectBtn">
                    <i class="fas fa-plus"></i> 신규 프로젝트
                </button>
            </div>
        </header>

    <!-- 현재 진행중인 프로젝트 -->
    <div class="content-card">
        <div class="card-header card-header-sticky">
            <h2>현재 진행중인 프로젝트</h2>
            <div class="header-controls">
                <button class="my-project-toggle-btn" id="myProjectToggleBtn" title="내 프로젝트만 보기">
                    <i class="fas fa-user"></i>
                    <span>내 프로젝트</span>
                </button>
                <div class="view-toggle-buttons">
                    <button class="view-toggle-btn" id="cardViewBtn" title="카드형">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button class="view-toggle-btn active" id="listViewBtn" title="리스트형">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 카드형 뷰 -->
        <div class="project-grid" id="currentProjectGrid" style="display: none;">
            <!-- JavaScript에서 동적으로 렌더링됩니다 -->
        </div>

        <!-- 리스트형 뷰 -->
        <div class="current-project-list-container" id="currentProjectListContainer">
            <table class="project-table current-project-table" id="currentProjectTable">
                <thead>
                    <tr>
                        <th width="50">No</th>
                        <th>프로젝트명</th>
                        <th width="100">상태</th>
                        <th width="120">연구책임자</th>
                        <th width="80">팀원</th>
                        <th width="200">기간</th>
                        <th width="100">진행률</th>
                    </tr>
                </thead>
                <tbody id="currentProjectListBody">
                    <!-- JavaScript에서 동적으로 렌더링됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 과거 프로젝트 -->
    <div class="content-card" style="margin-top: 24px;">
        <div class="card-header">
            <h2>프로젝트 목록</h2>
            <div class="filter-group">
                <div class="status-filter-buttons">
                    <button class="filter-btn active" data-status="">전체</button>
                    <button class="filter-btn" data-status="PLANNING">기획</button>
                    <button class="filter-btn" data-status="IN_PROGRESS">진행중</button>
                    <button class="filter-btn" data-status="COMPLETED">완료</button>
                    <button class="filter-btn" data-status="PENDING">대기</button>
                    <button class="filter-btn" data-status="CANCELLED">취소</button>
                </div>
                <input type="text" id="searchPastInput" class="search-input" placeholder="프로젝트명 검색...">
            </div>
        </div>

        <div class="project-table-container">
            <table class="project-table" id="pastProjectTable">
                <thead>
                    <tr>
                        <th width="50">No</th>
                        <th>프로젝트명</th>
                        <th width="100">상태</th>
                        <th width="120">연구책임자</th>
                        <th width="80">팀원</th>
                        <th width="200">기간</th>
                        <th width="100">진행률</th>
                    </tr>
                </thead>
                <tbody id="pastProjectTableBody">

                </tbody>
            </table>

            <!-- 페이지네이션 -->
            <div class="pagination-container">
                <button class="pagination-btn" id="firstPageBtn" title="처음">
                    <i class="fas fa-angle-double-left"></i>
                </button>
                <button class="pagination-btn" id="prevPageBtn" title="이전">
                    <i class="fas fa-angle-left"></i>
                </button>
                <div class="pagination-numbers" id="paginationNumbers"></div>
                <button class="pagination-btn" id="nextPageBtn" title="다음">
                    <i class="fas fa-angle-right"></i>
                </button>
                <button class="pagination-btn" id="lastPageBtn" title="마지막">
                    <i class="fas fa-angle-double-right"></i>
                </button>
                <div class="pagination-info">
                    <span id="pageInfo"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 프로젝트 상세 모달 -->
    <div id="projectDetailModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>프로젝트 상세 정보</h2>
                <button class="modal-close" onclick="closeProjectDetailModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- 탭 메뉴 -->
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="info" onclick="switchDetailTab('info')">
                    <i class="fas fa-info-circle"></i> 기본 정보
                </button>
                <button class="modal-tab" data-tab="schedule" onclick="switchDetailTab('schedule')">
                    <i class="fas fa-calendar-alt"></i> 상세 일정
                </button>
            </div>

            <div class="modal-body">
                <!-- 기본 정보 탭 -->
                <div id="infoTabContent" class="tab-content active">
                    <div class="detail-section">
                        <h3>기본 정보</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>프로젝트명</label>
                                <span id="detailProjectName">-</span>
                            </div>
                            <div class="detail-item">
                                <label>상태</label>
                                <span id="detailStatus">-</span>
                            </div>
                            <div class="detail-item">
                                <label>연구책임자</label>
                                <span id="detailPM">-</span>
                            </div>
                            <div class="detail-item">
                                <label>팀원 수</label>
                                <span id="detailTeamSize">-</span>
                            </div>
                            <div class="detail-item">
                                <label>현재 차수 시작일</label>
                                <span id="detailStartDate">-</span>
                            </div>
                            <div class="detail-item">
                                <label>현재 차수 종료일</label>
                                <span id="detailEndDate">-</span>
                            </div>
                            <div class="detail-item">
                                <label>총 프로젝트 시작일</label>
                                <span id="detailTotalPeriodStart">-</span>
                            </div>
                            <div class="detail-item">
                                <label>총 프로젝트 종료일</label>
                                <span id="detailTotalPeriodEnd">-</span>
                            </div>
                            <div class="detail-item">
                                <label>활동비 예산</label>
                                <span id="detailActivityBudget">-</span>
                            </div>
                            <div class="detail-item">
                                <label>장비비 예산</label>
                                <span id="detailEquipmentBudget">-</span>
                            </div>
                            <div class="detail-item">
                                <label>재료비 예산</label>
                                <span id="detailMaterialBudget">-</span>
                            </div>
                        </div>
                    </div>
                    <div class="detail-section">
                        <h3>프로젝트 설명</h3>
                        <p id="detailDescription">-</p>
                    </div>
                    <div class="detail-section">
                        <h3>진행률</h3>
                        <div class="project-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" id="detailProgressBar"></div>
                            </div>
                            <span class="progress-text" id="detailProgressText">0%</span>
                        </div>
                    </div>
                </div>

                <!-- 상세 일정 탭 -->
                <div id="scheduleTabContent" class="tab-content" style="display: none;">
                    <div class="detail-section">
                        <div class="schedule-header-section">
                            <div class="info-note" style="margin-bottom: 0;">
                                <i class="fas fa-info-circle"></i>
                                <span>프로젝트에 작성된 주간업무보고가 표시됩니다.</span>
                            </div>
                            <button class="btn btn-primary btn-sm" id="createWeeklyReportBtn">
                                <i class="fas fa-plus"></i> 주간업무보고 작성
                            </button>
                        </div>
                        <div class="table-container schedule-table-container">
                            <table class="project-table schedule-table">
                                <thead>
                                    <tr>
                                        <th style="width: 60px;">No</th>
                                        <th style="width: 80px;">분류</th>
                                        <th style="width: 180px;">기간</th>
                                        <th>내용</th>
                                        <th style="width: 100px;">달성률</th>
                                    </tr>
                                </thead>
                                <tbody id="detailScheduleTableBody">
                                    <!-- 동적으로 렌더링됩니다 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProjectDetailModal()">닫기</button>
                <button class="btn btn-primary" onclick="editCurrentProject()">
                    <i class="fas fa-edit"></i> 프로젝트 수정
                </button>
            </div>
        </div>
    </div>
    </main>
</div>

<script th:src="@{/js/search-utils.js}"></script>
<script th:src="@{/js/project.js}"></script>
</body>
</html>
