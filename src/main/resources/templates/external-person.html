<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('외부인원 관리', '/css/external-person.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('external-person')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-user-friends"></i> 외부인원 관리</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="이름 또는 회사명 검색..." id="personSearch">
                    </div>
                    <button class="btn-primary" id="addPersonBtn">
                        <i class="fas fa-user-plus"></i>
                        외부인원 등록
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- 통계 카드 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-content">
                            <h3>전체 외부인원</h3>
                            <p class="stat-number"><span id="totalCount">0</span><span>명</span></p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="stat-content">
                            <h3>등록된 회사</h3>
                            <p class="stat-number"><span id="companyCount">0</span><span>개</span></p>
                        </div>
                    </div>
                </div>

                <!-- 외부인원 목록 테이블 -->
                <div class="table-wrapper">
                    <table class="person-table">
                        <thead>
                            <tr>
                                <th width="80">번호</th>
                                <th>소속회사</th>
                                <th>직급</th>
                                <th>이름</th>
                                <th width="150">관리</th>
                            </tr>
                        </thead>
                        <tbody id="personTableBody">
                            <!-- JavaScript로 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 외부인원 등록/수정 모달 -->
    <div id="personModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">외부인원 등록</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="personForm">
                    <input type="hidden" id="personIdx">

                    <div class="form-group">
                        <label for="companyName">소속회사 <span class="required">*</span></label>
                        <input type="text" id="companyName" class="form-input" placeholder="회사명을 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label for="position">직급 <span class="required">*</span></label>
                        <input type="text" id="position" class="form-input" placeholder="직급을 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label for="personName">이름 <span class="required">*</span></label>
                        <input type="text" id="personName" class="form-input" placeholder="이름을 입력하세요" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">취소</button>
                <button type="button" class="btn-primary" id="saveBtn">저장</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/external-person.js}"></script>
</body>
</html>
