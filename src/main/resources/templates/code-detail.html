<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('상세코드 관리', '/css/code-detail.css')}"></head>
<body>
<!-- 로딩 오버레이 -->
<div th:replace="~{fragments/loading-overlay :: overlay}"></div>

<div class="container">

<div th:replace="~{fragments/sidebar :: sidebar('basic-info')}"></div>

<main class="main-content">
    <div class="header">
        <div>
            <h1 id="page-title">상세코드 관리</h1>
            <p class="subtitle" id="page-subtitle">그룹코드의 하위 코드를 관리합니다</p>
        </div>
        <button class="btn-back" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> 돌아가기
        </button>
    </div>

    <div class="code-detail-wrapper">
        <div class="section-header">
            <h2 id="section-title">코드 목록</h2>
            <button class="btn-add" id="add-code-btn">
                <i class="fas fa-plus"></i> 코드 추가
            </button>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th style="width: 60px;">순서</th>
                    <th>코드</th>
                    <th>코드명</th>
                    <th style="width: 150px;">영문명</th>
                    <th style="width: 200px;">설명</th>
                    <th style="width: 100px;">사용여부</th>
                    <th style="width: 150px;">관리</th>
                </tr>
                </thead>
                <tbody id="codes-tbody">
                    <!-- DB에서 로드 -->
                </tbody>
            </table>
        </div>
    </div>
</main>
</div>

<!-- Code Modal -->
<div id="code-modal" class="modal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h2 id="code-modal-title">코드 추가</h2>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="code-idx">
            <input type="hidden" id="code-group-code">
            <div class="form-group">
                <label>코드 <span class="required">*</span></label>
                <div class="code-input-group">
                    <input type="text" id="code-prefix" class="code-prefix" readonly>
                    <input type="text" id="code-suffix" class="code-suffix" placeholder="예: 01" maxlength="50">
                </div>
                <small>영문 대문자, 숫자 조합 권장</small>
            </div>
            <div class="form-group">
                <label>코드명 <span class="required">*</span></label>
                <input type="text" id="code-name" placeholder="예: 사원, 부장" maxlength="100">
            </div>
            <div class="form-group">
                <label>영문명</label>
                <input type="text" id="code-name-en" placeholder="예: Staff, Manager" maxlength="100">
            </div>
            <div class="form-group">
                <label>설명</label>
                <textarea id="code-description" rows="3" placeholder="코드에 대한 설명을 입력하세요"></textarea>
            </div>
            <div class="form-group">
                <label>정렬 순서</label>
                <input type="number" id="code-order" value="0" min="0">
                <small>숫자가 작을수록 위에 표시됩니다</small>
            </div>
            <div class="form-group">
                <label>사용여부</label>
                <select id="code-status">
                    <option value="Y">사용</option>
                    <option value="N">미사용</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel">취소</button>
            <button class="btn-confirm" id="code-save-btn">저장</button>
        </div>
    </div>
</div>

<script th:src="@{/js/code-detail.js}"></script>
</body>
</html>
