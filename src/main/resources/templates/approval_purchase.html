<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('구매요청서', '/css/approval_purchase.css')}"></head>
<body>
    <div class="container">
        <!-- 좌측 네비게이션 바 -->
        <div th:replace="~{fragments/sidebar :: sidebar('approval')}"></div>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title"><i class="fas fa-shopping-cart"></i> 문서 작성 > 구매요청서</h1>
                </div>
                <div class="header-right">
                    <button class="btn-secondary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        돌아가기
                    </button>
                </div>
            </header>

            <div class="write-container">
                <div class="write-layout">
                    <!-- 좌측: 템플릿 선택 (전자문서 전용) -->
                <div th:replace="~{fragments/approval-sidebar :: approval-sidebar('purchase')}"></div>

                    <!-- 우측: 문서 편집 영역 -->
                    <div class="editor-area">
                        <!-- 문서 양식 -->
                        <div class="document-form">
                            <!-- 결재라인 -->
                            <div class="approval-line-box">
                                <table class="approval-line-table">
                                    <tr>
                                        <th class="approval-header">담당</th>
                                        <th class="approval-header">부서장</th>
                                        <th class="approval-header">대표이사</th>
                                    </tr>
                                    <tr>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                        <td class="approval-sign-cell">
                                            <div class="sign-area">
                                                <span class="sign-placeholder">결재</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                        <td class="approval-name-cell">
                                            <span class="approver-name">-</span>
                                        </td>
                                    </tr>

                                </table>
                            </div>

                            <h2 class="doc-title">구 매 요 청 서</h2>

                            <table class="form-table">
                                <tr>
                                    <th>요청자</th>
                                    <td><input type="text" id="applicantName" readonly></td>
                                    <th>부서</th>
                                    <td><input type="text" id="applicantDept" readonly></td>
                                </tr>
                                <tr>
                                    <th>요청일</th>
                                    <td><input type="date" class="auto-today"></td>
                                    <th>필요일</th>
                                    <td><input type="date"></td>
                                </tr>
                                <tr>
                                    <th>구매 물품</th>
                                    <td colspan="3"><input type="text" placeholder="물품명을 입력하세요"></td>
                                </tr>
                                <tr>
                                    <th>수량</th>
                                    <td><input type="number" placeholder="수량"></td>
                                    <th>단가</th>
                                    <td><input type="number" placeholder="단가"></td>
                                </tr>
                                <tr>
                                    <th>총 금액</th>
                                    <td colspan="3"><input type="number" placeholder="총 구매 금액"></td>
                                </tr>
                                <tr>
                                    <th>구매 사유</th>
                                    <td colspan="3"><textarea placeholder="구매가 필요한 사유를 입력하세요"></textarea></td>
                                </tr>
                                <tr>
                                    <th>비고</th>
                                    <td colspan="3"><textarea placeholder="선호 브랜드, 모델 등 추가 요청사항"></textarea></td>
                                </tr>
                            </table>
                        </div>

                        <!-- 첨부파일 -->
                        <div class="attachment-section">
                            <div class="section-header">
                                <h4><i class="fas fa-paperclip"></i> 첨부파일</h4>
                            </div>
                            <div class="file-upload-area" id="fileUploadArea">
                                <input type="file" id="fileInput" multiple hidden>
                                <label for="fileInput" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>파일을 선택하거나 드래그하세요</span>
                                    <small>최대 10MB, 최대 5개</small>
                                </label>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="submit-actions">
                            <button class="btn-secondary btn-lg" onclick="history.back()">
                                <i class="fas fa-times"></i>
                                취소
                            </button>
                            <button class="btn-outline btn-lg" id="saveDraftBtn">
                                <i class="fas fa-save"></i>
                                임시저장
                            </button>
                            <button class="btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/approval_purchase.js}"></script>
</body>
</html>
