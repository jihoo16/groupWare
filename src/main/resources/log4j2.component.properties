# Log4j2 Global Performance Configuration

# Enable Async Loggers by default
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector

# LMAX Disruptor Ring Buffer Size
log4j2.asyncLoggerConfigRingBufferSize=262144
log4j2.asyncLoggerRingBufferSize=262144

# Wait Strategy: Block is generally best for throughput
log4j2.asyncLoggerConfigWaitStrategy=Block

# Enable Garbage-free logging
log4j2.enableDirectEncoders=true
log4j2.messageFactory=org.apache.logging.log4j.message.ReusableMessageFactory

# Virtual Thread / Context propagation support
log4j2.isThreadContextMapInheritable=true
log4j2.enableThreadlocals=false
