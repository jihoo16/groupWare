# ============================================
# ERP Application Configuration
# ============================================

# Application Name
spring.application.name=PINECNI-ERP

# Environment Indicator (LOCAL / DEV / PROD)
app.env=LOCAL

# Server Configuration
server.port=8080

# ============================================
# Database Configuration (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://192.168.1.165:15431/stage?prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=erp_dev
spring.datasource.password=rdsdap1234!%

# Connection Pool (HikariCP - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ERPConnectionPool
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA / Hibernate Configuration
# ============================================
# spring.jpa.hibernate.ddl-auto options: none | validate | update | create | create-drop
# update: Automatically updates schema on entity changes (convenient for dev but may cause data conflicts)
# validate: Only validates entity-schema consistency (recommended for production)
# none: No automatic schema operations
# Manually manage DDL when Entity changes
spring.jpa.hibernate.ddl-auto=none

# SQL Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy for consistency with DB column conventions
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# PostgreSQL LOB handling - use bytea instead of oid
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Timezone Configuration (Korea Standard Time)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ============================================
# Logging Configuration
# ============================================
#logging.file.path=/home/rocky/erp/logs
logging.file.path=./logs
logging.file.name=${logging.file.path}/erp-application.log

# Log levels
logging.level.root=INFO
logging.level.com.pinecni.erp=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Logback configuration file
logging.config=classpath:log4j2.xml

# Log file encoding
logging.charset.file=UTF-8
logging.charset.console=UTF-8


# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================
# File Storage Configuration
# ============================================
# 모든 ERP 파일의 단일 루트 디렉토리
# - 프로젝트 문서:  {file.base.dir}/project/...
# - 일반 전자문서:  {file.base.dir}/documents/...
file.base.dir=/data/erp_file
#file.upload.dir=./file_storage/approval

# === 일반 전자문서 (base/documents) FileServiceImpl 사용 ===
# Available variables: {userId}, {year}, {month}
file.storage.default.pattern=documents/general/{userId}/{year}/{month}
# Available variables: {userId}, {year}
file.storage.vacation.pattern=documents/vacation/{userId}/{year}
# Available variables: {userId}, {year}
file.storage.expense.pattern=documents/expense/{userId}/{year}

# === 프로젝트 문서 - 보고서 첨부파일 (base/project) ===
# FileServiceImpl 사용 | Available variables: {projectIdx}, {year}, {documentIdx}
file.storage.weekly-report.pattern=project/{projectIdx}/weekly-report/{year}
file.storage.general-weekly-report.pattern=documents/weekly-report/{userId}/{year}
file.storage.monthly-report.pattern=project/{projectIdx}/monthly-report/{year}

# === 프로젝트 문서 - 연구비증빙 첨부파일 (base/project) ===
# Available variables: {projectIdx}, {cardLastDigits}, {date}
file.project.receipt-meeting.pattern=project/{projectIdx}/{cardLastDigits}/receipt-meeting/{year}/{date}
file.project.receipt-overtime.pattern=project/{projectIdx}/{cardLastDigits}/receipt-overtime/{year}/{date}
file.project.receipt-trip.pattern=project/{projectIdx}/{cardLastDigits}/receipt-trip/{year}/{date}
file.project.receipt-trip-meeting.pattern=project/{projectIdx}/{cardLastDigits}/receipt-trip-meeting/{year}/{date}
file.project.receipt-purchase-material.pattern=project/{projectIdx}/{cardLastDigits}/receipt-purchase-material/{year}/{date}
file.project.receipt-purchase-equipment.pattern=project/{projectIdx}/{cardLastDigits}/receipt-purchase-equipment/{year}/{date}

# === 프로젝트 첨부파일 (ProjectFileServiceImpl) ===
file.storage.project.dir=${file.base.dir}/project
file.storage.project.pattern=project/{projectIdx}/attachment

# ============================================
# JSON Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# ============================================
# Error Handling
# ============================================
server.error.include-message=always
# Disable default Spring Boot Whitelabel Error Page (use custom error page)
server.error.whitelabel.enabled=false
# Forward errors to custom error controller
server.error.path=/error

# ============================================
# Google Calendar API Configuration
# ============================================
# API key obtained from Google Cloud Console
# Holiday data source: Google Calendar API (Primary) + Fallback Data (Secondary)
google.calendar.api.key=AIzaSyBppecl-kjtJg0ofXLukb_MJ5cftAwV5vM

# ============================================
# PDF Storage Configuration
# ============================================
# file.base.dir 하위에 통합
# - 일반 전자문서 PDF:  {file.base.dir}/documents/...
# - 프로젝트 문서 PDF:  {file.base.dir}/project/...
pdf.storage.path=${file.base.dir}

# 일반 전자문서 PDF 경로 패턴 (base/documents)
# Available variables: {userId}, {year}, {date}
pdf.storage.vacation.pattern=documents/vacation/{userId}/{year}
pdf.storage.expense.pattern=documents/expense/{userId}/{year}
pdf.storage.meeting.pattern=documents/meeting/{userId}/{year}/{date}

# 프로젝트 문서 PDF 경로 패턴 (base/project)
# Available variables: {projectIdx}, {cardLastDigits}, {date}, {year}
pdf.storage.project-weekly-report.pattern=project/{projectIdx}/weekly-report/{year}
pdf.storage.general-weekly-report.pattern=documents/weekly-report/{userId}/{year}
pdf.storage.receipt-meeting.pattern=project/{projectIdx}/{cardLastDigits}/receipt-meeting/{year}/{date}
pdf.storage.receipt-overtime.pattern=project/{projectIdx}/{cardLastDigits}/receipt-overtime/{year}/{date}
pdf.storage.receipt-trip.pattern=project/{projectIdx}/{cardLastDigits}/receipt-trip/{year}/{date}
pdf.storage.receipt-trip-meeting.pattern=project/{projectIdx}/{cardLastDigits}/receipt-trip-meeting/{year}/{date}

pdf.playwright.node-path: /usr/sbin/node
# 브라우저 전용 서버(Remote) 사용 시 아래 주소 설정
pdf.playwright.ws-endpoint: ws://192.168.1.172:39222/chromium/playwright

# ============================================
# PDF Generation Configuration
# ============================================
# Maximum concurrent PDF generation tasks (Playwright uses heavy resources)
# Remote Server(K3s) Size: 10 concurrent sessions capable
pdf.generation.max-concurrent=8

# Timeout for waiting in queue (seconds)
# If all slots are occupied, the request will wait up to this time
pdf.generation.timeout-seconds=30

# ============================================
# Observability (Actuator, Prometheus, OTLP)
# ============================================
otel.service.name=${spring.application.name:PINECNI-ERP}

# OTLP 서버가 죽어있는 동안 내보내기만 비활성화 (로그에 trace_id 추출을 위해 SDK는 활성화)
otel.sdk.disabled=false

# Log4j2 MDC 주입 설정
otel.instrumentation.log4j-context-data.enabled=true

# OTLP 프로토콜 설정 (HTTP 사용 - Spring Boot 3.5.6)
otel.exporter.otlp.protocol=http/protobuf
# Tracing (Spans) 설정
otel.exporter.otlp.traces.endpoint=${OTLP_ENDPOINT:http://192.168.1.172:30318/v1/traces}
# Metrics 설정 (Spring Boot 3.5.6용 올바른 엔드포인트 경로)
otel.exporter.otlp.metrics.endpoint=${OTLP_METRICS_ENDPOINT:http://192.168.1.172:30090/api/v1/otlp/v1/metrics}
# Sampling 설정 (비율 기반)
otel.traces.sampler=parentbased_always_on

# ============================================
# Actuator & Metrics Configuration
# ============================================
# Metrics 엔드포인트 노출
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown,env,configprops

# Prometheus 메트릭 내보내기
management.prometheus.metrics.export.enabled=true

# Micrometer OTLP Registry 설정 (Spring Boot 3.5.6)
# - Micrometer를 통해 JVM, CPU, 메모리 메트릭을 OTLP로 내보냄
management.metrics.export.otlp.enabled=true
management.metrics.export.otlp.step=1m
management.metrics.export.otlp.aggregation-temporality=cumulative

# JVM 메트릭 명시적 활성화 (기본값: true, 명시적 설정)
management.metrics.enable.jvm=true
management.metrics.binders.jvm.enabled=true
management.metrics.binders.logback.enabled=true
management.metrics.binders.process.enabled=true

# 유용한 메트릭 활성화
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
