# ============================================
# ERP Application Configuration
# ============================================

# Application Name
spring.application.name=erp

# Server Configuration
server.port=8080

# ============================================
# Database Configuration (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://192.168.1.165:15431/pinecni
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=erp_dev
spring.datasource.password=rdsdap1234!%

# Connection Pool (HikariCP - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=ERPConnectionPool

# ============================================
# JPA / Hibernate Configuration
# ============================================
# spring.jpa.hibernate.ddl-auto options: none | validate | update | create | create-drop
# update: Entity 변경시 스키마 자동 업데이트 (개발 중 편리하지만 데이터 충돌 가능)
# validate: Entity와 스키마 일치 여부만 검증 (운영 환경 권장)
# none: 아무 작업도 하지 않음
spring.jpa.hibernate.ddl-auto=none

# SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy for consistency with DB column conventions
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.pinecni.erp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================
# JSON Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# ============================================
# Error Handling
# ============================================
server.error.include-message=always
