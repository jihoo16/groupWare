# ============================================
# ERP Application Configuration
# ============================================

# Application Name
spring.application.name=PINECNI-ERP

# Server Configuration
server.port=8080

# ============================================
# Database Configuration (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://192.168.1.165:15431/pinecni?prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=erp_dev
spring.datasource.password=rdsdap1234!%

# Connection Pool (HikariCP - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ERPConnectionPool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA / Hibernate Configuration
# ============================================
# spring.jpa.hibernate.ddl-auto options: none | validate | update | create | create-drop
# update: Automatically updates schema on entity changes (convenient for dev but may cause data conflicts)
# validate: Only validates entity-schema consistency (recommended for production)
# none: No automatic schema operations
# Manually manage DDL when Entity changes
spring.jpa.hibernate.ddl-auto=none

# SQL Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy for consistency with DB column conventions
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# PostgreSQL LOB handling - use bytea instead of oid
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Timezone Configuration (Korea Standard Time)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ============================================
# Logging Configuration
# ============================================
#logging.file.path=/home/rocky/erp/logs
logging.file.path=./logs
logging.file.name=${logging.file.path}/erp-application.log

# Log levels
logging.level.root=INFO
logging.level.com.pinecni.erp=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Logback configuration file
logging.config=classpath:log4j2.xml

# Log file encoding
logging.charset.file=UTF-8
logging.charset.console=UTF-8


# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================
# File Storage Configuration
# ============================================
# Base directory for file storage (relative to project root)
# Folders will be created automatically if they don't exist
file.upload.dir=./file_storage/approval

# Document type specific path patterns
# Available variables: {year}, {month}, {projectIdx}, {projectName}, {documentIdx}
file.storage.weekly-report.pattern=weekly-report/{projectName}/{year}/{month}
file.storage.monthly-report.pattern=monthly-report/{projectName}/{year}/{month}
file.storage.default.pattern=general/{year}/{month}

# Project file storage configuration
file.storage.project.dir=./file_storage/project
file.storage.project.pattern={projectName}/{year}/{month}

# Receipt Meeting attachments storage path
file.upload.path=./file_storage/receipt-meetings

# ============================================
# JSON Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# ============================================
# Error Handling
# ============================================
server.error.include-message=always
# Disable default Spring Boot Whitelabel Error Page (use custom error page)
server.error.whitelabel.enabled=false
# Forward errors to custom error controller
server.error.path=/error

# ============================================
# Google Calendar API Configuration
# ============================================
# API key obtained from Google Cloud Console
# Holiday data source: Google Calendar API (Primary) + Fallback Data (Secondary)
google.calendar.api.key=AIzaSyBppecl-kjtJg0ofXLukb_MJ5cftAwV5vM

# ============================================
# PDF Storage Configuration
# ============================================
# Base directory for PDF storage
pdf.storage.path=./pdf_storage

# Document type specific path patterns
# Available variables: {year}, {userId}, {userIdx}, {date}, {projectIdx}
pdf.storage.vacation.pattern=vacation/{year}/{userId}
pdf.storage.expense.pattern=expense/{year}/{userId}
pdf.storage.meeting.pattern=meeting/{year}/{date}
pdf.storage.project-weekly-report.pattern=project/{year}/{projectIdx}
pdf.storage.receipt-meeting.pattern=receipt-meeting/{year}/{date}

pdf.playwright.node-path: /usr/sbin/node
# 브라우저 전용 서버(Remote) 사용 시 아래 주소 설정
pdf.playwright.ws-endpoint: ws://192.168.1.172:39222/chromium/playwright

# ============================================
# PDF Generation Configuration
# ============================================
# Maximum concurrent PDF generation tasks (Playwright uses heavy resources)
# Recommended: 2-3 for standard servers, 1 for low-spec servers
pdf.generation.max-concurrent=2

# Timeout for waiting in queue (seconds)
# If all slots are occupied, the request will wait up to this time
pdf.generation.timeout-seconds=30

# ============================================
# Observability (Actuator, Prometheus, OTLP)
# ============================================
otel.service.name=${spring.application.name:PINECNI-ERP}

# OTLP 서버가 죽어있는 동안 내보내기만 비활성화 (로그에 trace_id 추출을 위해 SDK는 활성화)
otel.sdk.disabled=false

# Log4j2 MDC 주입 설정
otel.instrumentation.log4j-context-data.enabled=true

# OTLP 프로토콜 설정 (HTTP 사용)
otel.exporter.otlp.protocol=http/protobuf
# Tracing (Spans) 설정
otel.exporter.otlp.traces.endpoint=${OTLP_ENDPOINT:http://192.168.1.205:4318/v1/traces}
# Metrics 설정
otel.exporter.otlp.metrics.endpoint=${OTLP_METRICS_ENDPOINT:http://192.168.1.190:9090/api/v1/otlp/v1/metrics}
# Sampling 설정 (비율 기반)
otel.traces.sampler=parentbased_always_on
# 필두에 요청하신 Actuator 엔드포인트 노출 설정은 유지합니다 (Prometheus 등용)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown,env,configprops
management.prometheus.metrics.export.enabled=true
